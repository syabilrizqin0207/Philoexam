  qs: [
    { id: 'c3-01', t: 'set', topic: `Validity & soundness`, src: `2018 Q1`, q: `"If all actions are determined by a series of prior events, then our actions cannot be free. All actions are causally influenced by some prior events. For example, your choice of food at lunch is influenced by your taste and preferences, advertisements, peers... Therefore, our actions cannot be free."`,
      opts: [[0], [0, 1], [1, 2], [2, 3]],
      s: [
        [`Whether this is a valid argument depends solely on whether "being causally influenced" is equivalent to "being determined".`, true, `If they are equivalent, the form is If P then Q, P, so Q (valid). If not, the premises talk about different things.`],
        [`Whether this is a sound argument depends solely on whether "being causally influenced" is equivalent to "being determined".`, false, `Soundness also needs every premise to be true.`, 'solely'],
        [`This is a sample-projection argument.`, false, `No sample-projection form.`],
        [`This is a statistical syllogism.`, false, `No "N% of A's are B" premise.`]
      ] },
    { id: 'c3-02', t: 'set', topic: `Deductive vs inductive`, src: `2018 Q2`, q: `"(1) The effect of a gene is a property of the gene in interaction with the recent history of its local surroundings in the embryo. (2) If the effect of a gene is its property in interaction with the recent history of its local surroundings in the embryo, then a gene at one local surrounding will have a totally different effect from the same gene in a different local surrounding. (3) A gene turned on in cells at the base of the spinal cord in the third week of development will have a totally different effect from the same gene turned on in cells of the shoulder in the sixteenth week."`,
      s: [
        [`This is a deductive argument if (3) is the conclusion.`, true, `P, If P then Q, so R (a case of Q). If (1) and (2) are true, (3) cannot be false.`],
        [`This is an inductive argument if (1) is the conclusion.`, true, `If P then Q, an instance of Q, so P. A true consequent supports but does not force the antecedent.`, 'switch-conclusion']
      ] },
    { id: 'c3-03', t: 'set', topic: `Deductive vs inductive`, src: `2018 Q4`, q: `"If it is true (as it is) that the whole point of justifying inductive inference is to show that inductive inference is truth-conducive, then any attempts to justify inductive inference by using inductive inference will not work (since whether inductive inference can yield truth is in question). Thus, it's clear that one cannot justify inductive inference with inductive inference."`,
      s: [
        [`This is not an argument.`, false, `"Thus" introduces the conclusion; the first sentence is the premise set.`],
        [`This is a deductive argument.`, true, `"(as it is)" asserts P, giving If P then Q, P, so Q.`, 'as-it-is'],
        [`This is an inductive argument.`, false, `It is deductive.`],
        [`The conclusion might be false even if this is a sound argument.`, false, `A sound argument is valid with all true premises, so its conclusion cannot be false.`]
      ] },
    { id: 'c3-04', t: 'mcq', topic: `Validity & soundness`, src: `GEX23 Q5`, trap: 'valid-sound', q: `"Everyone who has visited Kyiv must have been to Moscow. Angie visited Kyiv a month before Ukraine was invaded by Russia. Therefore, Angie must have been to Moscow." Which is TRUE?`,
      o: [`This is a valid argument.`, `This is an inductive argument.`, `This is a sound argument.`, `This is a cogent argument.`],
      a: 0, why: `All F's are G, x is F, so x is G: valid. It is deductive, so B and D are wrong. The first premise is false, so it is not sound.` },
    { id: 'c3-05', t: 'set', topic: `Compound propositions`, src: `GEX23 Q6`, q: `"It is not the case that if asteroid Bennu has an outside chance of hitting the earth within the next 300 years and a sample of materials had been scooped up from this asteroid by the Osiris-Rex spacecraft then Nasa landed the sample of this asteroid in a capsule that came down in the West Desert of Utah."`,
      s: [
        [`We can deductively infer that a sample of materials had been scooped up from the asteroid by Osiris-Rex.`, true, `~((B·S)⊃N) gives (B·S) true and N false. So S is true.`, 'neg-cond'],
        [`We can deductively infer that Nasa didn't land the sample in a capsule in the West Desert of Utah.`, true, `N is false.`, 'neg-cond'],
        [`We can only infer the previous statement if another premise is added.`, false, `No extra premise is needed: a negated conditional gives both facts.`, 'neg-cond']
      ] },
    { id: 'c3-06', t: 'mcq', topic: `Compound propositions`, src: `GEX23 Q24`, trap: 'not-both', q: `"It is not the case both that everyone should cut down on eating out and that if many people eat out frequently then food prices will continue to rise. Food prices will continue to rise." What can you deductively infer?`,
      o: [`Many people eat out frequently.`, `It is not the case that many people eat out frequently.`, `Everyone should cut down on eating out.`, `It is not the case that everyone should cut down on eating out.`],
      a: 3, why: `Premise 1: ~(E·(M⊃F)). F is true, so (M⊃F) is true. Then E cannot also be true, so ~E. Nothing follows about M.` },
    { id: 'c3-07', t: 'set', topic: `Validity & soundness`, src: `GEX23 Q25`, q: `"It is not the case both that Fido is a mammal and not a rabbit. Fido is not a rabbit. Therefore, Fido is not a mammal."`,
      s: [
        [`The argument is invalid.`, false, `~(M·~R) and ~R: if M were true, M·~R would be true, contradicting premise 1. So ~M is forced: valid.`, 'odd-but-valid'],
        [`The argument is valid.`, true, `The conclusion cannot be false when both premises are true.`, 'odd-but-valid'],
        [`The argument is cogent.`, false, `It is deductive, so "cogent" does not apply.`, 'cogent-deductive']
      ] },
    { id: 'c3-08', t: 'set', topic: `Compound propositions`, src: `2018 Q3`, q: `"If your laptop runs Windows 10 version 1803 and does not run McAfee antivirus, then Toshiba Health Monitor will work."`,
      opts: [[0], [1], [0, 2], [0, 1, 2, 3]],
      s: [
        [`From this statement we cannot deductively infer that "If your laptop runs both Windows 10 version 1803 and McAfee antivirus, then Toshiba Health Monitor will not work".`, true, `"E and M" makes the antecedent (E·~M) false. Inferring ~T from that is denying the antecedent.`, 'deny-ant'],
        [`From this statement we can deductively infer that "If your laptop runs Windows 10 version 1709 rather than version 1803, then Toshiba Health Monitor will not work".`, false, `Again denying the antecedent.`, 'deny-ant'],
        [`If premise 2 is "Your laptop runs Windows 10 version 1803 and does not run McAfee antivirus", it follows deductively that "Toshiba Health Monitor will work".`, true, `Modus ponens.`],
        [`If premise 2 is "Toshiba Health Monitor will not work", it follows deductively that "Your laptop runs McAfee antivirus".`, false, `Modus tollens only gives "not both 1803 and no McAfee". The laptop might simply not run 1803.`, 'not-both']
      ] },
    { id: 'c3-09', t: 'mcq', topic: `Compound propositions`, src: `Original`, q: `"If the NEA declares a dengue cluster in Bukit Batok and the void deck has stagnant water, then fogging will be carried out. Fogging was not carried out. The NEA declared a dengue cluster in Bukit Batok." What can be deductively inferred?`,
      o: [`The void deck has stagnant water.`, `The void deck does not have stagnant water.`, `The NEA did not declare a dengue cluster.`, `Nothing about the void deck follows.`],
      a: 1, why: `((D·S)⊃F) and ~F give ~(D·S) by modus tollens. With D true, S must be false.` },
    { id: 'c3-10', t: 'mcq', topic: `Compound propositions`, src: `Original`, trap: 'neg-cond', q: `"It is not the case that if Wei Ling revises at the Central Library, she will pass." What follows deductively?`,
      o: [`Wei Ling does not revise at the Central Library.`, `Wei Ling revises at the Central Library and she will not pass.`, `Wei Ling will pass only if she does not revise at the library.`, `Nothing follows without another premise.`],
      a: 1, why: `~(P⊃Q) = P·~Q. The conditional is false only when the antecedent is true and the consequent false.` },
    { id: 'c3-11', t: 'mcq', topic: `Compound propositions`, src: `Original`, q: `Let P be true, Q false and R true. Which compound is FALSE?`,
      o: [`~(P·Q)⊃R`, `(P⊃Q)∨~R`, `(P≡Q)⊃R`, `Q⊃~R`],
      a: 1, why: `P⊃Q is T⊃F = false; ~R is false; false ∨ false = false. A: ~(F) = T, T⊃T = T. C: F⊃T = T. D: F⊃F = T.` },
    { id: 'c3-12', t: 'mcq', topic: `Compound propositions`, src: `L3 slide`, q: `When is "If I take the Circle Line, I will be late" false?`,
      o: [`Only when I don't take the Circle Line.`, `Only when I take the Circle Line and I am not late.`, `Whenever I am late.`, `Only when I don't take the Circle Line and I am late.`],
      a: 1, why: `A material conditional is false only when the antecedent is true and the consequent is false.` },
    { id: 'c3-13', t: 'mcq', topic: `Compound propositions`, src: `Original`, trap: 'not-both', q: `"It is not the case both that Lau Pa Sat is open and that it is raining." From this premise ALONE, what follows?`,
      o: [`Lau Pa Sat is not open.`, `It is not raining.`, `At least one of "Lau Pa Sat is open" and "it is raining" is false.`, `Lau Pa Sat is not open and it is not raining.`],
      a: 2, why: `~(P·Q) = ~P∨~Q: not both. You cannot get ~P alone or ~Q alone without a further premise.` },
    { id: 'c3-14', t: 'set', topic: `Validity & soundness`, src: `L3 slide`, q: `On truth values and validity:`,
      s: [
        [`An argument with all true premises and a false conclusion can be valid.`, false, `Never. That combination shows the argument is invalid.`, 'tp-fc'],
        [`An argument with a false premise and a false conclusion can be valid.`, true, `The UK firearms example.`, 'tp-fc'],
        [`A sound argument can have a false conclusion.`, false, `Valid + all premises true guarantees a true conclusion.`],
        [`A valid argument can have false premises and a true conclusion.`, true, `"All cats are fish. All fish are mammals. ∴ All cats are mammals."`]
      ] },
    { id: 'c3-15', t: 'mcq', topic: `Argument forms`, src: `L3 Argument 2`, trap: 'deny-ant', q: `"If you get an A in effective reasoning, the dean will praise you. You don't get an A in effective reasoning. Therefore, the dean won't praise you." This argument is...`,
      o: [`valid, by modus tollens`, `invalid: it denies the antecedent`, `valid, by modus ponens`, `invalid: it affirms the antecedent`],
      a: 1, why: `If P then Q, not P, so not Q is invalid. The dean might praise you for something else.` },
    { id: 'c3-16', t: 'mcq', topic: `Argument forms`, src: `Supp`, trap: 'deny-ant', q: `"If it rained, the road along Orchard is wet. The road along Orchard is wet. So it rained." This argument is...`,
      o: [`valid, because the premises are true`, `invalid: it affirms the consequent`, `valid, by modus tollens`, `sound`],
      a: 1, why: `If P then Q, Q, so P is invalid. A burst pipe could wet the road.` },
    { id: 'c3-17', t: 'set', topic: `Argument forms`, src: `L3 / T3`, q: `Which arguments are valid?`,
      s: [
        [`"Either the tutorial is at UTown or at AS1. It is not at UTown. So it is at AS1."`, true, `Disjunctive syllogism.`],
        [`"If Americans pursue their present policies in the Persian Gulf, they will antagonize the leaders of Iran. If the leaders of Iran are antagonized, they will start a war. So, if Americans pursue their present policies in the Persian Gulf, the leaders of Iran will start a war."`, true, `If P then Q, If Q then R, so If P then R.`],
        [`"If you get an A, the dean will praise you. The dean doesn't praise you. So you don't get an A."`, true, `Modus tollens (L3 Argument 1).`],
        [`"If the hawker centre is closed, Ah Seng eats at home. Ah Seng eats at home. So the hawker centre is closed."`, false, `Affirming the consequent.`, 'deny-ant']
      ] },
    { id: 'c3-18', t: 'set', topic: `Valid by meaning`, src: `T3 3.1`, q: `Which arguments are deductive because of the meanings of their words (a hidden definitional premise)?`,
      s: [
        [`"John is Mary's brother. Therefore, Mary has a brother."`, true, `If y is x's brother, x has a brother.`, 'hidden-definition'],
        [`"The Student Council meeting began at 11am and ended at 2pm. Thus, the Council meeting lasted three hours."`, true, `Duration = end − beginning (same day, no break).`, 'hidden-definition'],
        [`"Four tickets to the graduation ceremony are reserved for each graduating senior. There are 150 graduating seniors. So 600 graduation tickets are reserved for seniors."`, true, `Total = persons × tickets each.`, 'hidden-definition'],
        [`"Most who live in France speak French. Pierre lives in France. This is all we know. Therefore, Pierre speaks French."`, false, `Inductive: "most" supports but does not imply.`]
      ] },
    { id: 'c3-19', t: 'mcq', topic: `Validity & soundness`, src: `L3 slide`, trap: 'valid-sound', q: `"If someone is a human, then that person is a woman. Our logic teacher is a human. Therefore, our logic teacher is a woman." This argument is...`,
      o: [`valid and sound`, `valid but unsound`, `invalid but sound`, `cogent`],
      a: 1, why: `If P then Q, P, so Q is valid. The first premise is false, so it is unsound.` },
    { id: 'c3-20', t: 'set', topic: `Deductive vs inductive`, src: `L3 slide`, q: `On key terms:`,
      s: [
        [`Truth applies to statements; validity applies to arguments.`, true, `A statement is true or false; an argument is valid or invalid.`],

        [`Because valid arguments give no new information, they are trivial.`, false, `The link can be non-obvious: m and n even ⇒ m+n even needs a proof.`]

    { id: 'c3-21', t: 'mcq', topic: `Compound propositions`, src: `L3 slide`, q: `"I went to Paris iff I went to Quebec" is true when...`,

    { id: 'c3-22', t: 'mcq', topic: `Valid by meaning`, src: `T3 3.1`, q: `"Joe paid $3,000 to have five hundred copies of his drawing printed and $200 to rent space. Since he is charging only $50 for each print, he will need to sell at least sixty-four of them to recover his costs." This argument is...`,

/* Chapter 4 — Meaning & Definitions 1 [L4] [T3] */
RL.chapter({
  n: 4, code: 'RL4', lec: 'L4 · T3', title: `Meaning & Definitions 1`, short: `Definitions 1`,
  place: `National Library`, spot: `Victoria Street, Level 7 reading room`, icon: 'book', sky: 404,
  mentor: ['johnson'], mentorName: `Dr. Johnson`,
  story: [
    `Shh. Welcome to the reading room. I am Dr. Johnson, and I once wrote a dictionary, so I take definitions personally.`,
    `A lexical definition reports how a word is currently used. To test one, swap the word and the definition in a sentence. If the meaning changes, the definition fails.`,
    `There are five rules and seven flaws: too broad, too narrow, circular, poorly understood terms, poor match in vagueness, poor match in emotional tone, non-essential properties.`,
    `And mind the reason clause. A correct flaw with the wrong reason is still wrong.`
  ],
  win: `Splendid. Not a single "featherless biped" got past you. Your next station is the Gardens by the Bay.`,
  cards: [
    { t: `Clarity and argumentation`, b: `Clarity affects **soundness** (judging whether a premise is true). It does **not** affect **validity** when the argument has an explicitly valid form.\n\n"If there's a cosmic force, then there's a God. There's a cosmic force. ∴ There is a God." Valid whatever "cosmic force" means, but you cannot judge the premises until it is made clear.` },
    { t: `Uses of language`, b: `- Indicative/declarative: "Washington D.C. is the capital of United States"\n- Interrogative: "What is your name?"\n- Imperative: "Submit your essay before the last class."\n- Exclamatory: "What a despicable act!"\n\nArguments mainly give reasons for an assertion; they can also raise a question, call for action or express feelings.\n\n**Emotions** have a place in life but **no place in rational argumentation**; emotional language expresses feelings rather than giving a reasoned case.` },
    { t: `Definitions`, b: `A **definition** expresses the meaning of a word or phrase using other words, and can be used interchangeably with it. "Police officer" = "a member of an organisation whose job is to keep public order and prevent and solve crime".\n\n**Lexical:** current usage. **Stipulative:** one's own usage (Chapter 5).` },
    { t: `Interchange test`, b: `A definition is incorrect if switching term and definition produces sentences with **different meanings**.\n\n"James is a bachelor" / "James is an unmarried man": same meaning, passes.\n"James is a bachelor" / "James is a happy man": different, fails.\n\n**Qualifications:**\n- Use only the intended sense ("bank" as money vs river).\n- Do **not** use sentences with the term or definition in quotes. "'Bachelor' has eight letters" is true but "'Unmarried man' has eight letters" is false; that says nothing about the definition.` },
    { t: `Rule 1: not too broad or too narrow`, b: `**Too broad (tb):** something fits the definition but not the term. "Bachelor" = "a man": some men are not bachelors.\n\n**Too narrow (tn):** something fits the term but not the definition. "Bachelor" = "an unmarried male astronaut": some bachelors are not astronauts.\n\n**Both:** "Bachelor" = "a man studying at NUS" lets in married NUS men and leaves out bachelors outside NUS.` },
    { t: `Rule 2: no circularity, no obscure terms`, b: `**Circular (ci):** uses the whole term or a same-root word. "True" = "something known to be true". "Philosopher" defined with "philosophy".\n\nUsing **one word of a multi-word phrase** is not automatically circular (2018 key).\n\n**Poorly understood terms (pu):** the definition's words are hard. "Good" = "having a positive aretaic value". A hard **term** with a plain definition is fine.` },

    { t: `Meaning by examples`, b: `If meanings could only be explained by definitions, there would be an **infinite regress**: every definition uses words that need defining. So some words must be explained by **examples**, e.g. "green" by pointing to green objects. Examples are especially useful for abstract terms.` },
    { t: `Logical positivism (LP)`, b: `**Verifiability criterion of meaning:** a sentence is meaningful just in case it is **true by definition** OR its truth/falsity is **at least in principle verifiable by observable evidence** (you can think of an observable situation that shows it true or false).\n\n**Observation** = perception unaided by instruments that change the power and limits of human senses (e.g. a microscope).` },
    { t: `Problems for LP`, b: `**Problem 1:** much of theoretical science would be meaningless. Theories about unobservables (electrons, DNA) fail the test. On a **stricter** version, universal generalisations over **infinite populations** (f = ma) are meaningless too, since no finite set of observations verifies them.\n\n**Problem 2:** the LP theory is inconsequential (slide wording).\n\nLooser LP: "All ravens are black" can be meaningful because seeing a blue raven would falsify it.` },
    { t: `Pragmatism (PR)`, b: `An **empirical** sentence is meaningful just in case its truth/falsity could make a **practical difference** to someone: a difference to what one would **experience** OR to what one **ought to choose**.\n\nHedonism ("only pleasure is worth pursuing in life") is meaningful because it changes what one ought to choose.\n\nWeak spot: counts many metaphysical and religious claims as meaningful.` },

RL.chapter({

  mentor: ['pascal'], mentorName: `Ah Pascal`,
  story: [
    `Huat ah! I'm Ah Pascal. Every CNY the whole block gathers at this void deck for cards and dice, and every year I win the arguments, not the money.`,
    `Inductive arguments only make conclusions more likely. Your job is to say how likely. P-inductive means more probable than not. C-inductive means only more probable than before.`,

  win: `Ong ah! You count cards like a mathematician. Next stop: Jewel Changi Airport.`,
  cards: [
    { t: `Inductive arguments`, b: `**Inductive:** the premise set supports or confirms the conclusion without implying it. Key question: what is the **degree** of support?\n\n**P-inductive:** premises make the conclusion **more probable than not**. "70% of residents in city A voted for Obama. James is a resident in city A. (This is all we know.) ∴ James voted for Obama."\n\n**C-inductive:** premises **increase** the probability of the conclusion. "All observed ravens are black. (This is all we know.) ∴ All ravens are black."\n\nAdd "the observed ravens are a sufficiently large and diverse sample" and it becomes P-inductive.` },
    { t: `Statistical syllogism`, b: `N% of A's are B (50<N<100)\nx is an A\n(This is all we know about the matter)\n∴ x is B\n\nThe slide says **strictly** the conclusion should be "x is B" (not "it is N% probable that x is B").\n\n**Statistical probability:** if N% of A's are B and x is A, the statistical probability of "x is B" is N%.\n\n**Cogent:** strong inductive + all premises true. Extra information about x can change the support.` },
    { t: `Classical approach and odds`, b: `**Pr(A)** = favourable cases / total cases.\n- 2 heads in 2 tosses: 1 of 4 (HH, HT, TH, TT) = 1/4.\n- Even number on a die: 3/6 = 1/2.\n\n**Odds in favour** = f to u. Even number: 3 to 3.\n**Odds against** = u to f. Ace from a deck: 48 to 4 = 12 to 1.\n\n**Converting:** odds in favour f:u or odds against u:f both give Pr = f/(f+u). Odds against 11:23 → Pr = 23/34 ≈ 0.68.` },
    { t: `Rules 1–3`, b: `**1. Necessary truth:** Pr = 100%. "Heads or not heads."\n**2. Contradiction:** Pr = 0%. "Both heads and not heads."\n**3. Negation:** Pr(~A) = 100% − Pr(A). Not an ace: 1 − 4/52 = 48/52 = 12/13.` },
    { t: `Rules 4–5: AND`, b: `**4. Restricted conjunction:** Pr(A·B) = Pr(A) × Pr(B), **only if independent**. Two sixes in two throws: 1/6 × 1/6 = 1/36.\n\n**5. General conjunction:** Pr(A·B) = Pr(A) × Pr(B|A). Ace then ace without replacement: 4/52 × 3/51 = 1/221.\n\nNot independent iff Pr(B|A) ≠ Pr(B).\n\n**Chain:** Pr(A·B·C) = Pr(A) × Pr(B|A) × Pr(C|A·B). Michigan: 60% × 80% × 30% = 14.4%.\n\n**Rearranged:** Pr(B|A) = Pr(A·B)/Pr(A).` },
    { t: `Rules 6–7: OR`, b: `**6. Restricted disjunction:** Pr(A∨B) = Pr(A) + Pr(B), **only if mutually exclusive**. Queen or king: 4/52 + 4/52 = 8/52.\n\n**7. General disjunction:** Pr(A∨B) = Pr(A) + Pr(B) − Pr(A·B). Queen or spade: 4/52 + 13/52 − 1/52 = 16/52.\n\n**Independent ≠ mutually exclusive.** Independent (for AND): one does not change the other's probability. Mutually exclusive (for OR): cannot both happen.` },
    { t: `Checklist: computing a probability`, b: `- Letter each event; write the target as a compound (A·B, A∨B, ~A).\n- Equally likely outcomes? List them: 2 coins (4), 3 coins (8), 2 dice (36), cards (52 minus known cards).\n- "Not" = 100% minus.\n- "And": independent → multiply; dependent ("without replacement", "given", "% of those with X") → Pr(A) × Pr(B|A).\n- "Or": exclusive → add; overlap → add then subtract Pr(A·B).\n- Convert to odds if asked.\n- Check wording: "more than 50%" excludes 50%; check claims to the decimal.` },
    { t: `Tutorial workings (T4)`, b: `- **Cubs/Mets:** Pr(play) = 40%; Pr(win) = 40% × 20% = **8%**.\n- **Rose Bowl:** 60% × 80% × 30% = **14.4%**.\n- **Blackjack:** 7 cards out (your ace + 6 discards, none worth 10), 45 left, 16 ten-value cards: **16/45 = 35.6%**.\n- **Defence:** defend pass = 60%×70% + 40%×40% = 58%; defend run = 60%×50% + 40%×80% = **62%** → defend the run.` },
    { t: `Two dice grid`, b: `36 equally likely outcomes.\n- Sum > 9: (4,6)(5,5)(6,4)(5,6)(6,5)(6,6) = 6/36 = **1/6**.\n- Sum of 6: (1,5)(2,4)(3,3)(4,2)(5,1) = **5/36**.\n- Sum of 7: 6/36 = 1/6.\n- 6 then 1 (ordered): 1/36, so odds against **35:1**.\n- Sum divisible by 3: 12/36.` },

    { id: 'c6-05', t: 'mcq', topic: `Conjunction rules`, src: `T4 5.2a:2`, q: `"Suppose the Cubs and Mets play baseball today. There's a 60% chance of rain, which would cancel the game. If the teams play, the Cubs have a 20% chance of winning. What chance do the Cubs have of winning today?"`,

    { t: `The action rule`, b: `A rational person aims to **maximise expected utility** and chooses the action with the highest EU.\n\nEU(X) = Pr(A)×U(A,X) + Pr(B)×U(B,X) + ...\n\nWin $510 on a 6, lose $100 otherwise: EU(bet) = 1/6 × 510 + 5/6 × (−100) = **1.67**; EU(don't bet) = 0, so bet.\n\nMaximising EU = choosing the **least expected cost**. Ticket 1: $250, free date change. Ticket 2: $200 + 0.4 × $125 = $250. **Equal**.` },
    { t: `Four interpretations`, b: `"The probability of heads is 50%" means...\n- **Frequentist:** 50% of all observed tosses yield heads (ratio of observed frequencies).\n- **Classical:** 50% of all possible outcomes are favourable (ratio of abstract possibilities).\n- **Subjectivist:** my degree of confidence is 50% (actual confidence).\n- **Rational credence:** an ideally rational reasoner's confidence would be 50%.` },
    { t: `EU checklist`, b: `- List actions (rows) and outcomes (columns).\n- Multiply each outcome's probability by its utility. Keep signs; losses are negative.\n- Sum per action. Pick the highest EU (or lowest expected cost).\n- Insurance: the most you should pay = the expected cost it covers.\n- Check whether money already spent counts (Mushy: lose everything = −L).` },
    { t: `Worked answers`, b: `- **3 coins, A = 2H1T:** 3/8 = 37.5%, not > 50%, so don't believe A.\n- **A∨B (2H1T or 2T1H):** 6/8 = 3/4, so believe it.\n- **Bank vs Mushy:** bank 0.1L; Mushy 0.01×120L − 0.99L = **0.21L** → Mushy.\n- **Insurance:** 1% × $10,000 = **$100** a year at most.\n- **Mushy vs Enormity stock:** 30%×80% − 70%×20% = 10% vs **11%** → Enormity.\n- **Cut-Rate vs Enormity PC:** $600 + 60%×$600 = $960 vs **$900** → Enormity.` },

  n: 8, code: 'RL8', lec: 'L8 · T5', title: `Sample, Analogy & Causation`, short: `Samples, Analogy, Mill`,
  place: `Pulau Ubin`, spot: `Kampong makan, after the bumboat`, icon: 'house', sky: 808,
  mentor: ['mill'], mentorName: `Detective Mill`,
  story: [
    `Detective Mill, at your service. Four guests at last night's kampong makan. Two fell ill. Someone at this table will tell me what caused it.`,
    `First, samples. A large, varied sample and a cautious conclusion make a strong projection. Six hotel staff in Rome do not tell you about all Italians.`,
    `Second, analogies. Relevant similarities strengthen, relevant differences weaken, and the colour of a book cover is irrelevant.`,
    `Third, my methods: agreement, disagreement, difference, variation. Learn which one a passage uses, and what each one lets you conclude.`
  ],
  win: `Case closed. It was the satay, as you deduced. Well, induced. Next: the labs at one-north.`,
  cards: [
    { t: `Three inductive forms`, b: `**Statistical syllogism:** N% of A's are B (50<N<100) / x is an A / (all we know) / ∴ x is B. Population → individual.\n\n**Sample projection:** N% of examined A's are B / a large and varied group of A's has been examined / ∴ probably roughly N% of all A's are B. Sample → population.\n\n**Analogy syllogism:** most things true of X are also true of Y / X is A / (all we know) / ∴ probably Y is A. "A university is like a business..."` },
    { t: `Strong samples`, b: `Three factors: **(1) sample size, (2) variety of sample, (3) cautiousness of conclusion.**\n\n**Representative (stratified) sample:** subgroups represented in the right proportions.\n**Random sample:** each member has an equal chance to be chosen.\n\n"Italians are fat and lazy: all six hotel staff in Rome were." Weak: tiny, not varied, sweeping conclusion.\n"Exactly 78.4% of Loyola students born in Chicago": too precise; say "roughly 78.4%".` },
    { t: `Analogies`, b: `Relevant similarities **strengthen**; relevant differences **weaken**; trivial ones are **irrelevant**. No hard and fast rules; background knowledge plays a role.\n\nTextbook analogy ("my logic book covers analogy, so Sarah's likely does"): different colour = irrelevant; same chapters = strengthens; taught by a maths lecturer = weakens.\n\nTony's ethics course: same teacher transferring = strengthens; Tony's was medical ethics, yours general ethical theory = **strengthens** (background knowledge); teacher's reputation = irrelevant.` },
    { t: `Mill: agreement`, b: `**Premises:** A occurred **more than once**. B is the **only additional factor** that occurred if A occurred (iff).\n**Conclusion:** probably B caused A, **or** A caused B.\n\nPicnic table: sickness occurred twice (Alice, David). Pie is the only food eaten by exactly the people who got sick. So probably pie caused the sickness, or the reverse.` },
    { t: `Mill: disagreement`, b: `**Premises:** A occurred in some case. B didn't occur in that same case.\n**Conclusion:** A doesn't **necessarily** cause B (A is not a total cause of B).\n\nBob ate ice cream but was not sick, so eating ice cream doesn't necessarily cause sickness.\n\nPeople who **deny** a causal claim by pointing to cases where the cause occurred without the effect are using disagreement (2018 Q16, welfare).` },
    { t: `Mill: difference and variation`, b: `**Difference:** A occurred in case 1 but not case 2; the cases are otherwise identical except B also occurred in case 1. Conclusion: probably B is (or is part of) the cause of A, or A is (or is part of) the cause of B. Works with a one-off pair (ants on the rock slab).\n\n**Variation:** A changes in a certain way if B changes in a certain way (degrees). Conclusion: probably B caused A, **or** A caused B, **or some C caused both**. Pie slices vs how sick.` },
    { t: `Which method?`, b: `- Conclusion "X doesn't necessarily cause Y" (cause present, effect absent) → **disagreement**.\n- Correlation in amounts/degrees → **variation** (remember the common cause).\n- Two otherwise identical cases, one factor differs → **difference**.\n- Effect occurred more than once, one factor present iff effect → **agreement**.\n- Factors always together, never separated → **no method** (hangover).\n- One-way "All F are G" + contrapositive ≠ iff (mooncake app).\n\nNarrow the "or" options with time order, common cause (night/day) and reverse causation (headband).` },
    { t: `Tutorial passages (T5)`, b: `- Reaction time after drinks: **difference**; reverse ruled out by time order.\n- Bacteria + food particles → cavities: combine into B·F; **agreement (or difference)**.\n- Scotch/gin/rum + soda → hangover: **no method** (soda always present).\n- Ants on the rock slab: **difference**; agreement fails (effect once).\n- Fluoride towns / fluoride groups: **difference (or agreement)**.\n- Matches: combine (H∨S)·(D·O); **agreement (or difference)**.\n- Night and day: agreement doesn't apply; **common cause** (Earth's rotation).\n- Kurt's headband: agreement or difference; reverse causation possible.\n- Inflation vs national debt: **variation**.` },
    { t: `Easy to mix up`, b: `- Statistical syllogism (population → individual) vs sample projection (sample → population).\n- Sample projection (large, varied, cautious) vs false stereotype (isolated cases → all).\n- Agreement (several occurrences, one common factor) vs difference (two otherwise identical cases).\n- Difference (concludes a cause) vs disagreement ("not necessarily a cause").\n- Random (equal chance) vs representative (right proportions).` },
    { t: `Trap check`, b: `- Do not name a method the passage never shows someone using (2018 Q16 I).\n- Agreement needs the effect more than once.\n- "Closest to analogy" = look for "most things true of X are true of Y" (Singapore/JB satay).\n- "All F are G" + its contrapositive adds nothing: no iff.\n- Several tutorial slides accept "agreement (or difference)".` }

    [`Statistical syllogism reasons from a sample to a population.`, false, `That is sample projection. Statistical syllogism: population → individual.`],

    [`"All F are G" plus its contrapositive establishes F iff G.`, false, `The contrapositive adds no new information.`]
  ],
  qs: [
    { id: 'c8-01', t: 'set', topic: `Analogy`, src: `2018 Q15`, q: `"Corporate executives who knowingly sell cars with a defective design that is likely to cost the lives of their users are guilty of intentional killing. Likewise, those who eat pizzas and biscuits and use beauty products are guilty of intentional killing as well, because these are some of the thousands of products that contain palm oil, and the production of palm oil threatens the survival of orangutans through deforestation."`,
      opts: [[0, 1, 2], [0], [2], [1, 2]],
      s: [
        [`There are no relevant similarities between manufacturing defective cars and using palm oil products.`, false, `Both are linked to the killing of living beings, which is relevant to "intentional killing".`, 'relevance-analogy'],
        [`That selling cars is an act of selling while using these palm oil products is not an act of selling is NOT a relevant difference.`, true, `Selling vs using has nothing to do with whether it is intentional killing.`, 'relevance-analogy'],
        [`That corporate executives knowingly sell defective cars whilst many people who use palm oil products do not know they are linked to the survival of orangutans is a relevant difference.`, true, `Knowledge is central to whether an act is intentional.`, 'relevance-analogy']
      ] },
    { id: 'c8-02', t: 'set', topic: `Mill's methods`, src: `2018 Q16`, q: `"Some policy makers and politicians contend that the reduction in welfare caseload observed in the early 2000s was caused by the economic growth in the 1990s. Detractors retort that this contention does not hold up to empirical scrutiny because economic expansions in other historical periods did not generate similar degrees of reduction in welfare caseloads. For example, the economic growth in 1980s didn't result in reduction of the total number of welfare recipients. In fact, the economic boom in the mid to late 1960s actually saw a dramatic increase in welfare caseload."`,
      s: [
        [`Those who argue that the reduction was caused by 1990s growth use the method of disagreement.`, false, `The passage never shows what argument the politicians used.`, 'unseen-method'],
        [`The detractors' reasoning is closest to the method of difference.`, false, `Growth occurred without a fall in caseload: that is the disagreement pattern.`, 'deny-causal'],
        [`The detractors' implicit main conclusion is that economic growth didn't necessarily cause the reduction in welfare caseload.`, true, `Disagreement's conclusion.`],
        [`The detractors' implicit main conclusion is that economic growth caused increase in welfare caseload.`, false, `The 1960s example hints at this, but it is not their main conclusion.`]
      ] },
    { id: 'c8-03', t: 'mcq', topic: `Analogy`, src: `GEX23 Q15`, q: `Which argument is closest to an analogical argument?`,
      o: [`"If there is an all-powerful, all-knowing, and perfectly good God, then there won't be any suffering in the world. There is suffering in the world. Therefore, there isn't such a God."`,
        `"Most things true of the types of food in Singapore are true of the types of food in Johor Bahru (JB). Chicken satays are available in Singapore. Chicken satays are also available in JB."`,
        `"Esther's mother has won many singing competitions. Yet Esther is tone deaf. Therefore, daughters are not always better than their mothers."`,
        `"Everyone who ate curry chicken at restaurant X last night had diarrhoea... Among those who ate there and didn't have diarrhoea, none ate curry chicken. Thus, one should not eat curry chicken at restaurant X."`],
      a: 1, why: `B matches the analogy syllogism: most things true of X are true of Y, X has a feature, so Y has it. A is modus tollens, C generalises from one case, D is causal.` },
    { id: 'c8-04', t: 'mcq', topic: `Mill's methods`, src: `GEX23 Q16`, trap: 'contrapositive', q: `"All who downloaded app S to buy mooncakes are those who have lost money to scammers. All who have not lost money to scammers are those who did not download app S to buy mooncakes. In all these cases, people downloaded the app before losing money to scammers." Which is true?`,
      o: [`Mill's method of agreement can be applied to infer that downloading app S caused losing money.`, `Mill's method of difference can be applied.`, `Mill's method of variation can be applied.`, `There is no reason to think any of these methods can be applied.`],
      a: 3, why: `The second sentence is just the contrapositive of the first, so there is no iff and nothing shows downloading is the only additional factor. No two otherwise identical cases, no degrees.` },
    { id: 'c8-05', t: 'mcq', topic: `Samples`, src: `L8 5.4a:3`, q: `"Italians are generally fat and lazy. How do I know? Well, when I visited Rome for a weekend last year, all the hotel employees were fat and lazy, all six of them." This argument is...`,
      o: [`strong: the sample was carefully observed`, `weak: the sample is tiny and not varied, and the conclusion is about all Italians`, `a statistical syllogism`, `deductively valid`],
      a: 1, why: `6 hotel staff in one city over one weekend cannot support a claim about all Italians.` },
    { id: 'c8-06', t: 'mcq', topic: `Samples`, src: `T5 5.4a:2`, trap: 'too-precise', q: `"I examined every Loyola student whose Social Security number ended in 3. I found that exactly 78.4% of them were born in Chicago. So probably 78.4% of all Loyola students were born in Chicago." What is the problem?`,
      o: [`The sample is not random.`, `The conclusion is too precise; it should say "roughly 78.4%".`, `Social Security numbers are private.`, `There is no problem.`],
      a: 1, why: `The tutorial correction: "so probably roughly 78.4% of all Loyola students were born in Chicago".` },
    { id: 'c8-07', t: 'mcq', topic: `Samples`, src: `T5 5.4a:5`, q: `"The sun has risen every day as long as humans can remember. So the sun will likely rise tomorrow." How does the tutorial put this into standard form?`,
      o: [`One analogy syllogism`, `A sample projection (all examined days are sunrise days; large, varied sample; so probably all days are), then a deductive step (all days are sunrise days; tomorrow is a day; so tomorrow is a sunrise day)`, `A statistical syllogism only`, `Modus tollens`],
      a: 1, why: `Two steps: inductive projection, then a deduction. The polar-night slide reminds you "all days are sunrise days" is false at the poles.` },
    { id: 'c8-08', t: 'set', topic: `Strengthen or weaken`, src: `T5 5.4a:6–9`, q: `"Lucy got an A on the first four logic quizzes, so probably she'll also get an A on the fifth logic quiz." Which statements are correct?`,
      s: [
        [`"Lucy has been sick for the last few weeks and has missed most of her classes" weakens the argument.`, true, `Tutorial answer.`],
        [`"The first four quizzes were on formal logic, while the fifth is on informal logic" strengthens the argument.`, false, `It weakens: a relevant difference.`, 'relevance-analogy'],
        [`"Lucy has never received less than an A in her life" strengthens the argument.`, true, `Tutorial answer.`],
        [`"A student in this course gets to drop the lowest of the five quizzes" weakens the argument.`, true, `She may not try on quiz 5.`]
      ] },
    { id: 'c8-09', t: 'mcq', topic: `Samples`, src: `T5 5.4a:11`, q: `"The universe is orderly (like a watch that follows complex laws). Most orderly things we've examined have intelligent designers. We've examined a large and varied group of orderly things. (This is all we know.) ∴ The universe probably has an intelligent designer." What does the tutorial say is problematic?`,
      o: [`The first premise: the universe is not orderly.`, `The second premise: animals and plants are orderly things we have observed, but we do not know whether they have an intelligent designer.`, `The conclusion is too cautious.`, `Nothing; it is cogent.`],
      a: 1, why: `Tutorial answer: premise 2 is problematic.` },
    { id: 'c8-10', t: 'set', topic: `Strengthen or weaken`, src: `L8 5.5a:1–3`, q: `"My logic textbook discusses analogical reasoning. So Sarah's book likely does too."`,
      s: [
        [`"Sarah's book has a different colour" is irrelevant.`, true, `Colour has nothing to do with content.`],
        [`"Sarah's book also has chapters on syllogisms, propositional logic, quantificational logic, and meaning and definitions" strengthens the argument.`, true, `Many similar topics.`],
        [`"Sarah's course is taught by a member of the mathematics department" strengthens the argument.`, false, `It weakens it: a mathematical approach to logic seldom covers analogical reasoning.`, 'relevance-analogy']
      ] },
    { id: 'c8-11', t: 'set', topic: `Strengthen or weaken`, src: `T5 5.5a:11, 12, 14`, q: `"Tony's ethics course at another school discussed utilitarianism. So my ethics course next semester likely will too."`,
      s: [
        [`"Tony's teacher transferred to your school and will teach your course as well" strengthens the argument.`, true, `Tutorial answer.`],
        [`"Tony's course was in medical ethics, while yours is in general ethical theory" weakens the argument.`, false, `It strengthens: general ethical theory is even more likely to cover utilitarianism (background knowledge).`, 'relevance-analogy'],
        [`"Tony's teacher has a good reputation, while yours doesn't" is irrelevant.`, true, `Tutorial answer.`]
      ] },
    { id: 'c8-12', t: 'mcq', topic: `Mill's methods`, src: `L8 5.7a:1`, q: `"Experiments show that a person's reaction time is much longer after a few drinks but is relatively uninfluenced by a series of other factors." Which method, and what conclusion?`,
      o: [`Agreement: drinking caused slower reaction, or the reverse, and both are open`, `Difference: drinking is (or is part of) the cause of slower reaction; the reverse is ruled out because the drinking came first`, `Variation: some C caused both`, `Disagreement: drinking doesn't necessarily cause slower reaction`],
      a: 1, why: `Otherwise similar cases differing in drinking. Time order rules out the reverse.` },
    { id: 'c8-13', t: 'mcq', topic: `Mill's methods`, src: `T5 5.7a:3`, trap: 'inseparable', q: `"Whenever Michelle drinks scotch and soda, she has a hangover the next day. Whenever she drinks gin and soda, she gets a hangover. Likewise, whenever she drinks rum and soda, she gets a hangover." Which Mill's method can be used?`,
      o: [`Agreement: soda causes the hangover`, `Agreement: alcohol causes the hangover`, `Difference`, `None: soda is always present too, and the data never separate soda from alcohol`],
      a: 3, why: `The data never show soda without alcohol or alcohol without soda, so no method applies.` },
    { id: 'c8-14', t: 'set', topic: `Mill's methods`, src: `T5 5.7a:6`, q: `"When I sat eating on the rock slab in Grand Gulch, armies of little ants invaded the slab. Later I sat on the slab the same way except that I didn't eat anything. In the second case the ants didn't invade the slab."`,
      s: [
        [`This can be analysed with Mill's method of agreement.`, false, `The invasion happened only once; agreement needs it more than once.`, 'agreement-once'],
        [`This can be analysed with Mill's method of difference.`, true, `Two otherwise similar cases differing in eating.`],
        [`Eating is (or is part of) the cause of the ant invasion, rather than the reverse, since eating came first.`, true, `Time order.`]
      ] },
    { id: 'c8-15', t: 'mcq', topic: `Mill's methods`, src: `T5 5.7a:19`, q: `"After long investigation, we found a close correlation between night and day. If you have night, then invariably, in a few hours, follows day. If you have day, then invariably, in a few hours, there follows night." What is the right analysis?`,
      o: [`Agreement: night causes day`, `Agreement: day causes night`, `Agreement doesn't apply; there is a common cause, the Earth's rotation relative to the Sun`, `Difference: night is part of the cause of day`],
      a: 2, why: `No reason to think night is the only additional factor present iff day is. Common cause.` },
    { id: 'c8-16', t: 'mcq', topic: `Mill's methods`, src: `T5 5.7a:21`, q: `"Whenever Kurt wears his headband, he makes all his field goals. Whenever he doesn't wear it, he misses them all. This has been going on for many years." Using agreement, what does the tutorial conclude?`,
      o: [`Wearing the headband certainly causes success.`, `Probably wearing the headband caused making field goals, or making field goals caused wearing the headband; the second is possible because success might make Kurt wear it next time.`, `No method applies.`, `Variation: some C caused both.`],
      a: 1, why: `Agreement gives both options, and reverse causation is live here.` },
    { id: 'c8-17', t: 'mcq', topic: `Mill's methods`, src: `T5 5.7a:24`, trap: 'variation-common', q: `"When we chart the inflation rate next to the growth in the national debt over several years, we find a close correlation." Which method, and what can be concluded?`,
      o: [`Agreement: debt caused inflation`, `Variation: changes in debt caused changes in inflation, or the reverse, or something else caused both`, `Difference: debt is part of the cause of inflation`, `Disagreement: debt doesn't necessarily cause inflation`],
      a: 1, why: `A correlation in degrees is variation, whose conclusion includes the common-cause option.` },
    { id: 'c8-18', t: 'mcq', topic: `Mill's methods`, src: `T5 5.7a:15`, trap: 'either-method', q: `"Matches that aren't either heated or struck don't light. Matches that are wet don't light. Matches that aren't in the presence of oxygen don't light. Matches that are heated or struck, dry, and in the presence of oxygen do light." How does the tutorial analyse this?`,
      o: [`No method applies.`, `Combine the factors into (H∨S)·(D·O); present = lights, absent = doesn't. Agreement (or difference): heating or striking a dry match in oxygen causes it to light.`, `Variation: oxygen levels vary with lighting.`, `Disagreement: oxygen doesn't necessarily cause lighting.`],
      a: 1, why: `Treat the combined condition as one factor. Lighting happened later, which rules out the reverse.` },
    { id: 'c8-19', t: 'set', topic: `Mill's methods`, src: `Original (L8 data)`, q: `After a kampong makan on Pulau Ubin: Ah Huat ate nasi lemak and satay (no chendol) and fell sick. Bala ate only chendol and was fine. Chloe ate only nasi lemak and was fine. Dewi ate satay and chendol (no nasi lemak) and fell sick.`,
      s: [
        [`By the method of agreement, probably eating satay caused the sickness, or the sickness caused eating satay.`, true, `Sickness occurred twice, and satay is the only food eaten by exactly those who got sick.`],
        [`By the method of disagreement, eating chendol doesn't necessarily cause sickness.`, true, `Bala ate chendol and was not sick.`],
        [`By the method of disagreement, eating nasi lemak doesn't necessarily cause sickness.`, true, `Chloe ate nasi lemak and was not sick.`],
        [`By the method of agreement, eating chendol caused the sickness.`, false, `Chendol was not eaten by exactly the sick guests (Ah Huat didn't, Bala did).`]
      ] },
    { id: 'c8-20', t: 'mcq', topic: `Samples`, src: `Original`, q: `"A survey of 2,000 Singapore residents, randomly selected across all planning areas and age groups, found that 62% prefer kopi to tea. So probably roughly 62% of Singapore residents prefer kopi to tea." How strong is this?`,
      o: [`Weak: the sample is too small`, `Strong: large, varied sample and a cautious conclusion`, `Invalid, so worthless`, `A false stereotype`],
      a: 1, why: `All three factors are satisfied: size, variety, and "probably roughly".` },
    { id: 'c8-21', t: 'set', topic: `Analogy`, src: `Original`, q: `"Wei Ling's GE module last semester had an open-book final. So her GE module this semester will probably have an open-book final too."`,
      s: [
        [`"Both modules are coordinated by the same lecturer, who always sets open-book finals" strengthens the argument.`, true, `A relevant similarity.`],
        [`"This semester's lectures are held in a different lecture theatre" is irrelevant.`, true, `The venue has nothing to do with the exam format.`],
        [`"Last semester's module was assessed entirely by essays, while this one has a timed online exam" weakens the argument.`, true, `A relevant difference in assessment design.`]
      ] },
    { id: 'c8-22', t: 'mcq', topic: `Mill's methods`, src: `Original`, trap: 'variation-common', q: `"The more cups of kopi Arjun drinks in a day, the later he falls asleep." What does Mill's method of variation allow us to conclude?`,
      o: [`Kopi certainly causes his late nights.`, `Probably kopi caused the late nights, or the late nights caused the kopi drinking, or something else (e.g. exam stress) caused both.`, `Kopi doesn't necessarily cause late nights.`, `Nothing at all.`],
      a: 1, why: `Variation's conclusion lists all three options, including a common cause.` },
    { id: 'c8-23', t: 'mcq', topic: `Samples`, src: `L8 slide`, q: `A survey team makes sure that its sample contains Chinese, Malay, Indian and other residents in the same proportions as the population. This is a...`,
      o: [`random sample`, `representative (stratified) sample`, `false stereotype`, `statistical syllogism`],
      a: 1, why: `Subgroups in the right proportions = representative/stratified. Random = equal chance for each member.` }

/* Chapter 9 — Scientific Inference [L9] */
RL.chapter({
  n: 9, code: 'RL9', lec: 'L9', title: `Scientific Inference`, short: `Scientific Inference`,
  place: `one-north`, spot: `Biopolis lab, late at night`, icon: 'flask', sky: 909,
  mentor: ['popper'], mentorName: `Dr. Popper`,
  story: [
    `You found my lab. Good. I am Dr. Popper, and I have a confession: no amount of data proves a hypothesis.`,
    `Ohm says I = V/R. My rival's Mho hypothesis fits the same readings at 1 volt and 2 volts. Only at 3 volts do they disagree. That is a crucial experiment.`,
    `A failed prediction refutes a hypothesis, validly. A successful prediction only confirms it. Infinitely many hypotheses fit any finite data.`,
    `So how do we choose? Simplicity and coherence, but only all else being equal. A refuted hypothesis is out, however simple it is.`
  ],
  win: `Your hypothesis survived every test I threw at it. Provisionally. Next: Speakers' Corner.`,
  cards: [
    { t: `Ohm's law`, b: `I ∝ V; I = kV; **I = V/R** (current = voltage / resistance).\n\n**Current (amp):** electrons through a cross-section per second.\n**Voltage (volt):** what causes the flow; difference in electric potential energy per unit charge.\n**Resistance (ohm):** hindrance to flow. Longer wire = more; thicker = less; depends on material.` },
    { t: `Inference from data`, b: `With R = 10 ohms: V = 1 gives I = 0.1; V = 2 gives I = 0.2, as I = V/R predicts.\n\nSample projection: "All examined voltage-resistance-current cases follow Ohm's law. A large and varied group of such cases has been examined. ∴ All such cases follow Ohm's law."` },
    { t: `Mho and the crucial experiment`, b: `**Mho:** I = (1/R)(V² − 2V + 2). With R = 10: V = 1 → 0.1; V = 2 → 0.2. Same as Ohm.\nAt V = 3: Mho predicts (9 − 6 + 2)/10 = **0.5**; Ohm predicts **0.3**.\n\n**Crucial experiment:** eliminate one of two competing hypotheses when the result fits one rather than the other. The ammeter reads 0.3 amp: Ohm wins, Mho loses.` },
    { t: `Refuting a hypothesis`, b: `If H and C, then O\nC\nNot-O\n∴ Not-H\n\n(H = hypothesis h is true; C = condition c holds; O = the experiment yields o.) This form is **valid**.\n\nConfirming (If H then O; O; ∴ H) is **not valid**: it affirms the consequent.` },
    { t: `Infinitely many alternatives`, b: `I = (1/R)V + (V−1)(V−2)...(V−n)x fits all n data points for any natural number x, because the product is 0 at each tested V.\n\nClass exercise: data x = 1..4, y = 2, 4, 6, 8. H: y = 2x. AH: y = 2x + (x−1)(x−2)(x−3)(x−4)z.\n- AH is infinitely many hypotheses (one per z).\n- Same predictions for x = 1..4 (a bracket is 0).\n- At x = 5: H says 10; AH says 10 + 24z. Observing 10 refutes AH.\n- Add (x−5), ..., (x−n) and AH agrees up to n. Data alone never single out y = 2x.` },
    { t: `Simplicity and coherence`, b: `**Simplicity:** all else being equal, the simplest hypothesis is most likely to be true (Ohm is simpler than Mho).\n\n**Coherence:** all else being equal, a theory that fits better with established background beliefs is more likely to be true.\n\n**Important point:** whether scientific beliefs can be justified by data via induction depends not just on data but also on **inductive criteria**.` },
    { t: `Hypothesis checklist`, b: `- Does a new result contradict a hypothesis's prediction? Then it is refuted (valid form).\n- Results that fit a hypothesis do not prove it.\n- Choose among the survivors by simplicity and coherence, only "all else being equal".\n- A refuted hypothesis is out, however simple.` },
    { t: `Trap check`, b: `- "Proved" by an experiment means proof in the **ordinary** sense (inductive), not the technical sense (sound).\n- If a later counterexample cannot be explained away, reject the claim and say the opposite has been proved; you cannot keep both.\n- Lab L (y = 3x²): a simple hypothesis that fails new data is refuted; that does not disprove "simplicity is evidence of truth"; H1 that clashes with old data is refuted too.` }
  ],
  quick: [
    [`If H then O; not O; therefore not H is valid.`, true, `Refutation form.`],
    [`If H then O; O; therefore H is valid.`, false, `Affirming the consequent.`],
    [`At V = 3 and R = 10, Ohm's law predicts 0.3 amp.`, true, `I = V/R.`],
    [`At V = 3 and R = 10, Mho predicts 0.5 amp.`, true, `(9 − 6 + 2)/10.`],
    [`Data that fit a hypothesis prove it.`, false, `Infinitely many hypotheses fit finite data.`],
    [`The simplicity criterion applies only all else being equal.`, true, `Keep the qualifier.`],
    [`A refuted hypothesis should be kept if it is the simplest.`, false, `A refuted hypothesis is out.`],
    [`Coherence: a theory fitting background beliefs is more likely true, all else being equal.`, true, `Course wording.`],
    [`A longer wire has less resistance.`, false, `Longer = more resistance; thicker = less.`],
    [`A crucial experiment eliminates one of two competing hypotheses.`, true, `Course wording.`],
    [`"Proved" by experiment usually means the technical sense of proof.`, false, `Ordinary sense: a good inductive argument.`],
    [`Justifying scientific beliefs depends on data and on inductive criteria.`, true, `The lecture's important point.`],
    [`AH: y = 2x + (x−1)(x−2)(x−3)(x−4)z predicts 10 + 24z at x = 5.`, true, `4 × 3 × 2 × 1 = 24.`],
    [`AH and H make different predictions for x = 1 to 4.`, false, `Same predictions: one bracket is 0.`]
  ],
  qs: [
    { id: 'c9-01', t: 'set', topic: `Proof & refutation`, src: `2018 Q17`, q: `"From an experiment in which we observed the values of acceleration experienced by trolleys of various masses, it has been proved that acceleration is always inversely proportional to mass when force is constant."`,
      opts: [[0], [1, 2], [1, 3], [0, 3]],
      s: [
        [`The word "proved" here reflects a concept of "proof" in its technical sense.`, false, `Technical proof is a sound deductive argument. Going from limited observations to "always" is a sample projection: inductive.`, 'proved-ordinary'],
        [`The word "proved" reflects "proof" in its ordinary sense, assuming the five conditions of a good argument are all met.`, true, `Ordinary proof = a good argument, which can be inductive.`, 'proved-ordinary'],
        [`If future scientists encounter a counterexample that cannot be explained away, we ought to reject this sentence and accept that it has been proved that acceleration is not always inversely proportional to mass.`, true, `Once the opposite is proved, we can no longer claim the original was proved.`, 'proved-refuted'],
        [`If that happens, we have to retain this sentence and add that the opposite has been proved.`, false, `"A proved P and B refuted P" is contradictory.`, 'proved-refuted']
      ] },
    { id: 'c9-02', t: 'set', topic: `Simplicity & coherence`, src: `GEX23 Q17`, q: `"The simplest hypothesis that fits with all the observed results of an experiment carried out in Lab L is y = 3x². Scientists in Lab L then adopted this hypothesis and designed a further experiment to test a large set of new values of x. The results in the new experiment fit only with two of the original competing alternative hypotheses, H1 and H2. However, H1 is incompatible with some of the results in the original experiment."`,
      s: [
        [`The criterion of simplicity requires that they stick to y = 3x².`, false, `y = 3x² no longer fits the data, so it is refuted. Simplicity applies only all else being equal.`, 'simplicity'],
        [`This disproves the claim that simplicity is evidence of truth.`, false, `The criterion never said the simplest is always true, only most likely when all else is equal.`, 'simplicity'],
        [`This does NOT show that H1 is most likely to be true.`, true, `H1 clashes with the original results, so it is refuted too.`]
      ] },
    { id: 'c9-03', t: 'mcq', topic: `Crucial experiments`, src: `L9 slide`, q: `With R = 10 ohms, Ohm (I = V/R) and Mho (I = (1/R)(V² − 2V + 2)) both give 0.1 at V = 1 and 0.2 at V = 2. What do they predict at V = 3?`,
      o: [`Ohm 0.3, Mho 0.3`, `Ohm 0.3, Mho 0.5`, `Ohm 0.5, Mho 0.3`, `Ohm 0.3, Mho 0.9`],
      a: 1, why: `Ohm: 3/10 = 0.3. Mho: (9 − 6 + 2)/10 = 0.5. Reading 0.3 amp eliminates Mho.` },
    { id: 'c9-04', t: 'mcq', topic: `Proof & refutation`, src: `L9 slide`, q: `"If Ohm's law is true and a 3V battery is used with a 10-ohm resistor, the ammeter reads 0.3 amp. A 3V battery is used with a 10-ohm resistor. The ammeter does not read 0.3 amp. ∴ Ohm's law is false." This argument is...`,
      o: [`invalid: it affirms the consequent`, `valid: it is the form for refuting a hypothesis`, `inductive: it is a sample projection`, `invalid: it denies the antecedent`],
      a: 1, why: `If H and C, then O; C; not-O; ∴ not-H. Valid.` },
    { id: 'c9-05', t: 'mcq', topic: `Proof & refutation`, src: `L9 / Supp`, trap: 'fit-not-proof', q: `"If Ohm's law is true, the ammeter reads 0.3 amp at 3V and 10 ohms. It reads 0.3 amp. ∴ Ohm's law is true." This argument is...`,
      o: [`valid`, `invalid: confirming a prediction affirms the consequent`, `sound`, `a crucial experiment that proves Ohm's law`],
      a: 1, why: `If H then O; O; ∴ H is not a valid form. Confirmation never proves a hypothesis.` },
    { id: 'c9-06', t: 'set', topic: `Alternative hypotheses`, src: `L9 class exercise`, q: `Data: x = 1, 2, 3, 4 with y = 2, 4, 6, 8. H: y = 2x. AH: y = 2x + (x−1)(x−2)(x−3)(x−4)z, where z is any positive integer.`,
      s: [
        [`AH contains infinitely many hypotheses, one for each value of z.`, true, `z = 1, 2, 3, ...`],
        [`H and AH make the same predictions for the current data.`, true, `At x = 1..4 one bracket is 0.`],
        [`At x = 5, AH predicts y = 10 + 24z.`, true, `(4)(3)(2)(1)z = 24z.`],
        [`However much data we collect, empirical evidence alone can single out y = 2x.`, false, `Adding factors (x−5)...(x−n) keeps AH matching. Criteria like simplicity do part of the work.`, 'fit-not-proof']
      ] },
    { id: 'c9-07', t: 'set', topic: `Simplicity & coherence`, src: `L9 slide`, q: `On choosing between hypotheses:`,
      s: [

RL.chapter({
  n: 10, code: 'RL10', lec: 'L10', title: `Argumentation & Fallacies 1`, short: `Fallacies 1`,

    { t: `Proof, proved, refuted`, b: `**Proof (technical):** a sound argument.\n**Proof (ordinary):** a good argument (can be cogent/inductive).\n\n**Proved** = true and shown true. **Refuted** = false and shown false.\n\n"A proved P and B refuted P" is **contradictory**. Say "A attempted to prove P but B refuted P".` },
    { t: `1. Circular`, b: `The conclusion is used to prove the conclusion. Also circularity across two arguments (P... so Q; then Q... so P).\n\n"Souls exist (based on the belief that God exists). ∴ God exists."\n\nScripture X says it is God's Word; X's claim is trustworthy; so X is God's Word; then "X is God's Word" is used to show X's claim is trustworthy.\n\n"Miracles are impossible because they simply can't happen."` },
    { t: `2. Ambiguous (equivocation)`, b: `Changes the meaning of a term within the argument.\n\n"Any good person can't be involved in match-fixing. Lin is good (at badminton). Therefore, Lin can't be involved in match-fixing." "Good" shifts from morally good to good at badminton.\n\n"There are scientific laws. Where there are laws there must be a lawgiver..." "Laws" shifts from regularities to rules someone sets.` },
    { t: `3. Appeal to emotion`, b: `Substitutes an expression of feelings for a reasoned case.\n\n"How can you criticise this policy? Anyone who thinks it is wrong is a traitor to his religion, race, and country."\n\n**Not** this fallacy: a passionate argument that still gives reasons (2018 Q21, the civics bureau).` },

    { id: 'c10-04', t: 'mcq', topic: `Beside the point`, src: `L10 4.2a:7`, q: `The issue is whether the president's veto was the right move. Someone argues: "In these troubled times we need decisive leadership, even in the face of opposition. We should all thank the president for his courageous move." On the slide's second reading, which fallacy is this?`,

/* Chapter 11 — Argumentation & Fallacies 2 [L11] */
RL.chapter({
  n: 11, code: 'RL11', lec: 'L11', title: `Argumentation & Fallacies 2`, short: `Fallacies 2`,
  place: `Ang Mo Kio Kopitiam`, spot: `Corner table, uncles' WhatsApp group`, icon: 'kopi', sky: 1111,
  mentor: ['schopenhauer'], mentorName: `Uncle Schopenhauer`,
  story: [
    `Hmph. Sit down. I'm Uncle Schopenhauer. I wrote a whole book on dirty debating tricks, and every one of them is in this WhatsApp group.`,
    `"No one proved it's false, so it's true." "I wore my red shirt and we won, so the shirt did it." "Every player is world-class, so the team is world-class." Rubbish, all of it.`,
    `But listen carefully. Some arguments look like fallacies and aren't. Expert plus consensus plus "there is a presumption" is fine. Bias, therefore "not fully reasonable", is fine. An entire salary given away means every cent is gone.`,
    `And read the verb. "Is an instance of" is stronger than "involves". Get these right and you may sit for the Final.`
  ],
  win: `...Not bad. For a young person. The Final Exam hall is open. Don't disappoint me.`,
  cards: [
    { t: `8. Genetic`, b: `Accept or dismiss a belief P **because you can explain the origin** of P.\n\n"Belief in God is the result of a psychological need for a perfect and all-powerful father (Freud's premise). ∴ The belief that God exists is false (not Freud's conclusion)."\n\nThe conclusion must **accept or reject** the belief. "Not fully reasonable" is not rejecting it. "Genetic mutation" is a word trap.` },
    { t: `9–10. Ignorance and post hoc`, b: `**9. Appeal to ignorance:** P is false because no one has proved P, or true because no one has disproved it. "No one has proved that electrons exist. ∴ Electrons don't exist."\n\n**10. Post hoc ergo propter hoc:** P causes Q because Q happens after P. "Ann saw a black cat before her car crashed. ∴ Ann's car crashed because she saw a black cat."\n\n"Is an instance of" post hoc needs an explicit "it came after, so it caused it" argument (ginger soup, 2018 Q20).` },
    { t: `11. Part-whole`, b: `**Part-to-whole:** F is G because every part of F is G. "Every consumer cannot affect the price of milk. ∴ Consumers as a whole cannot."\n\n**Whole-to-part:** every part of F is G because F is G. "Nation X has high-income status. ∴ Every citizen has high-income status."\n\nA single water molecule is tetrahedral; a group forms a hexagonal lattice.\n\n**Not a fallacy** when the property distributes: "Amy donated her entire salary. ∴ Every cent went to charity." Valid.` },
    { t: `12. Appeal to authority`, b: `**Non-fallacious form:**\nX holds that P is true.\nX is an authority on the subject.\nThe consensus of authorities agrees with X.\n∴ There is a **presumption** that P is true.\n\n**Fallacious:** omits premises 2 and 3, or omits 3, or concludes P **must** be true. "Actress Y says Party B is the right choice. ∴ Party B is the right choice." "Aristotle said heavy objects fall faster, so it must be true."` },
    { t: `13. Ad hominem`, b: `**Non-fallacious form:**\nX holds that P is true.\nIn holding this, X violates legitimate rational standards.\n∴ X isn't fully reasonable in holding P.\n\n**Fallacious:** keeps those premises but concludes "P is false"; or uses a weakness irrelevant to rational competence to conclude P is false. "Mr. S says policy K is good. Mr. S is gay. ∴ Policy K is not good."\n\nProf. Amy and her nephew (2018 Q25): bias → not fully reasonable = **non-fallacious**.` },
    { t: `14–15. Pro-con and black-and-white`, b: `**14. Pro-con:** one-sided; ignores either the pros or the cons when deciding what ought to be done. Non-fallacious: list reasons for and against, show the former outweighs the latter.\n\n"Reasons for voting A... reasons against A's opponents... ∴ vote A." Nuclear power with only advantages + mocking critics = pro-con.\n\n**15. Black-and-white:** assumes one of two extremes must be true. "X is logical. ∴ X must be unemotional."` },
    { t: `16–18. Stereotype, force, complex question`, b: `**16. False stereotype:** all members of group F are G because some are, based on isolated cases. Gensler: assumes members are more alike than they are. "So you're a business major? You must only care about money."\n\n**17. Appeal to force:** threats or intimidation. "Just agree with what I said or you'll be fired."\n\n**18. Complex question:** a trick question assuming something false or doubtful. "Should I give you zero for plagiarising your essay?" "Are you still wasting time with all that book-learning?"` },
    { t: `Which fallacy? checklist`, b: `- Is there an argument? A lone loaded question = complex question. A threat = force.\n- What is the issue and the conclusion? Conclusion off the issue = beside the point.\n- What reason is given? Match it to the master table.\n- Check the non-fallacious versions: authority (expert + consensus + presumption), ad hominem (bias → not fully reasonable), pro-con (weighs both), part-whole where the property distributes, generalisation from a large varied sample.\n- Feelings in place of reasons = emotion. Passion plus reasons ≠ emotion.\n- **Read the verb.** "Is an instance of" needs an explicit structure; "involves/assumes" is weaker.` },
    { t: `Confusable sets`, b: `- **Ad hominem** (person's irrelevant trait ∴ P false) vs **genetic** (origin of belief ∴ accept/dismiss) vs **straw man** (distorts the view) vs **opposition** (opponent believes P ∴ P false).\n- **Post hoc** (after, therefore because) vs **Mill's agreement** (repeated cases, only additional factor, iff).\n- **Authority** (one expert says) vs **crowd** (most people believe) vs **opposition** (enemy believes).\n- **Circular** (conclusion as premise) vs **complex question** (question presupposes something doubtful).\n- **Black-and-white** (two extremes) vs **pro-con** (one side's reasons).\n- **Emotion** (feelings replace reasons) vs **force** (threats).` },
    { t: `Trap check`, b: `- Smartphones & myopia (2018 Q18): post hoc is **involved**; reputable data → not false stereotype.\n- Ginger soup (2018 Q20): no explicit "after so because" about recovery → **none**.\n- NUS ranked 11th ∴ every department 11th → whole-to-part fallacy; entire salary → valid.\n- Nuclear: only pros + mocking critics → pro-con, but not merely emotional.\n- Team X badminton gold → **deductive**, not part-whole.\n- Dr. Thomas Chan: strengths weighed against data falsification → **none** of opposition/beside the point/pro-con/ad hominem.\n- "Do you prefer a 5- or 10-minute extension?" → complex question.` }
  ],
  quick: [
    [`"No one has proved electrons exist, so they don't" is appeal to ignorance.`, true, `No proof ∴ false.`],
    [`"Ann saw a black cat before her crash, so the cat caused it" is post hoc.`, true, `After, therefore because.`],
    [`"Amy gave her entire salary to charity, so every cent went to charity" commits part-whole.`, false, `The property distributes: valid.`],
    [`"NUS ranked 11th, so every department ranked 11th" commits whole-to-part.`, true, `Departments can rank differently.`],
    [`Expert + consensus + "there is a presumption that P" is non-fallacious.`, true, `The OK form of appeal to authority.`],
    [`Concluding "P must be true" from one celebrity's say-so is fallacious authority.`, true, `Actress Y example.`],
    [`Bias, therefore "X isn't fully reasonable in holding P" is fallacious ad hominem.`, false, `That is the non-fallacious form.`],
    [`Listing only advantages of a choice commits the pro-con fallacy.`, true, `One-sided.`],
    [`"X is logical, so X must be unemotional" is black-and-white.`, true, `Two extremes assumed.`],
    [`"Agree with me or you're fired" is appeal to force.`, true, `Threats.`],
    [`"Should I give you zero for plagiarising?" is a complex question.`, true, `It presupposes plagiarism.`],
    [`The genetic fallacy is about genes.`, false, `About the origin of a belief.`],
    [`"Is an instance of" a fallacy is a weaker claim than "involves" a fallacy.`, false, `"Instance" is stronger: it needs an explicit argument.`],
    [`Attacking a doctor's own smoking to dismiss her advice is ad hominem.`, true, `Her habits are irrelevant to the advice.`],
    [`False stereotype argues from some members to all members.`, true, `Based on isolated cases.`],
    [`If premises guarantee the conclusion, it can't be a part-whole fallacy.`, true, `It is deductive (Team X badminton).`]

  /* ---------- exams ---------- */
  function pickChapterTest(n, rand) {
    var ch = RL.getChapter(n), groups = {};
    U.shuffle(ch.qs, rand).forEach(function (q) { (groups[q.topic] = groups[q.topic] || []).push(q); });
    var keys = U.shuffle(Object.keys(groups), rand), out = [];
    while (out.length < Math.min(10, ch.qs.length)) {
      var progressed = false;
      keys.forEach(function (k) { if (out.length < 10 && groups[k].length) { out.push(groups[k].shift()); progressed = true; } });
      if (!progressed) break;
    }
    return out;
  }
  function pickFinal(count, rand) {
    var pools = RL.chapters.map(function (c) {
      return c.qs.map(function (q) { q.ch = c.n; return { q: q, k: (/2018|GEX23/.test(q.src) ? 0 : 0.45) + rand() }; })
        .sort(function (a, b) { return a.k - b.k; }).map(function (x) { return x.q; });
    });
    var out = [], order = U.shuffle(pools.map(function (_, i) { return i; }), rand);
    while (out.length < count) {
      var moved = false;
      for (var j = 0; j < order.length && out.length < count; j++) { var pool = pools[order[j]]; if (pool.length) { out.push(pool.shift()); moved = true; } }
      if (!moved) break;
    }
    return out.sort(function (a, b) { return a.ch - b.ch; });

  };

  VIEWS.finalHub = function () {

      '<div class="hub-landmark">' + icon('merlion', 5) + '</div><div class="hub-title"><span class="stn-code">RL12</span><h2>Final Exam Hall</h2><p>Mock final · Examplify style · open book</p></div></div>';
    h += '<div class="dialogue">' + '<div class="mentors">' + portrait('examiner', 5) + '</div><div class="speech"><p class="speaker">The Examiner</p><p class="speech-text">' +
      esc(fo ? 'Questions follow the 2018 and GEX23 papers: combination MCQs and T/F sets in lecture order. You may consult your notes. Your script goes to Prof. Socra-Tan for marking.' : 'The hall is closed. Pass every station on the Reasoning Line first, or switch on cram mode in Settings.') + '</p></div></div>';

        '<button type="button" class="act" data-act="final" data-count="25"><span class="act-num">F</span>' + icon('gradcap', 3) + '<span class="act-label">Full paper</span><span class="act-sub">25 questions · 75 min</span></button>' +
        '<button type="button" class="act" data-act="final" data-count="40"><span class="act-num">M</span>' + icon('brain', 4) + '<span class="act-label">Marathon</span><span class="act-sub">40 questions · 2 hours</span></button></div>';
      h += '<div class="attack"><h3 class="sub">How to attack a question</h3><ol>' + RL.ref.attack.map(function (a) { return '<li><b>' + esc(a[0]) + '.</b> ' + esc(a[1]) + '</li>'; }).join('') + '</ol></div>';
    }
    if (f.history.length) {
      h += '<h3 class="sub">Past attempts</h3><ul class="history">' + f.history.slice().reverse().map(function (x) { return '<li><b>' + x.letter + '</b> · ' + x.pct + '% · ' + new Date(x.at).toLocaleDateString('en-SG', { day: 'numeric', month: 'short' }) + '</li>'; }).join('') + '</ul>';
    }
    h += '<div class="hub-foot">' + btn('◂ Map', 'go', 'data-view="map"', 'btn-small btn-ghost') + '</div></section>';

  function libraryHTML(inExam) {
    var h = '<div class="library">';
    h += '<details class="lib-sec" open><summary>Exam rules and how to attack a question</summary><ul>' + RL.ref.rules.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul><ol>' + RL.ref.attack.map(function (a) { return '<li><b>' + esc(a[0]) + '.</b> ' + esc(a[1]) + '</li>'; }).join('') + '</ol>' +
      '<div class="table-wrap"><table><thead><tr><th>If the stem mentions...</th><th>Go to</th></tr></thead><tbody>' + RL.ref.map.map(function (m) { var c = RL.getChapter(m[1]); return '<tr><td>' + esc(m[0]) + '</td><td>' + esc(c.code + ' ' + c.short) + '</td></tr>'; }).join('') + '</tbody></table></div></details>';
    h += '<details class="lib-sec"><summary>Master fallacy table</summary><div class="table-wrap"><table><thead><tr><th>Fallacy</th><th>How to spot it</th><th>Cues</th><th>Confused with</th></tr></thead><tbody>' +
      RL.ref.fallacies.map(function (f, i) { return '<tr><td><b>' + (i + 1) + '. ' + esc(f[0]) + '</b></td><td>' + esc(f[1]) + '</td><td>' + esc(f[2]) + '</td><td>' + esc(f[3]) + '</td></tr>'; }).join('') + '</tbody></table></div></details>';
    h += '<details class="lib-sec"><summary>Trap index</summary><ul class="trap-index">' + Object.keys(RL.TRAPS).map(function (k) { var T = RL.TRAPS[k]; return '<li><span class="stn-code">RL' + T.ch + '</span> ' + esc(T.text) + '</li>'; }).join('') + '</ul></details>';

      h += '</details>';
    });

  }
  VIEWS.library = function () {

  VIEWS.notebook = function () {
    var ids = Object.keys(S.save.mistakes).filter(function (id) { return RL.findQuestion(id); });

      h += '<div class="empty">' + icon('smiley', 6) + '<p>Nothing to redo. Questions you miss in training or tests will appear here.</p></div>';
    } else {
      h += '<div class="title-actions">' + btn('Revise all ' + ids.length, 'nb-train', '', 'btn-hot') + '</div><ul class="nb-list">';
      ids.sort(function (a, b) { return S.save.mistakes[b].n - S.save.mistakes[a].n; }).forEach(function (id) {
        var q = RL.findQuestion(id), c = RL.getChapter(q.ch), m = S.save.mistakes[id];
        h += '<li><span class="stn-code">' + c.code + '</span><span class="nb-topic">' + esc(q.topic) + '</span><span class="nb-q">' + esc(q.q.length > 110 ? q.q.slice(0, 107) + '...' : q.q) + '</span><span class="nb-n">missed ×' + m.n + (m.streak ? ' · ' + m.streak + '/2 fixed' : '') + '</span></li>';
