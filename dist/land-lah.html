/* Lot 2 — Law and equity [L3] */
LL.chapter({
  n: 2, code: 'LOT 2', lec: 'L3', title: 'Law and Equity', short: 'Law & Equity',
  place: 'Chancery Lane', spot: 'A quiet street off Thomson Road', icon: 'scales', sky: 202,
  mentor: ['chancellor'], mentorName: 'Madam Chan, retired Chancery clerk',
  story: [
    'Chancery Lane. The name comes from the old Court of Chancery, where the Lord Chancellor fixed what the common law got wrong.',
    'The common law was rigid: no writ, no remedy, and the only remedy was money. Equity acted on conscience, invented the trust, and gave orders: specific performance, injunctions, rescission.',
    'The exam favourite is Equity\'s Darling: a good-faith buyer of the legal estate, for value, without notice. Four elements. Students drop the "legal estate" mark every year.',
    'And remember the Torrens twist. On registered land the register does most of the work notice used to do.'
  ],
  win: 'Well reasoned. Legal rights bind the world; equitable rights bind everyone except Equity\'s Darling. Next: Sunny Avenue, and the covenants that ride with land.',
  idea: 'Legal rights bind everyone. Equitable rights bind everyone except Equity\'s Darling: a good-faith buyer of the legal estate for value without notice.',
  plain: [
    'Medieval common law was rigid: no writ, no remedy, and the only remedy was damages. Petitions went to the King, then to the Lord Chancellor. The Court of Chancery decided by conscience and produced equity.',
    'Equity invented the trust. The trustee holds the legal title; the beneficiary holds the benefit (equitable title). Legal rights bind everyone; equitable rights bind everyone except Equity\'s Darling.',
    'Singapore fused the ADMINISTRATION of law and equity (s 3 Civil Law Act). One court applies both. The doctrines stay separate, and where they conflict equity prevails.',
    'For land, equity matters because a buyer under a signed contract, a trust beneficiary, or a lender under an informal charge holds an equitable interest before registration. On registered land a caveat protects that interest (Lot 9).'
  ],
  tested: [
    ['Equity\'s Darling (four elements)', 'A trustee sells to a buyer who paid, knew something, or got a gift. Tutorial 3 Q3.', 'High'],
    ['Legal v equitable interests', 'Whether a right binds a later buyer. Feeds Lots 3, 5, 8, 9.', 'High (support)'],
    ['Walsh v Lonsdale', 'A lease or sale agreement lacks the right formality.', 'Medium'],
    ['Remedies', 'Choose damages, specific performance, injunction, rescission, rectification, and say why.', 'High (in every answer)'],
    ['Origins and fusion', 'Narrative question on the development of equity.', 'Medium (essay)']
  ],
  terms: [
    ['Common law', 'Law from the King\'s courts after 1066, applied the same across the realm.'],
    ['Equity', 'Law from the Court of Chancery. Works on conscience, intent and the parties\' conduct.'],
    ['Writ', 'A standard form of claim. No writ, no remedy.'],
    ['Trust', 'A trustee holds legal title for a beneficiary. The settlor creates it.'],
    ['Equity\'s Darling', 'A bona fide purchaser of the legal estate for value without notice. Takes free of equitable interests.'],
    ['Notice', 'Actual (knew), constructive (would have found out on proper inquiry), imputed (the lawyer or agent knew).'],
    ['Conversion', '"Equity treats as done what ought to be done": a buyer under a good contract is owner in equity.'],
    ['Laches', 'Delay that defeats an equitable claim.']
  ],
  rules: [
    ['Maxims', 'Equity will not suffer a wrong without a remedy. He who seeks equity must do equity. He who comes to equity must come with clean hands. Delay defeats equity. Equity looks to intent rather than form. Equity follows the law. Equity treats as done what ought to be done.'],
    ['Priority', 'A legal right binds the world. An equitable right binds everyone except Equity\'s Darling.'],
    ['Equity\'s Darling: four elements', '(1) Good faith. (2) Value (a gift is not value). (3) Acquires the legal estate. (4) No notice: actual, constructive or imputed.'],
    ['Formalities', 's 53(1) CLPA: land is conveyed by deed. A defective document gives no legal title, but equity may recognise an equitable interest where a contract is specifically enforceable (Walsh v Lonsdale).'],
    ['Damages', 'A right of the claimant once breach is proved. Compensatory, general or special, liquidated (valid if a genuine pre-estimate, void if a penalty: Dunlop). Remoteness: Hadley v Baxendale.'],
    ['Equitable remedies', 'Discretionary: specific performance, injunction, rescission, rectification. Refused for unclean hands, delay, or where damages are enough.'],
    ['Fusion', 's 3 Civil Law Act (from the Civil Law Ordinance 1878; England: Judicature Acts 1873–75). One set of courts applies both; equity prevails in a conflict (Earl of Oxford\'s Case).'],
    ['Registered land link', 'The Torrens register replaces much of the notice inquiry. An equitable interest is protected by caveat. Mere knowledge of an unregistered interest is not fraud (s 47(2) LTA).']
  ],
  cases: [
    ['Earl of Oxford\'s Case (1615)', 'A Chancery decree conflicted with a common law judgment.', 'James I backed Chancery: where law and equity conflict, equity prevails.', 'Equity\'s supremacy.'],
    ['Walsh v Lonsdale (1882)', 'A written agreement for a 7-year lease; no deed. Tenant in possession paying rent; landlord demanded a year\'s rent in advance as the agreement allowed.', 'Void at law for want of a deed, but equity treated the specifically enforceable agreement as the lease. The landlord could distrain.', 'An agreement for a lease (or sale) is enforced as a lease (or equitable interest) if SP is available.'],
    ['Hadley v Baxendale (1854)', 'A mill shut down because a crankshaft was delivered late.', 'Damages cover loss arising naturally, or loss both parties had in mind when contracting.', 'Remoteness of damage.'],
    ['Dunlop Pneumatic Tyre v New Garage [1915]', 'Fixed sums claimed for breach of a price-maintenance term.', 'A genuine pre-estimate of loss is liquidated damages; a sum out of proportion is a void penalty.', 'Penalty test (see Lot 5, Hong Leong).'],
    ['Pilcher v Rawlins (1872)', 'A trustee sold to a buyer who paid and took the legal estate without notice.', 'The buyer took free of the beneficiary\'s interest. [check]', 'Origin of Equity\'s Darling.'],
    ['Tulk v Moxhay (1848)', 'A buyer of Leicester Square knew of a promise to keep it open and tried to build.', 'Chancery restrained him (Lot 3).', 'Equity binding a buyer with notice.']
  ],
  secs: [
    ['s 3 Civil Law Act', 'Law and equity administered together (fusion)', 'Law and equity are applied together; equity prevails in a conflict.'],
    ['s 53(1) CLPA', 'Conveyance by deed; lease of 7 years or less at a rack rent exempt', 'A legal conveyance or lease needs a deed, unless the short-lease exception applies.'],
    ['s 47(2) LTA', 'Knowledge of an unregistered interest is not of itself fraud', 'The Torrens twist on notice.']
  ],
  nums: [
    ['Judicature Acts (England)', '1873–1875'],
    ['Civil Law Ordinance (Singapore)', '1878']
  ],
  traps: [
    'The usual lost mark is "legal estate". A buyer with only a contract or an equitable interest is not Equity\'s Darling.',
    'A gift gives no value. A lawyer\'s knowledge is imputed to the buyer.',
    'When a buyer is bound by an equitable interest, give the remedy: declaration, injunction, tracing, and a personal claim against the trustee.',
    'Say "fusion of administration". Singapore did not merge the doctrines.',
    'On registered land: once the buyer registers, s 46 LTA makes the title indefeasible, so the claimant\'s protection rests on a caveat lodged in time or on the proprietor\'s fraud.'
  ],
  qs: [
    { id: 'c2-01', t: 'mcq', topic: 'Origins of equity', src: 'Prof-style (new)',
      q: 'The following statement is true about the emergence of equity:',
      o: ['Equity was created by Parliament in the Judicature Acts 1873 to 1875 to fill gaps in the statutes.',
        'The common law was rigid (no writ, no remedy; often only damages), so petitioners turned to the Chancellor.',
        'Equity replaced the common law entirely in Singapore in 1878, when the Civil Law Ordinance came into force.',
        'Equity was developed by the Singapore Court of Appeal after 1994, once Privy Council appeals ended.'],
      a: 1, why: 'Petitions to the King went to the Lord Chancellor, whose Court of Chancery acted on conscience. The Judicature Acts fused administration later; they did not create equity.', trap: 'fusion-admin' },
    { id: 'c2-02', t: 'set', topic: 'Fusion', src: 'Prof-style (new)',
      q: 'The following statement/s is/are true about law and equity in Singapore:',
      s: [
        ['The same courts administer both law and equity.', true, 's 3 Civil Law Act: fusion of administration.'],
        ['Fusion merged legal and equitable rights into one body of rules.', false, 'Only administration was fused. The doctrines remain distinct.', 'fusion-admin'],
        ['Where a rule of law and a rule of equity conflict, the rule of equity prevails.', true, 'Earl of Oxford\'s Case; reflected in s 3 CLA.'],
        ['Damages and specific performance are both available as of right.', false, 'Damages are a right; specific performance is discretionary.', 'eq-discretion']
      ], opts: [[0], [0, 2], [1, 3], [0, 2, 3]] },
    { id: 'c2-03', t: 'mcq', topic: 'Equity\'s Darling', src: 'Prof-style (new)',
      q: 'Which of the following is NOT an element a buyer must show to take free of a prior equitable interest as "Equity\'s Darling"?',
      o: ['Acting in good faith throughout the purchase.',
        'Giving value for the property, not taking a gift.',
        'Acquiring the legal estate, not merely a contract.',
        'Lodging a caveat before completion of the sale.'],
      a: 3, why: 'The four elements: good faith, value, legal estate, no notice. A caveat is how a CLAIMANT protects an equitable interest on registered land; it is not part of the Equity\'s Darling test.', trap: 'legal-estate' },
    { id: 'c2-04', t: 'mcq', topic: 'Notice', src: 'Prof-style (new)',
      q: 'Tom holds a shophouse (unregistered land) on trust for his sister Rina. In breach of trust he sells it to Pete for full value and conveys the legal estate by deed. Pete himself knew nothing of the trust, but Pete\'s solicitor had seen a copy of the trust deed during the title search and did not mention it. In this case:',
      o: ['Pete takes free of Rina\'s interest, because he personally had no actual knowledge of the trust.',
        'Pete is bound by Rina\'s interest, because his solicitor\'s knowledge is imputed to him.',
        'Pete is bound only if he failed to lodge a caveat against the shophouse before completion.',
        'Rina\'s interest ends automatically once the legal estate is conveyed to a paying buyer.'],
      a: 1, why: 'Notice includes imputed notice: what the buyer\'s solicitor or agent knew. Pete fails the "without notice" element, so he is not Equity\'s Darling.', trap: 'imputed' },
    { id: 'c2-05', t: 'mcq', topic: 'Equity\'s Darling', src: 'Prof-style (new)',
      q: 'A trustee, in breach of trust, transfers trust land by way of gift to his friend Faye. Faye acts in good faith and knows nothing of the trust. In this case:',
      o: ['Faye takes free of the beneficiary\'s interest, because she had no notice of the trust.',
        'Faye takes subject to the beneficiary\'s interest, because a gift is not value.',
        'Faye takes free of it, because she acquired the legal estate and acted in good faith.',
        'The transfer is void at law, so Faye takes nothing and the trustee keeps the land.'],
      a: 1, why: 'Value is one of the four elements. A donee, however innocent, takes subject to prior equitable interests.', trap: 'gift-value' },
    { id: 'c2-06', t: 'mcq', topic: 'Walsh v Lonsdale', src: 'Prof-style (new)',
      q: 'Lena and her landlord sign a written agreement for a 10-year lease of a shop, but no deed is executed and nothing is registered. Lena moves in and pays rent. The landlord claims Lena has no lease at all. In this case:',
      o: ['Lena has no rights at all, because a lease of over 7 years must be made by deed.',
        'Lena likely holds an equitable lease on the agreed terms (Walsh v Lonsdale).',
        'Lena has a legal lease, because she has moved in and paid rent every month.',
        'Lena has only a bare licence, which the landlord may revoke at any time.'],
      a: 1, why: 'Without a deed there is no LEGAL lease, but a written, specifically enforceable agreement is treated in equity as the lease. (On registered land she should still caveat: Lot 9.)', trap: 'walsh' },
    { id: 'c2-07', t: 'set', topic: 'Remedies', src: 'Prof-style (new)',
      q: 'The following statement/s is/are true about remedies:',
      s: [
        ['Specific performance may be refused to a claimant who comes without clean hands.', true, 'Equitable remedies are discretionary (Lee Christina, Lot 8).'],
        ['Damages are recoverable for any loss, however remote, once breach is proved.', false, 'Hadley v Baxendale limits damages to loss arising naturally or contemplated by both parties.'],
        ['A fixed sum payable on breach that is a genuine pre-estimate of loss is enforceable as liquidated damages.', true, 'Dunlop v New Garage.'],
        ['Delay can defeat a claim for an equitable remedy.', true, 'Laches: delay defeats equity.']
      ], opts: [[0, 2], [0, 2, 3], [1, 3], [0, 1, 2, 3]] },
    { id: 'c2-08', t: 'mcq', topic: 'Maxims', src: 'Prof-style (new)',
      q: 'A buyer refused to complete a purchase when the market fell, then demanded specific performance once prices rose again. The court refused the order. The maxim that best explains the refusal is:',
      o: ['Equity follows the law and so cannot depart from it.',
        'He who comes to equity must come with clean hands.',
        'Equity treats as done what ought to be done.',
        'Equity will not suffer a wrong without a remedy.'],
      a: 1, why: 'The buyer\'s own conduct barred the discretionary remedy (Lee Christina v Lee Eunice: unclean hands).', trap: 'eq-discretion' },
    { id: 'c2-09', t: 'mcq', topic: 'Conversion', src: 'Prof-style (new)',
      q: 'Once a valid, specifically enforceable contract for the sale of land is made, and before completion:',
      o: ['The buyer already holds the legal title, so the transfer is a formality.',
        'The buyer owns the land in equity; the seller keeps legal title as bare trustee.',
        'Neither party has any interest in the land until the transfer is registered.',
        'The seller may still sell to a higher bidder without any liability to the buyer.'],
      a: 1, why: '"Equity treats as done what ought to be done" (conversion): the buyer is owner in equity (Lysaght v Edwards). The legal title moves only on registration.' },
    { id: 'c2-10', t: 'mcq', topic: 'Registered land', src: 'Prof-style (new)',
      q: 'Hana holds an unregistered equitable interest in a registered condominium unit. She lodges no caveat. The owner sells to Dev, who knows about Hana\'s claim, pays full value and registers. Hana argues Dev\'s knowledge makes him fraudulent. In this case:',
      o: ['Dev is bound, because knowledge of an equitable interest always defeats a later buyer.',
        'Knowledge is not of itself fraud (s 47(2) LTA), so Hana must prove dishonesty to defeat Dev.',
        'Dev is bound, because a buyer who knows of an earlier claim can never be Equity\'s Darling here.',
        'Hana\'s interest appears on the register automatically, so Dev took subject to it.'],
      a: 1, why: 'On registered land the register replaces the notice inquiry. Knowledge alone is not fraud; Hana needed a caveat, or must prove dishonesty under s 46(2)(a).', trap: 'torrens-notice' },
    { id: 'c2-11', t: 'mcq', topic: 'Equity\'s Darling', src: 'Prof-style (new)',
      q: 'Bina contracts to buy a house that is subject to a trust she knows nothing about. She has paid a deposit but completion has not taken place. The trust beneficiary sues. In this case:',
      o: ['Bina is Equity\'s Darling, because she acted in good faith and has paid a deposit.',
        'Bina is not yet Equity\'s Darling, because she has not acquired the legal estate.',
        'Bina wins, because a signed contract for sale always defeats an earlier trust.',
        'Bina wins, because her deposit was more than 10% of the purchase price.'],
      a: 1, why: 'The defence protects only a purchaser who has acquired the legal estate. A contract gives Bina, at most, an equitable interest.', trap: 'legal-estate' },
    { id: 'c2-12', t: 'mcq', topic: 'Damages', src: 'Prof-style (new)',
      q: 'A lease says the tenant must pay $50,000 for any late payment of rent, however small. Monthly rent is $3,000. The landlord\'s likely loss from late payment is interest for a few days. The clause is most likely:',
      o: ['Valid liquidated damages, because the parties agreed the figure in advance.',
        'An unenforceable penalty, being out of all proportion to the likely loss.',
        'Valid, because both parties signed the lease after taking legal advice.',
        'A clog on the equity of redemption, and so void in equity for that reason.'],
      a: 1, why: 'Dunlop: a sum extravagant in comparison with the greatest conceivable loss is a penalty. (A clog is a mortgage concept, Lot 5.)' },
    { id: 'c2-13', t: 'mcq', topic: 'Notice', src: 'Prof-style (new)',

/* Lot 4 — Easements, natural rights (support) and licences [L5 part 1] */
LL.chapter({
  n: 4, code: 'LOT 4', lec: 'L5', title: 'Easements, Support and Licences', short: 'Easements',
  place: 'Tai Seng Industrial Estate', spot: 'A printing factory beside a basement dig', icon: 'factory', sky: 404,
  mentor: ['engineer'], mentorName: 'Er. Rahman, site engineer',
  story: [
    'The neighbour is digging a basement car park right up to the boundary. Sheet piles, no continuous monitoring. Cracks are already showing.',
    'Every landowner may expect support from the neighbouring soil. That is a natural right. In England it protects the land only; buildings need an easement or a negligence claim.',
    'In Singapore, Xpress Print v Monocrafts took the duty further, to buildings on the land. State both lines, then add negligence for the missing monitoring.',
    'Easements are the other half of this lot. Four tests from Re Ellenborough Park. If a claimed right fails them, it is at most a licence.'
  ],
  win: 'Solid ground. Four tests, one fact per test, and you know when a right is only a licence. Next: Raffles Place, and the banks.',
  idea: 'An easement is a right over a neighbour\'s land that must pass four tests. Support for land is a natural right; in Singapore Xpress Print extends the duty to buildings.',
  plain: [
    'An easement is a right the owner of one plot (dominant land) has over another plot (servient land): a right of way, a drain, a pipe. It belongs to the land, so it binds later owners of the servient land. It must pass four tests.',
    'Natural rights exist without any grant. The most tested is the right of support: you may not dig your land so that the neighbour\'s land collapses. Xpress Print v Monocrafts is the Singapore case, and it extends the duty to buildings.',
    'A licence is permission. It is personal, revocable in many cases, and does not bind a later buyer, with narrow exceptions.'
  ],
  tested: [
    ['Four tests (Re Ellenborough Park)', 'A neighbour claims a right to park, store goods, use a garden.', 'High'],
    ['Natural right of support', 'Excavation next door damages a factory (Printwell v Costco).', 'High (past-year sample 2)'],
    ['Creation of easements', 'Express, implied (necessity, Wheeldon v Burrows), prescription.', 'Medium'],
    ['Ending an easement', 'Unity of ownership, release, abandonment, change in dominant land (Graham v Philcox).', 'Medium'],
    ['Licences', 'Bare, contractual, coupled with a grant, estoppel.', 'Medium (links to Lot 6)']
  ],
  terms: [
    ['Dominant / servient tenement', 'The land that benefits / the land that is burdened.'],
    ['Positive / negative easement', 'A right to do something on the neighbour\'s land / a right to stop the neighbour doing something.'],
    ['Ouster', 'The easement takes so much that the servient owner cannot use the land. Disqualifies the right.'],
    ['Quasi-easement', 'A right an owner uses over one part of his land for another part. It can become an easement on a sale.'],
    ['Natural right', 'Comes with owning land. Needs no grant.'],
    ['Lateral and subjacent support', 'Support from the soil beside and the soil under the land.'],
    ['Bare / contractual / estoppel licence', 'Mere permission / permission under a contract / permission backed by a promise and detrimental reliance.']
  ],
  rules: [
    ['Four tests (Re Ellenborough Park)', '(1) A dominant and a servient tenement. (2) The right accommodates the dominant tenement (benefits the land). (3) Different owners. (4) Capable of forming the subject matter of a grant: definite, within the nature of easements, no exclusive possession or ouster.'],
    ['Creation', 'Express grant or reservation by deed (on registered land, noted on the CT). Implied: necessity, common intention, Wheeldon v Burrows, general words. Prescription: long use as of right; Singapore\'s position on registered land is narrow [check slide]. Equity: a specifically enforceable agreement for an easement.'],
    ['Ending', '(a) Unity of ownership. (b) Alteration of the dominant land, which ends the easement only if the extent of use grows (Graham v Philcox). (c) Release, express or implied. (d) Abandonment: prolonged non-use plus intention.'],
    ['Natural right of support', 'Every landowner may expect support from adjoining soil. A neighbour must secure alternative support before removing soil. Xpress Print (SGCA): the duty covers the claimant\'s buildings; breach where soil was removed without enough alternative support.'],
    ['Negligence', 'A further claim where the excavator failed to take proper care, e.g. no monitoring of movement. Consequential loss following physical damage is recoverable.'],
    ['Licences', 'Bare: revocable at will. Contractual: contract terms govern revocation. Coupled with a grant: lasts with the grant. Estoppel: promise, reliance, detriment, so withdrawal would be unconscionable.']
  ],
  cases: [
    ['Re Ellenborough Park [1956] CA', 'House owners around a park claimed a right to use the garden.', 'A right to enjoy a garden was an easement. The four tests were set out.', 'The checklist.'],
    ['Hill v Tupper (1863)', 'A canal company gave a man the sole right to hire boats on the canal; a rival hired boats.', 'A personal commercial advantage is no easement.', 'Fails test 2 (accommodation).'],
    ['Copeland v Greenhalf [1952]', 'A wheelwright stored vehicles on a strip of land for years.', 'The use amounted to possession. No easement.', 'Ouster: storage fails test 4.'],
    ['Batchelor v Marlow [2003]', 'A right to park all day on weekdays.', 'Too much: it took away the owner\'s use.', 'Parking: limited rights can pass, all-day rights fail.'],
    ['Phipps v Pears [1965]', 'A neighbour demolished his house, exposing the plaintiff\'s wall to weather.', 'No easement of protection from weather.', 'Negative easements recognised sparingly.'],
    ['Dyce v Hay (1852)', 'A claim to walk over a moor.', 'The categories of easement are not closed, but new ones are admitted with care.', 'The list can grow.'],
    ['Wheeldon v Burrows (1879)', 'An owner sold part of his land; the buyer claimed a right of light over the retained part.', 'On a sale of part, quasi-easements that are continuous and apparent, necessary for reasonable enjoyment and in use pass to the buyer. Failed on its facts.', 'Implied easements on a sale.'],
    ['Graham v Philcox [1984]', 'A right of way for a house later converted into flats.', 'Altering the dominant land ends the easement only if the extent of use increases.', 'Ending or limiting an easement.'],

    ['Xpress Print v Monocrafts [2000] 1 SLR(R) 1', 'A neighbour removed soil next to Xpress Print\'s land and building without sufficient alternative support.', 'SGCA: duty to support the claimant\'s property, including buildings, and it was breached.', 'Natural right of support in Singapore, and buildings.'],
    ['Wood v Leadbitter (1845)', 'A ticket holder was ejected from a racecourse.', 'A licence with no interest is revocable; remedy damages. A licence coupled with a grant lasts as long as the grant.', 'Revocability.'],

  nums: [['Dalton v Angus long use', 'Building had stood over 20 years']],
  traps: [
    'Separate land from buildings on support. State the English line (natural right protects land; buildings need an easement or negligence), then say Xpress Print extends the duty to buildings in Singapore.',
    'For the four tests give one fact per test, and name the weak test for a borderline right (parking: ouster; business benefit: accommodation).',
    'An easement is a property right that binds buyers. A licence is permission. Say which one the facts show.',

  qs: [
    { id: 'c4-01', t: 'mcq', topic: 'Four tests', src: 'Prof-style (new)',
      q: 'Which of the following is NOT one of the requirements for an easement set out in Re Ellenborough Park?',
      o: ['There must be a dominant and a servient tenement.',
        'The right must accommodate the dominant tenement.',
        'The two tenements must be owned by the same person.',
        'The right must be capable of forming the subject of a grant.'],
      a: 2, why: 'The tenements must have DIFFERENT owners. A person cannot have an easement over his own land (unity ends an easement).', trap: 'four-tests' },
    { id: 'c4-02', t: 'mcq', topic: 'Accommodation', src: 'Prof-style (new)',
      q: 'A canal owner grants Hilda the "sole and exclusive right" to rent out kayaks on the canal. A rival starts renting kayaks. Hilda claims an easement. In this case:',
      o: ['Hilda has an easement, because the right was granted to her in a signed deed.',
        'No easement: a commercial monopoly does not accommodate any land (Hill v Tupper).',
        'Hilda has an easement, because the categories of easement are not closed to new rights.',
        'Hilda has a natural right that protects her business on the canal against rivals.'],
      a: 1, why: 'Hill v Tupper: a monopoly for a business is not a right that benefits land as land.', trap: 'accommodate' },
    { id: 'c4-03', t: 'mcq', topic: 'Ouster', src: 'Prof-style (new)',
      q: 'The owner of Unit A claims the right to park two cars on Unit B\'s driveway all day, Monday to Friday, and to keep bicycles in a shed on Unit B\'s land. In this case:',
      o: ['Both rights are easements, because each of them benefits Unit A as a home.',
        'Both probably fail as ouster: they exclude B from that part of his land.',
        'Only the bicycle right fails, because parking can never be an easement at all.',
        'Both are valid easements, because the categories of easement are not closed.'],
      a: 1, why: 'All-day parking and storage exclude the servient owner. A narrower parking right (one space, limited times) could pass.', trap: 'ouster' },
    { id: 'c4-04', t: 'set', topic: 'Support', src: 'Prof-style (new)',
      q: 'The following statement/s is/are true about the right of support:',
      s: [
        ['The right of support for land from neighbouring land is a natural right that needs no grant.', true, 'It comes with ownership of land.'],
        ['In England, support for a building generally needs an easement, for example acquired by long use (Dalton v Angus).', true, 'The traditional English line.', 'support-buildings'],
        ['Xpress Print v Monocrafts held that in Singapore the duty of support does not extend to buildings.', false, 'The opposite: the Court of Appeal extended the duty to the claimant\'s buildings.', 'support-buildings'],
        ['A cause of action for loss of support arises when the damage occurs (Backhouse v Bonomi).', true, 'Not when the digging happened.']
      ], opts: [[0, 1], [0, 1, 3], [2, 3], [0, 2, 3]] },
    { id: 'c4-05', t: 'mcq', topic: 'Support', src: 'Practice paper (sample Q2)',
      q: 'Costco excavates for a basement car park next to Printwell\'s four-storey factory. On its engineers\' advice it installs sheet piles but sets up no continuous monitoring. Soil settles and the factory cracks; Printwell suspends operations. In this case:',
      o: ['Costco is not liable, because it relied in good faith on its engineers\' expert advice.',
        'Costco is likely liable under Xpress Print and in negligence, lost profits included.',
        'Printwell can recover only if it holds a registered easement of support for the factory.',
        'Printwell can recover its repair costs, but never the profits lost while it was closed.'],
      a: 1, why: 'Xpress Print extends the duty to buildings, so no easement is needed. Engineers\' advice does not displace Costco\'s own duty (Costco may seek contribution). Consequential loss following physical damage is recoverable in negligence.', trap: 'support-buildings' },
    { id: 'c4-06', t: 'mcq', topic: 'Implied easements', src: 'Prof-style (new)',
      q: 'Under the rule in Wheeldon v Burrows, a quasi-easement passes to the buyer of part of the seller\'s land if it was:',
      o: ['Recorded in the seller\'s Will, so it passed to the buyer on the seller\'s death.',
        'Continuous and apparent, necessary for reasonable enjoyment, and in use.',
        'Used openly by members of the public for twenty years or more.',
        'Agreed orally between buyer and seller after the sale was completed.'],
      a: 1, why: 'Those are the Wheeldon v Burrows conditions for an implied grant on a sale of part.' },
    { id: 'c4-07', t: 'mcq', topic: 'Ending easements', src: 'Prof-style (new)',
      q: 'A house with a right of way over a neighbour\'s drive is converted into two flats. The servient owner says the easement has ended. In this case:',
      o: ['The easement ends automatically, because the dominant land has been altered.',
        'It continues unless the change substantially increases the use (Graham v Philcox).',
        'The easement ends, because two separate flat owners would now share the right of way.',
        'The easement is converted into a licence that the servient owner may revoke.'],
      a: 1, why: 'Graham v Philcox: alteration ends or limits the easement only if it increases the burden.', trap: 'philcox' },
    { id: 'c4-08', t: 'mcq', topic: 'Licences', src: 'Prof-style (new)',
      q: 'Ms Goh lets her neighbour Mr Koh walk across her garden to reach the main road, free of charge and without any document. Five years later she sells to Ben, who blocks the path. In this case:',
      o: ['Mr Koh has an easement, because he has used the path openly for five years.',
        'Mr Koh had a bare licence, which is revocable and does not bind Ben.',
        'Mr Koh has a contractual licence, which binds Ben as the new owner.',
        'Ben must allow the path, because licences run with the land on a sale.'],
      a: 1, why: 'No grant, no consideration: a bare licence. It is personal and does not bind a buyer. Estoppel would need a promise and detrimental reliance, which the facts do not show.', trap: 'licence-personal' },
    { id: 'c4-09', t: 'mcq', topic: 'Licences', src: 'Prof-style (new)',
      q: 'A father tells his son to build a house on the father\'s land, promising he can live there for life. The son spends his savings building it. The father later demands that he leave. The son\'s strongest claim is:',
      o: ['A bare licence, which his father may revoke at any time he likes.',
        'An estoppel licence, since he relied on the promise to his detriment.',
        'An easement of support for the house that he built on the land.',
        'A tenancy under Street v Mountford, because he has exclusive possession.'],
      a: 1, why: 'Promise, reliance, detriment, unconscionability: proprietary estoppel / estoppel licence.' },
    { id: 'c4-10', t: 'mcq', topic: 'Licences and third parties', src: 'Prof-style (new)',
      q: 'The following statement is true about a contractual licence and a buyer of the land:',
      o: ['It always binds the buyer, because it was created by a valid contract.',
        'It binds the buyer only if conscience requires a constructive trust.',
        'It never binds anyone, not even the licensor who originally granted it.',
        'It becomes an easement automatically when the land is sold.'],
      a: 1, why: 'A licence is personal. Ashburn Anstalt allows a constructive trust where the buyer\'s conscience is affected, for example by agreeing to honour it.', trap: 'licence-personal' },
    { id: 'c4-11', t: 'mcq', topic: 'Negative easements', src: 'Prof-style (new)',
      q: 'Phipps v Pears decided that:',
      o: ['There is an easement to be protected from the weather by a neighbour\'s house wall.',
        'No easement of weather protection; new negative easements are admitted sparingly.',
        'A right to park all day on a neighbour\'s driveway can be a valid easement.',
        'Support for buildings is a natural right in England, needing no grant.'],
      a: 1, why: 'Courts are slow to recognise new negative easements because they restrict the neighbour\'s use of his own land.' },
    { id: 'c4-12', t: 'set', topic: 'Four tests', src: 'Prof-style (new)',
      q: 'Owners of houses around a private garden claim a right to use the garden for recreation. The following statement/s is/are true:',
      s: [
        ['The houses are the dominant tenements and the garden is the servient tenement.', true, 'Test 1.'],
        ['A right to enjoy a garden can accommodate the houses, as in Re Ellenborough Park.', true, 'It enhanced the houses as homes.'],
        ['The right fails because it is merely recreational.', false, 'Re Ellenborough Park upheld exactly such a right.'],
        ['The right must not amount to exclusive possession of the garden by the house owners.', true, 'Test 4: no ouster.', 'ouster']
      ], opts: [[0, 1], [0, 1, 3], [2, 3], [0, 1, 2, 3]] },
    { id: 'c4-13', t: 'mcq', topic: 'Easement v licence', src: 'Prof-style (new)',
      q: 'The key practical difference between an easement and a licence is that:',
      o: ['An easement is personal to the parties, whereas a licence runs with the land on a sale.',
        'An easement can bind later owners of the servient land; a licence generally cannot.',
        'Only a licence must be made by deed; an easement can always be created orally.',
        'There is no practical difference; the two words mean the same thing in law.'],
      a: 1, why: 'An easement belongs to the land. A licence is personal and usually does not bind a buyer.', trap: 'licence-personal' },
    { id: 'c4-14', t: 'mcq', topic: 'Support', src: 'Prof-style (new)',
      q: 'In a support claim, the excavating neighbour argues that the claimant\'s heavy building contributed to the settlement. The best way to treat this argument in an ILAC answer is:',
      o: ['Ignore it, because the claimant\'s building has nothing to do with liability.',
        'Raise it as the defendant\'s point, then answer it with Xpress Print and lack of care.',
        'Treat it as a complete defence that ends the claimant\'s whole case on support.',
        'Turn the claim into one for breach of a restrictive covenant, which is easier to prove.'],
      a: 1, why: 'The ILAC frame: state the other side\'s best point in one sentence, then answer it. The Q&A Bank lists this as Costco\'s likely reply.', trap: 'support-buildings' }
  ],

    ['A bare licence binds a buyer of the land.', false, 'It is personal and revocable.'],
    ['Estoppel needs a promise, reliance and detriment.', true, 'Inwards v Baker.'],

LL.chapter({

  mentor: ['banker'], mentorName: 'Mr Ong, retired credit officer',
  story: [
    'Raffles Place. Every tower here lends against land. The borrower is the mortgagor; the bank is the mortgagee. Do not mix them up in the exam.',
    'Equity watches us closely. Once a mortgage, always a mortgage: the borrower can always redeem by paying principal, interest and costs. Terms that shackle that right are clogs.',
    'First question in every clog answer: who is the borrower? An advised company is held to its bargain. An elderly, illiterate borrower is protected.',

  win: 'Bankable work. Profile the borrower, name the clog, cite the case, give the remedy. Next: Orchard Road, and the law of leases.',
  idea: 'The borrower can always redeem. Equity strikes down terms that shackle that right, and the lender must sell fairly.',
  plain: [
    'A mortgage is a loan secured on land. Mortgagor = borrower. Mortgagee = lender. In Singapore, registered land is mortgaged by a registered charge.',
    'The borrower always keeps the equity of redemption: the right to get the land back by paying the loan, interest and costs. A lender may not shackle that right (no clogs, no fetters).',
    'On default, the lender may enter, appoint a receiver, sell, or ask the court to foreclose. It must act in good faith and take reasonable care to get a fair price.',
    'Identify the borrower first. A vulnerable individual gets protection. A sophisticated commercial party is held to the bargain.'
  ],
  tested: [
    ['Clogs on the equity of redemption', 'Lock-in period, early redemption charge, tied insurance, option to buy, tie of goods. Past-year CS1 and CS2(b).', 'High'],
    ['Penalty interest', 'A default rate far above the contract rate (28% in CS2(b); 18% in Hong Leong).', 'High'],
    ['Mortgagee\'s remedies', 'Possession, receiver, power of sale, foreclosure.', 'High'],
    ['Lease granted by the mortgagor', 'Gabby lets rooms while Bestbank holds a mortgage. Does the lease bind the bank?', 'High'],
    ['Duties on sale', 'Good faith, best price reasonably obtainable.', 'Medium'],
    ['Judicial sale', 'Borrower asks the court to order sale instead of foreclosure.', 'Low–medium']
  ],
  terms: [
    ['Equity of redemption', 'The borrower\'s right to redeem after the legal date has passed. "Once a mortgage, always a mortgage."'],
    ['Clog', 'A term that stops the borrower getting the land back free of the mortgage.'],
    ['Fetter', 'A term that restricts the borrower\'s freedom in a way that outlasts redemption.'],
    ['Collateral advantage', 'An extra benefit the lender takes (a tie, an option, tied insurance).'],
    ['Penalty', 'A sum out of all proportion to the lender\'s greatest conceivable loss. Unenforceable.'],
    ['Power of sale: arisen v exercisable', 'It arises when the basic conditions are met; it becomes exercisable when a s 25 CLPA trigger occurs.'],
    ['Foreclosure', 'A court order ending the borrower\'s right to redeem. Rare; the court may order sale instead.'],
    ['Receiver', 'Appointed by the lender to collect income. Acts as the mortgagor\'s agent.']
  ],
  rules: [
    ['Registered charge', 's 69 LTA applies Part 4 of the CLPA with changes; the LTA prevails in a conflict (s 69(4)). A mortgagee under the LTA has no legal title of its own.'],
    ['Redemption', 'Contractual date in the deed; then the equity of redemption: pay principal, interest and costs. s 76 LTA treats a defaulting mortgagor as having the equity. It is a proprietary interest (can be caveated, sold, mortgaged).'],
    ['Lease by mortgagor', 's 23 CLPA: a mortgagor in possession may grant an occupation lease of up to 3 years (unless the deed says otherwise). s 89(1) LTA: a lease granted after the mortgage binds the mortgagee only if authorised by the mortgage or by law, or if the mortgagee consents. A lease that pre-dates the mortgage binds the mortgagee.'],
    ['Possession', 'No inherent right to possession under a registered charge. s 75 LTA: after default, the mortgagee may enter after one month\'s notice and take rents and profits, accounting for them.'],
    ['Receiver', 'ss 24–29 CLPA. Appointed when the power of sale is exercisable. Acts as the mortgagor\'s agent.'],
    ['Power of sale', 'Arisen (all three): mortgage by deed, money due, no exclusion. Exercisable (any one, s 25): (a) notice to pay and 3 months\' default; (b) interest 1 month in arrears; (c) breach of another term. Proceeds: prior incumbrances, costs, the mortgagee\'s debt, later mortgagees, then the mortgagor (s 26(3) CLPA; s 74 LTA).'],
    ['Duty on sale', 'Act in good faith and take reasonable care to get the best price reasonably obtainable (Cuckmere). No duty to wait for a better market (China & South Sea Bank).'],
    ['Foreclosure and judicial sale', 'Foreclosure by court order only (s 76 LTA). s 30 CLPA: the court may order sale instead of redemption or foreclosure (Palk). s 19 CLPA: the borrower may require the lender to assign the debt to a third party.'],
    ['Insurance', 's 24(1)(b) CLPA: the lender may insure; the premium becomes a charge on the property.'],
    ['Unconscionability (Singapore)', 'BOM v BOK [2018] SGCA: the claimant shows an infirmity that the other party exploited; the burden then shifts to the other party to show the transaction was fair.']
  ],
  method: { t: 'Clogs and fetters: how to decide', steps: [

    'Remedy: a void term falls away; the borrower redeems free of it, or pays only the contract rate.'

  cases: [
    ['Fairclough v Swan Brewery [1912] PC', 'A tenant of a 17-year lease could not redeem until six weeks before the lease ended.', 'Void: redemption was illusory, since the land would be worth nothing by then.', 'Postponement that makes redemption worthless.'],
    ['Knightsbridge Estates v Byrne [1939] CA', 'Companies borrowed on properties, repayable over 40 years.', 'Valid: commercial, advised parties; the postponement need not be reasonable.', 'Commercial parties held to long postponement.'],
    ['Fiscal Consultants v Asia Commercial Finance', 'A commercial borrower faced about 15 months\' interest on early redemption.', 'Valid between commercial parties. [check facts]', 'Singapore: early redemption charges.'],
    ['Esso Petroleum v Harper\'s Garage [1968] HL', 'Garage mortgaged to Esso with a 21-year solus tie and no redemption during it.', 'The 21-year tie was an unreasonable restraint of trade, and the postponement fell with it. A 4.5-year tie stood.', 'Ties and restraint of trade.'],
    ['Samuel v Jarrah Timber [1904] HL', 'A mortgage of debentures gave the lender an option to buy them.', 'Void: the option was part of the mortgage and stopped the borrower recovering his property.', 'Option to buy given to the mortgagee.'],

    ['Citicorp v Wee Ah Kee [1997]', 'A commercial borrower gave an option to buy shares.', 'Valid between commercial parties; the clog rule has declining force for sophisticated borrowers. [check]', 'Singapore commercial leniency.'],
    ['Kreglinger v New Patagonia Meat [1914] HL', 'A loan came with a 5-year option to buy sheepskins; the loan could be repaid early.', 'Valid: a separate collateral bargain that did not clog redemption.', 'Collateral advantage test.'],

    ['BOM v BOK [2018] SGCA', 'A Singapore case on unconscionability.', 'Narrow test: infirmity exploited, then the exploiter must prove fairness.', 'Unconscionability in Singapore.'],
    ['Hong Leong Finance v Tan Gin Huay [1999]', 'Two elderly illiterate sisters borrowed on a 15-year loan at 5.5–6.75% with 18% default interest.', 'The default rate was a penalty, out of all proportion to the greatest conceivable loss. "Industry practice" rejected.', 'Default interest; vulnerable borrowers.'],
    ['China & South Sea Bank v Tan Soon Gin [1990] PC', 'A lender waited before selling.', 'No duty to sell at any particular time or to wait for a better market.', 'Timing of sale.'],
    ['Cuckmere Brick v Mutual Finance [1971] CA', 'A lender sold without advertising the planning permission.', 'Reasonable care to get the true market value.', 'Duty on sale.'],
    ['Palk v Mortgage Services [1993] CA', 'A lender refused to sell in a falling market while the debt grew.', 'The court ordered sale at the borrower\'s request.', 'Judicial sale (s 30 CLPA).'],
    ['Tan Hin Choon v Ban Hin Lee Bank; OUB v Chua Kok Kay [check]', 'A mortgagee in possession and rent.', 'A mortgagee in possession must account for rent and use due diligence.', 'Rights and duties in possession.']

  secs: [

    ['s 69, 74, 75, 76, 77 LTA', 'Registered charge, proceeds, possession (one month\'s notice), foreclosure and equity of redemption, discharge', 'Registered-land mortgages.'],

  qs: [
    { id: 'c5-01', t: 'mcq', topic: 'Equity of redemption', src: 'Prof-style (new)',

      o: ['It ends on the contractual redemption date stated in the mortgage, and not later.',

        'It belongs to the mortgagee, who may use it to take over the land on default.',

    { id: 'c5-02', t: 'mcq', topic: 'Postponement', src: 'Prof-style (new)',

    { id: 'c5-03', t: 'mcq', topic: 'Postponement', src: 'Prof-style (new)',

    { id: 'c5-04', t: 'mcq', topic: 'Option to purchase', src: 'Prof-style (new)',

        'The broker becomes owner of the company\'s land if it stops supplying skins.'],
      a: 1, why: 'Kreglinger: a collateral advantage that is a separate, fair commercial bargain is valid even if it outlasts repayment.', trap: 'collateral' },
    { id: 'c5-06', t: 'mcq', topic: 'Penalty interest', src: 'Prof-style (new)',
      q: 'Two elderly, illiterate sisters take a 15-year loan at 6% a year. The mortgage provides 18% interest on overdue instalments. The lender says 18% is industry practice. In this case:',
      o: ['The 18% rate is valid, because it reflects standard industry practice.',
        'The 18% rate is likely a penalty, out of all proportion to the lender\'s loss.',
        'The whole loan is void, because the sisters could not read the loan documents.',
        'The sisters must pay 18%, because they signed the mortgage deed themselves.'],
      a: 1, why: 'Hong Leong rejected "industry practice". The lender recovers the contract rate plus real loss.', trap: 'penalty-default' },
    { id: 'c5-07', t: 'set', topic: 'Power of sale', src: 'Prof-style (new)',
      q: 'The following statement/s is/are true about a mortgagee\'s power of sale under the CLPA:',
      s: [
        ['The power arises only if the mortgage is by deed, the money is due, and the power is not excluded.', true, 'All three conditions are cumulative.', 'arisen-exercisable'],
        ['The power becomes exercisable only when all three s 25 triggers have occurred.', false, 'Any ONE trigger suffices: notice + 3 months\' default; interest 1 month in arrears; or breach of another term.', 'arisen-exercisable'],
        ['Interest one month in arrears is one of the s 25 triggers.', true, 's 25(b).'],
        ['Any surplus after the debts and costs are paid belongs to the mortgagee.', false, 'Surplus goes to later mortgagees and then the mortgagor (s 26(3) CLPA; s 74 LTA).']
      ], opts: [[0], [0, 2], [1, 2], [0, 2, 3]] },
    { id: 'c5-08', t: 'mcq', topic: 'Possession', src: 'Prof-style (new)',
      q: 'Bestbank holds a registered charge over Gabby\'s house. Gabby falls into arrears. Bestbank wants to take possession tomorrow without notice. In this case:',
      o: ['Bestbank may take possession at any time, because it holds the legal title.',
        'Only after default and one month\'s notice (s 75 LTA), accounting for rents.',
        'Bestbank can never take possession of registered land without a court order.',
        'Bestbank must first foreclose before it can take possession of the house.'],
      a: 1, why: 'A chargee under the LTA has no legal title and no inherent right to possession. s 75 LTA sets the one-month notice route.', trap: 's75' },
    { id: 'c5-09', t: 'mcq', topic: 'Lease by mortgagor', src: 'Practice paper (CS1 style)',
      q: 'A year after mortgaging No. 13 to Bestbank, Gabby (still in possession) lets three rooms to students for 24 months. The mortgage deed says nothing about leasing. Gabby defaults. In this case:',
      o: ['It cannot bind Bestbank, because any lease granted after a mortgage is void against it.',
        'It likely binds Bestbank: s 23 CLPA leases up to 3 years are authorised (s 89(1) LTA).',
        'It binds Bestbank only if it exceeds 7 years and is registered under the Land Titles Act.',
        'It ends automatically as soon as Bestbank sends Gabby its notice of taking possession.'],
      a: 1, why: 'Which came first? The mortgage. So ask s 23 CLPA (3-year statutory power, deed silent) and s 89(1) LTA (authorised by law). 24 months fits.', trap: 'lease-mortgage' },
    { id: 'c5-10', t: 'mcq', topic: 'Duty on sale', src: 'Prof-style (new)',
      q: 'After one month\'s notice and continued default, Bank X sells Rina\'s home, without advertising it, to Bank X\'s own subsidiary for $1.1m. Rina\'s valuation is $1.4m. In this case:',
      o: ['Bank X is protected, because it gave Rina one month\'s notice before it sold the home.',
        'Bank X likely breached its duty to take care to get the true market value (Cuckmere).',
        'Bank X breached its duty to wait for a better market before selling Rina\'s home.',
        'Rina\'s only remedy lies against the directors of the bank\'s subsidiary company.'],
      a: 1, why: 'Sale to an associate, no marketing, price about 21% below value: strong evidence of breach. (There is no duty to wait for a better market: China & South Sea Bank.)', trap: 'sale-duty' },
    { id: 'c5-11', t: 'mcq', topic: 'Duty on sale', src: 'Prof-style (new)',
      q: 'A mortgagee sells promptly in a falling market at a fair, properly advertised price. The borrower says it should have waited six months for prices to recover. In this case:',
      o: ['The mortgagee is liable, because it failed to wait six months for prices to recover.',
        'Not liable: there is no duty to wait for a better market (China & South Sea Bank).',
        'The sale is void, because it took place while the market was still falling.',
        'The borrower may claim back the whole of the sale price from the lender.'],
      a: 1, why: 'The mortgagee chooses the timing; its duty is to take reasonable care for the true market value WHEN it sells.', trap: 'sale-duty' },
    { id: 'c5-12', t: 'mcq', topic: 'Judicial sale', src: 'Prof-style (new)',
      q: 'A borrower in negative equity wants her mortgaged flat sold now, but the lender refuses to sell while interest keeps growing. Her best route is:',
      o: ['Ask the court to order a sale under s 30 CLPA (Palk v Mortgage Services).',
        'Lodge a caveat against the lender to force it to sell the flat straight away.',
        'Argue that the lender has no power of sale because she is in default.',
        'Foreclose on the lender, so that the debt is extinguished immediately.'],
      a: 0, why: 's 30 CLPA allows the court to order a sale at the borrower\'s request even against the lender\'s wishes (Palk).' },
    { id: 'c5-13', t: 'set', topic: 'Clogs (borrower profile)', src: 'Past-year paper (CS2(b) style)',
      q: 'Zen, a veteran property fund manager, and Belle take a 10-year mortgage loan from Bigbank. Terms: (1) late instalments carry 28% default interest a year; (2) the earliest redemption date is in nine years. The following statement/s is/are true:',
      s: [
        ['The 28% default rate is likely an unenforceable penalty, since the penalty test turns on proportionality to the lender\'s loss, whatever the borrower\'s skill.', true, 'Compare Hong Leong (18%). Bigbank must justify 28% as a genuine pre-estimate.', 'penalty-default'],
        ['Zen\'s experience makes Knightsbridge relevant to the nine-year postponement.', true, 'Sophisticated borrowers are held to long postponements.', 'borrower-profile'],
        ['The nine-year bar is automatically void because it covers most of the loan term.', false, 'The penthouse keeps its value, so redemption is not illusory as in Fairclough. Belle would need to show exploitation (BOM v BOK).'],
        ['Belle, as co-borrower, is liable only for half of the debt.', false, 'As co-borrower she is liable for the whole debt with Zen\'s estate.']
      ], opts: [[0], [0, 1], [2, 3], [0, 1, 3]] },
    { id: 'c5-14', t: 'mcq', topic: 'Unconscionability', src: 'Prof-style (new)',
      q: 'Under BOM v BOK, a borrower alleging an unconscionable mortgage term must first show:',
      o: ['That the lender is a licensed bank rather than a private moneylender or a friend.',
        'An infirmity the lender exploited; the lender must then show the deal was fair.',
        'That the term was never registered against the title of the property.',
        'Morally reprehensible conduct, as in English law, with no shift of burden.'],
      a: 1, why: 'Singapore\'s narrow doctrine: infirmity, exploitation, then the burden shifts. Multiservice Bookbinding states the stricter English threshold.', trap: 'borrower-profile' },
    { id: 'c5-15', t: 'mcq', topic: 'Tied insurance', src: 'Practice paper (CS1 style)',
      q: 'Bestbank\'s mortgage requires Gabby to insure No. 13 only through Bestbank\'s subsidiary, Best Insurers. The tie lasts only while the loan is outstanding. In this case:',
      o: ['The term is void, because any tie in a mortgage is a clog on redemption.',
        'Likely valid: a collateral advantage that ends with the loan, unless unfair.',
        'The term entitles Gabby to redeem the mortgage immediately without any charge.',
        'The term is a penalty, because Best Insurers is the bank\'s own subsidiary.'],
      a: 1, why: 'It does not touch redemption and ends with the loan. s 24(1)(b) CLPA already lets a lender insure at the borrower\'s cost.', trap: 'collateral' },
    { id: 'c5-16', t: 'mcq', topic: 'Registered charge', src: 'Prof-style (new)',
      q: 'The following statement is true about a mortgage of registered land in Singapore:',
      o: ['The mortgagee becomes the legal owner of the land until the loan is fully repaid.',
        'The lender holds a registered charge, not legal title; the LTA prevails (s 69).',
        'A mortgage of registered land is valid without being registered at all.',
        'The mortgagee can foreclose without a court order once the borrower defaults.'],
      a: 1, why: 's 69 LTA. Foreclosure needs a court order (s 76).' }
  ],
  quick: [
    ['The mortgagor is the borrower.', true, 'Mortgagee = lender.'],
    ['The equity of redemption ends on the contractual redemption date.', false, 'It survives that date.'],
    ['An option for the lender to buy the mortgaged land is a void clog.', true, 'Samuel v Jarrah Timber.'],
    ['Knightsbridge upheld a 40-year postponement between commercial parties.', true, 'Advised, equal parties.'],
    ['Fairclough struck down a postponement that made redemption illusory.', true, 'Lease nearly expired.'],
    ['Hong Leong accepted "industry practice" as justifying 18% default interest.', false, 'It rejected it.'],
    ['All three s 25 CLPA triggers must occur before sale.', false, 'Any one suffices.'],
    ['Interest one month in arrears makes the power of sale exercisable.', true, 's 25(b).'],
    ['A registered chargee may take possession after one month\'s notice of default.', true, 's 75 LTA.'],
    ['A mortgagor in possession may grant an occupation lease of up to 3 years.', true, 's 23 CLPA, unless the deed excludes it.'],
    ['A mortgagee must wait for a better market before selling.', false, 'China & South Sea Bank.'],
    ['The court may order a sale at the borrower\'s request.', true, 's 30 CLPA; Palk.'],
    ['Any surplus on a mortgagee sale goes to the mortgagee.', false, 'To later mortgagees, then the mortgagor.'],
    ['Under BOM v BOK, once exploitation of an infirmity is shown, the lender must prove fairness.', true, 'Burden shifts.'],
    ['Kreglinger upheld a collateral advantage that outlasted redemption.', true, 'A separate fair bargain.']
  ]
});

/* Lot 6 — Leases and licences; landlord and tenant [L6] */
LL.chapter({
  n: 6, code: 'LOT 6', lec: 'L6', title: 'Leases and Licences', short: 'Leases',
  place: 'Orchard Road', spot: 'Level 39, a rooftop bar that lost its licence', icon: 'key', sky: 606,
  mentor: ['landlady'], mentorName: 'Mdm Sim, shop landlord',
  story: [
    'I let shops on Orchard Road. Every tenant thinks the word "licence" on the top of the agreement settles everything. It does not.',
    'Exclusive possession, for a term, at a rent: that is a lease, whatever we call it. Street v Mountford. A fork is a fork even if you call it a spade.',
    'Then the covenants. When rent is late or the tenant breaches, I need a right to forfeit, the right procedure, and I must not waive it by taking rent.',
    'And whenever you mention privity of estate, also mention privity of contract. The examiner checks for both.'
  ],
  win: 'Signed and sealed. Three elements, the deciding fact, and the forfeiture steps in order. Next: Sentosa Cove, and two names on one title.',
  idea: 'Exclusive possession for a term at a rent makes a lease, whatever the document calls it. Covenants run with the lease.',
  plain: [
    'A lease is permission to occupy land for a period that also creates a property right: it binds later owners and lenders. A licence is mere permission.',
    'The label is not decisive. If the occupier has exclusive possession for a term at a rent, it is a lease (Street v Mountford).',
    'Both sides have covenants: the tenant pays rent and repairs; the landlord gives quiet enjoyment. Covenants run with the lease when either side changes.',
    'If the tenant breaches, the landlord may sue, levy distress (seize goods for rent) or forfeit (end the lease). Statute and equity protect the tenant against harsh forfeiture.'
  ],
  tested: [
    ['Lease v licence', 'Rooms let to students; a locked room and a cleaner kept by the owner. Past-year CS1.', 'High'],
    ['Termination and notice', 'Landlord gives notice during a fixed term.', 'High'],
    ['Forfeiture and rent remedies', 'Late rent, business use in breach, distress.', 'High'],
    ['Privity of estate and contract', 'Assignment and sublease: who can sue whom.', 'High'],
    ['Quiet enjoyment and derogation', 'Landlord\'s act hurts the tenant\'s business.', 'Medium'],
    ['Formalities', 'When a lease needs a deed or registration.', 'Medium']
  ],
  terms: [
    ['Exclusive possession', 'The occupier can keep everyone out, the landlord included.'],
    ['Term certain', 'A beginning and a maximum end fixed from the start.'],
    ['Reversion', 'The landlord\'s estate after the lease ends.'],
    ['Privity of contract', 'Link between the original landlord and tenant. Lasts for the whole contractual term.'],
    ['Privity of estate', 'Link between the current landlord and current tenant. Lasts while each holds the estate.'],
    ['Assignment v sublease', 'Assignment: the tenant transfers the whole remaining term. Sublease: the tenant grants a shorter term and keeps a reversion.'],
    ['Forfeiture', 'The landlord ends the lease for breach and re-takes possession.'],
    ['Distress', 'Seizure of the tenant\'s goods for unpaid rent under the Distress Act.'],
    ['Quiet enjoyment, non-derogation', 'Implied promises that the landlord will not substantially interfere with the tenant\'s possession or defeat the purpose of the grant.'],
    ['Caveat lessee', 'Tenant takes the premises as found. No implied promise that they suit the tenant\'s purpose.']
  ],
  rules: [
    ['Three elements', '(1) Exclusive possession. (2) Term of certain duration. (3) Usually rent.'],
    ['Test', 'Street v Mountford: exclusive possession for a term at a rent gives a tenancy, whatever the label. Exceptions: no intention to create legal relations (family, generosity), service occupancy, a grantor with no power to grant.'],
    ['Shams', 'Clauses the parties never meant to operate are ignored (Antoniades v Villiers; AG Securities v Vaughan).'],
    ['Formalities', 's 53(1) CLPA: a lease of 7 years or less at a rack rent needs no deed. s 87 LTA: a lease over 7 years must be registered. s 6(d) Civil Law Act: a contract for a lease needs signed writing. A defective lease may still be an equitable lease (Walsh v Lonsdale).'],
    ['Privity', 'Original parties stay bound (City of London v Fell). s 10 and s 11 CLPA pass the benefit and burden of covenants with the reversion. Spencer\'s Case: covenants that touch and concern the land bind the current tenant.'],
    ['Implied covenants', 'Quiet enjoyment and non-derogation from grant. Test: substantial interference with enjoyment, judged by what both sides contemplated at the grant.'],
    ['Landlord\'s remedies', 'Sue for rent. Distress (writ without notice, up to 12 months\' rent). Forfeiture: needs a right to forfeit and the right procedure; waiver by taking rent with knowledge defeats it. s 18 CLPA (non-rent breaches: notice, reasonable time, tenant may seek relief). s 18A CLPA (rent: tenant may pay arrears and costs into court; possession order after at least 4 weeks).'],
    ['Fixed-term lease', 'Ends at the end of the term. A notice to quit works for a periodic tenancy and gives no right to end a fixed term early unless the lease has a break clause.'],
    ['Tenant\'s self-help', 'Equitable set-off against rent if the cross-claim is closely connected to the rent claim, unless the lease bars set-off (OUE v Three Sixty).']
  ],
  method: { t: 'Forfeiture in three steps', steps: [
    'Right to forfeit: an express re-entry clause, or s 93 LTA (implied in registered leases).',
    'Procedure: s 18 CLPA notice for non-rent breaches (state breach, ask for remedy and compensation, reasonable time). s 18A CLPA for rent arrears (tenant can pay arrears and costs).',
    'Waiver: has the landlord accepted rent knowing of the breach? Then the right to forfeit for that breach is lost.'
  ] },
  cases: [
    ['Street v Mountford [1985] HL', 'Two furnished rooms at £37 a week under an agreement headed "licence".', 'A tenancy: exclusive possession for a term at a rent. "A fork is a fork."', 'The central test; endorsed in Singapore (Goh Cin Chye).'],
    ['Goh Cin Chye v Peck Teck Kian Realty', 'Singapore application of Street v Mountford.', 'Endorsed Street v Mountford. [check facts]', 'Local authority.'],
    ['Errington v Errington [1952]', 'A father let his son and daughter-in-law live in a house and pay the mortgage.', 'Family arrangement: contractual licence, not a tenancy.', 'Exception: family arrangement.'],
    ['Antoniades v Villiers; AG Securities v Vaughan [1990] HL', 'Couples signed agreements letting the landlord put others in; separate occupiers signed separate agreements.', 'Sham clause ignored in Antoniades (tenancy). In Vaughan, separate agreements at different times gave no joint tenancy and no exclusive possession.', 'Shams; absence of the four unities.'],
    ['Aslan v Murphy [1990]', 'An occupier of a small room; the owner kept keys and could enter.', 'Retained keys alone do not defeat exclusive possession; ask why they were kept. [check]', 'Retained keys.'],
    ['Abbeyfield v Woods [1968]; Marchant v Charters [1977]', 'Residents received meals and cleaning; owner had unrestricted access.', 'Licence: services needing access negate exclusive possession.', 'Lodgers and attendance.'],
    ['Lace v Chantler [1944]', 'A lease "for the duration of the war".', 'Void for uncertainty.', 'Certainty of term.'],
    ['Prudential Assurance v London Residuary [1992]', 'A lease until the land was needed for road widening.', 'Void for uncertainty, though a yearly tenancy arose from paid rent.', 'Certainty and break clauses.'],
    ['City of London Corporation v Fell [1994] HL', 'An original tenant sued after assignment.', 'The original tenant stays liable for the contractual term.', 'Privity of contract.'],
    ['Spencer\'s Case (1583)', 'A covenant to build a wall; an assignee.', 'Covenants that touch and concern the land bind an assignee in privity of estate.', 'Privity of estate.'],
    ['Milmo v Carreras [1946]', 'A "sublease" for the full remaining term.', 'A sublease cannot exceed the sublessor\'s remaining term; if it does, it is an assignment.', 'Sublease v assignment.'],
    ['Cold Storage v MCST Chancery Court', 'The management corporation added paid parking.', 'No derogation: it merely made the tenant\'s business costlier.', 'Limits of non-derogation.'],
    ['OUE v Three Sixty Degree [2013] 3 SLR 1', 'Level 39 of Mandarin Orchard leased for a bar. A fire-safety limit of 120 people stopped the licence. Tenant withheld rent, claimed set-off, and was re-entered.', 'Leases are read like commercial contracts. The no-set-off clause worked. No breach of quiet enjoyment or derogation: the landlord does not underwrite profitability; caveat lessee.', 'Express risk allocation; quiet enjoyment principles.'],
    ['Expert Clothing v Hillgate House [1986] CA', 'Forfeiture after a covenant breach.', 'Used in Singapore for waiver of the right to forfeit. [check holding]', 'Accepting rent with knowledge of the breach.'],
    ['Winter Garden Theatre v Millennium [1948] HL; Hurst v Picture Theatres', 'Contractual licences ended early.', 'Contractual licences are not revocable at will; court may enforce by injunction.', 'Revoking a contractual licence.'],
    ['Co-operative Insurance v Argyll Stores [1998] HL', 'A landlord sought a "keep open" order.', 'The court will not order a tenant to keep trading.', 'Limits of specific performance.']
  ],
  secs: [
    ['s 53(1) CLPA', 'Deed needed; lease of 7 years or less at a rack rent exempt', 'Whether the lease is legal without a deed.'],
    ['s 6(d) Civil Law Act', 'Land contracts (including agreements for leases) need signed writing (slide cites 6A(d))', 'Agreements for a lease.'],
    ['s 87 LTA', 'A lease over 7 years must be registered', 'Long leases.'],
    ['s 93 LTA', 'Implied right of re-entry in registered leases', 'Forfeiture of registered leases.'],
    ['s 10, s 11 CLPA', 'Benefit and burden of lease covenants run with the reversion', 'Change of landlord.'],
    ['s 18, s 18A CLPA', 'Forfeiture: non-rent breaches (notice, relief); rent arrears (pay arrears and costs)', 'Every forfeiture question.'],
    ['Distress Act ss 5, 7, 8, 9, 10, 12, 16', 'Writ without notice, seizure, exempt goods, sub-tenants, reputed ownership', 'Seizing goods for unpaid rent.']
  ],
  nums: [
    ['Lease needing registration', 'Over 7 years'],
    ['Deed not needed', 'Lease of 7 years or less at a rack rent'],
    ['Distress', 'Up to 12 months\' rent'],
    ['s 18A rent possession', 'At least 4 weeks']
  ],
  traps: [
    'Lease v licence: write the three elements, then name the fact that decides exclusive possession. Services, retained keys and sham clauses are the usual traps.',
    'Whenever you discuss privity of estate, add privity of contract (City of London v Fell).',
    'Forfeiture: right to forfeit, then procedure (s 18 / s 18A), then waiver.',
    'A fixed term ends with the term. A notice to quit works for a periodic tenancy.',
    'Mortgage link (Lot 5): a lease made after the mortgage binds the bank only through s 23 CLPA, the deed, or consent.'
  ],
  qs: [
    { id: 'c6-01', t: 'mcq', topic: 'Lease v licence', src: 'Prof-style (new)',
      q: 'Mrs Mok lets a furnished room to Amir for $900 a month for one year. The agreement is headed "Licence Agreement" and says Amir is "a licensee only". Amir has the only key to the room and Mrs Mok never enters. In this case:',
      o: ['Amir is a licensee, because the agreement expressly says he is a licensee only.',
        'Amir is likely a tenant: he has exclusive possession for a term at a rent.',
        'Amir is a tenant at will, whom Mrs Mok may evict whenever she chooses.',
        'Amir is a trespasser, because a licence cannot be granted for a whole year.'],
      a: 1, why: 'Substance over label: exclusive possession + term + rent = tenancy.', trap: 'label' },
    { id: 'c6-02', t: 'mcq', topic: 'Lease v licence', src: 'Past-year paper (CS1 style)',
      q: 'Gabby lets 3 rooms of No. 13 for 24 months at $1,800 a month to three nursing students under one agreement. She keeps a 4th bedroom locked with her belongings, and her helper cleans the house once a week. In this case:',
      o: ['They are licensees, because Gabby keeps one bedroom locked with her belongings inside.',
        'Likely a lease: the locked room is outside the grant; weekly cleaning is not attendance.',
        'They are lodgers, because Gabby\'s helper comes in to clean the premises every week.',
        'They are trespassers, because only Gabby\'s name appears on the Certificate of Title to No. 13.'],
      a: 1, why: 'Reserving one room does not negate exclusive possession of the rest. Real attendance and unrestricted access (Abbeyfield; Marchant) would; weekly cleaning alone is weak. One agreement with joint payment suggests a joint tenancy of the three rooms.', trap: 'services' },
    { id: 'c6-03', t: 'mcq', topic: 'Fixed term', src: 'Past-year paper (CS1 style)',
      q: 'In month 18 of the students\' 24-month lease, Gabby gives them one month\'s notice to vacate because she has found tenants who will pay more. There is no break clause. In this case:',
      o: ['The notice is valid, because one month\'s notice is a reasonable period.',
        'It is ineffective: a fixed term ends at its end unless there is a break clause.',
        'The notice is valid, because the students have repeatedly paid their rent late.',
        'The notice converts the students\' lease into a licence that Gabby may revoke.'],
      a: 1, why: 'Notice to quit ends periodic tenancies, not fixed terms. The students may stay to month 24 unless Gabby validly forfeits.', trap: 'fixed-term' },
    { id: 'c6-04', t: 'mcq', topic: 'Shams', src: 'Prof-style (new)',
      q: 'Su Ling signs separate agreements on different dates with Tom, Uma and Vik for three bedrooms, each headed "licence". A clause lets Su Ling move any occupier to another room. She has never done so. Tom pays rent for his own bedroom and can keep others out. In this case:',
      o: ['Tom is a licensee, because the clause lets Su Ling move him to another room.',
        'The moving clause is likely a sham, so Tom is a tenant of his own room.',
        'Tom, Uma and Vik are joint tenants of the whole flat under one tenancy.',
        'Tom is a lodger, because he shares the kitchen and bathroom with the others.'],
      a: 1, why: 'Clauses never meant to operate are ignored (Antoniades). Separate agreements at different times give no joint tenancy (AG Securities), but each can be a tenant of his own room.', trap: 'sham' },
    { id: 'c6-05', t: 'set', topic: 'Formalities', src: 'Prof-style (new)',
      q: 'The following statement/s is/are true about lease formalities:',
      s: [
        ['A lease of 7 years or less at a rack rent can be legal without a deed.', true, 's 53(1) CLPA exception.'],
        ['A lease of more than 7 years over registered land must be registered.', true, 's 87 LTA.'],
        ['A 9-year lease made by signed writing but not by deed is void for all purposes.', false, 'It may be an equitable lease under Walsh v Lonsdale.', 'walsh'],
        ['A lease must be in writing whatever its length.', false, 'Short leases at a rack rent need no deed; a contract for a lease needs signed writing to be enforced (s 6(d) CLA).']
      ], opts: [[0], [0, 1], [1, 2], [0, 1, 3]] },
    { id: 'c6-06', t: 'mcq', topic: 'Certainty of term', src: 'Prof-style (new)',
      q: 'A council lets a strip of land "until the land is required for road widening", at a yearly rent. In this case:',
      o: ['There is a valid lease that lasts until the day the land is needed for the road.',
        'Void for uncertainty of term, though a yearly tenancy may arise from rent paid.',
        'There is a lease for 99 years, the usual term for a State lease in Singapore.',
        'There is an easement over the strip, because the council kept the freehold.'],
      a: 1, why: 'A lease needs a term certain from the start (Lace v Chantler; Prudential).', trap: 'certain-term' },
    { id: 'c6-07', t: 'set', topic: 'Privity', src: 'Prof-style (new)',
      q: 'Lin leases a shop to Tan for 10 years. Tan assigns the lease to Wong with Lin\'s consent. Wong stops paying rent. The following statement/s is/are true:',
      s: [
        ['Lin can sue Wong on the rent covenant because Lin and Wong are in privity of estate and rent touches and concerns the land.', true, 'Spencer\'s Case.', 'privity-both'],
        ['Lin can also sue Tan on the rent covenant because privity of contract lasts for the contractual term.', true, 'City of London v Fell.', 'privity-both'],
        ['Once Tan assigned the lease, Tan was automatically released from all covenants.', false, 'Not without a release; the original tenant stays liable in contract.', 'privity-both'],
        ['If Tan had granted Wong a 10-year "sublease" covering the whole remaining term, it would take effect as an assignment.', true, 'Milmo v Carreras.']
      ], opts: [[0, 1], [0, 1, 3], [2, 3], [0, 1, 2, 3]] },
    { id: 'c6-08', t: 'mcq', topic: 'Forfeiture', src: 'Prof-style (new)',
      q: 'Joe\'s 3-year lease has a re-entry clause. He sublets a room without the consent the lease requires. A week after finding out, Mr Pan (the landlord) accepts Joe\'s rent for the next month, then serves notice to forfeit for the subletting. In this case:',
      o: ['Mr Pan can forfeit, because subletting without consent is a serious breach.',
        'Mr Pan has probably waived that breach by accepting rent knowing of it.',
        'Mr Pan can forfeit without any notice, because rent is involved here.',
        'The lease ended automatically on the breach, without any act by Mr Pan.'],
      a: 1, why: 'Waiver: accepting rent knowing of the breach shows an election to continue the lease (Expert Clothing [check]). A continuing breach may give a fresh right later.', trap: 'waiver' },
    { id: 'c6-09', t: 'mcq', topic: 'Forfeiture', src: 'Prof-style (new)',
      q: 'A tenant under a lease with a re-entry clause is two months behind with rent. The landlord sues for possession. Under s 18A CLPA, the tenant can most likely:',
      o: ['Do nothing, because the lease has already ended by forfeiture.',
        'Pay the arrears and costs into court and keep the lease.',

      a: 1, why: 's 18A deals with rent: payment of arrears and costs stops the forfeiture. s 18 notices are for non-rent breaches.', trap: 'forfeit-steps' },
    { id: 'c6-10', t: 'mcq', topic: 'Forfeiture', src: 'Past-year paper (CS1 style)',

      o: ['Change the locks straight away while the students are out at the Polytechnic.',
        'Check for a re-entry clause, then serve a s 18 CLPA notice asking for a remedy.',

        'Apply to the Registrar of Titles to cancel the students\' lease from the register.'],
      a: 1, why: 'A short unregistered lease has no s 93 LTA implied re-entry, so she needs an express clause. Non-rent breach = s 18 notice. The breach is capable of remedy (stop the lessons).', trap: 'forfeit-steps' },
    { id: 'c6-11', t: 'mcq', topic: 'Quiet enjoyment', src: 'Prof-style (new)',

      o: ['The tenant was entitled to withhold all rent until the hoardings came down again.',

    'Joint tenants each own the whole. When one dies, the share vanishes and the survivor takes everything. A Will cannot touch it. Students forget this every year.',

  qs: [
    { id: 'c7-01', t: 'mcq', topic: 'Resulting trust', src: 'Practice paper Q1',
      q: 'The following statement is true about a resulting trust:',

      a: 3, why: 'A resulting trust arises by operation of law, so A is wrong. The legal burden lies on the person asserting the trust: the payer must establish it (Lau Siew Kim), so D is right and C reverses the burden. B is loosely descriptive (the benefit results back to the payer), but no settlor creates a resulting trust, so it is not the "most suitable" statement of the rule.', trap: 'rt-burden' },
    { id: 'c7-02', t: 'mcq', topic: 'Survivorship', src: 'Past-year paper (CS2 style)',
      q: 'Zen and Belle are registered as co-proprietors of a penthouse with no words of severance. Zen\'s Will, made earlier, leaves "all my assets and property" to his two children. Zen dies. Nothing was done to sever. Assuming Zen and Belle are also joint tenants in equity, in this case:',

    { id: 'c7-03', t: 'mcq', topic: 'Statutory severance', src: 'Prof-style (new)',

/* Lot 9 — Sale stage 2: registration, Torrens indefeasibility, caveats, stamp duty [L10] */
LL.chapter({
  n: 9, code: 'LOT 9', lec: 'L10', title: 'Torrens Title, Caveats and Stamp Duty', short: 'Torrens',
  place: 'Newton · the Land Registry', spot: 'Where titles are entered and caveats lodged', icon: 'stamp', sky: 909,
  mentor: ['registrar'], mentorName: 'Mr Lim, Registry officer',
  story: [
    'In Singapore the register is king. Registration is the source of title. Once you are registered, your title is indefeasible, with set exceptions.',
    'We follow immediate indefeasibility: Frazer v Walker. An innocent purchaser who registers takes a good title even under a forged document.',
    'The main exception is fraud or forgery by the registered proprietor or his agent. Fraud means actual dishonesty. Wilful blindness counts. Carelessness and mere notice do not.',
    'Unregistered interests need a caveat. And for removal, always open by saying whether you use s 127(1) or s 127(2), and why.'
  ],
  win: 'Registered. You judged each proprietor separately and named the safety nets. Last lot: Toa Payoh, and an agent with a secret.',
  idea: 'The register is king. A registered purchaser wins unless the proprietor (or his agent) was party to fraud. A caveat protects an unregistered interest.',
  plain: [
    'After the contract, the buyer holds only an equitable interest. The buyer becomes legal owner when the transfer is registered: registration is the source of title in Singapore\'s Torrens system (Land Titles Act).',
    'Stamp duty is a tax on documents. Buyers also pay ABSD (Additional Buyer\'s Stamp Duty), which depends on citizenship and how many properties they own. Sellers may pay SSD on quick resales.',
    'Indefeasibility: a registered owner\'s title cannot be undone except in set exceptions. Singapore follows immediate indefeasibility (Frazer v Walker). The main exception is fraud or forgery to which the proprietor or his agent was a party; fraud means actual dishonesty (UOB v Bebe), and deliberately shutting your eyes counts.',
    'An owner who loses to an innocent registered buyer may claim from the Assurance Fund where the Registrar\'s staff erred, and can sue the fraudster.',
    'A caveat is a notice on the register warning of an unregistered interest. It freezes conflicting dealings. The registered proprietor can apply to remove it (s 127).',
    'Two registration systems (L10): the Registration of Deeds Act (common-law titles, where registration of deeds gives priority, not title) and the Land Titles Act (Torrens). [check slide detail]'

    ['ABSD', 'MCQ on mixed-residency buyers (practice MCQ 4).', 'Medium (MCQ)'],

    { id: 'c9-02', t: 'mcq', topic: 'ABSD', src: 'Practice paper Q4',

    { id: 'c9-03', t: 'mcq', topic: 'ABSD', src: 'Prof-style (new)',

    { id: 'c9-04', t: 'mcq', topic: 'Immediate indefeasibility', src: 'Prof-style (new)',
