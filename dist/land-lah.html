<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Land Lah!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A pixel-art study system for RE2702 Land Law: lessons, graded tests, ILAC case studies, full mock papers and cheat sheets built from your mistakes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Land Lah! — arcade-poster styling on a survey-plan blueprint.
   Layout: one arcade "screen" column centred over a full-bleed red CRT grid, poster-style header strip on top.
   Deliberately single-theme (a blueprint arcade cabinet), so colours are set explicitly for every surface. */
:root {
  /* Layout: one arcade "screen" column over a full-bleed blueprint grid (a survey plan), poster strip on top. */
  --ink: #041521;
  --maroon: #072a3f;
  --red: #0e4a6b;
  --ember: #1b6f99;
  --coral: #ff7a59;
  --orange: #ffb238;
  --peach: #9fdcf0;
  --cream: #fff4d6;
  --paper: #f4f9fb;
  --paper-2: #e3eff4;
  --star: #ffd23f;
  --violet: #2b3f9e;
  --violet-2: #5b74e0;
  --text: #e9f6fb;
  --text-dim: #a9cfdf;
  --ok: #2f9e5e;
  --ok-bg: #dcf6e5;
  --bad: #d93a4a;
  --bad-bg: #fde0e2;
  --part: #e0a21a;
  --ink-red: #b3261e;
  --panel: rgba(4, 21, 33, 0.82);
  --panel-2: rgba(10, 52, 78, 0.88);
  --line: rgba(140, 215, 240, 0.3);

  --f-display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --f-label: 'Silkscreen', 'Press Start 2P', ui-monospace, monospace;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num: 'VT323', ui-monospace, 'Courier New', monospace;

  --px: 4px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--star); outline-offset: 3px; }
[hidden] { display: none !important; }

/* ---------- CRT background (poster world) ---------- */
.crt-bg {
  position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 45% at 50% 42%, #3ba7d4 0%, #2381b0 18%, #145f8a 40%, #0b3a5b 66%, #072a3f 88%, #041521 100%);
}
.grid-floor {
  position: absolute; left: -30%; right: -30%; bottom: -10%; height: 60%;
  background-image:
    repeating-linear-gradient(0deg, rgba(110, 200, 235, 0.28) 0 2px, transparent 2px 46px),
    repeating-linear-gradient(90deg, rgba(110, 200, 235, 0.28) 0 2px, transparent 2px 46px);
  transform: perspective(420px) rotateX(58deg);
  transform-origin: bottom center;
  mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
}
.crt-bg::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(0deg, rgba(110, 200, 235, 0.10) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(90deg, rgba(110, 200, 235, 0.10) 0 1px, transparent 1px 64px);
}
.porthole {
  position: absolute; left: 50%; top: 42%; width: min(150vmin, 1400px); aspect-ratio: 1; max-width: none;
  transform: translate(-50%, -50%); border-radius: 50%;
  box-shadow: inset 0 0 0 2px rgba(140, 215, 240, 0.18), inset 0 0 120px 40px rgba(4, 21, 33, 0.55);
}
.deco { position: absolute; opacity: 0.55; filter: blur(2.5px) saturate(1.1); }
.deco-bolt { left: -14px; top: 90px; transform: rotate(-14deg); }
.deco-smile { right: -30px; top: 40px; transform: rotate(12deg); opacity: 0.45; }
.deco-glass { right: -10px; bottom: 30px; transform: rotate(-10deg); }
.deco-star { left: 10px; bottom: 20px; transform: rotate(18deg); opacity: 0.4; }
.scanlines {
  position: fixed; inset: 0; z-index: 50; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.10) 0 1px, transparent 1px 3px);
}

/* ---------- app frame ---------- */
.app {
  position: relative; z-index: 1;
  max-width: 1060px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  min-height: 100vh;
  display: flex; flex-direction: column; gap: 18px;
}
.topbar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 4px;
}
.badges { display: flex; gap: 8px; }
.badges canvas {
  width: 44px; height: 44px; padding: 5px; border-radius: 50%;
  background: radial-gradient(circle, #fff6ec 0 55%, #a9cfdf 56% 100%);
  box-shadow: 0 0 0 3px var(--violet), 0 0 0 5px rgba(255,255,255,0.35);
  object-fit: contain;
}
.topbar-text {
  display: flex; flex-direction: column; padding-left: 14px; border-left: 3px solid rgba(255, 240, 220, 0.85);
  font-family: var(--f-num); font-size: 19px; line-height: 1.05; letter-spacing: 0.02em; color: #e3f5fb;
  text-shadow: 0 0 6px rgba(160, 225, 245, 0.4); min-width: 0; flex: 1 1 240px;
}
.topbar-text span:nth-child(3) { color: var(--peach); }
.topbar-tools { display: flex; gap: 8px; margin-left: auto; }
.chip {
  font-family: var(--f-label); font-size: 12px; letter-spacing: 0.06em;
  background: var(--panel); color: var(--cream); border: 0; padding: 8px 12px; cursor: pointer;
  box-shadow: 0 0 0 2px var(--peach);
}
.chip:hover { background: var(--red); }
.screen { flex: 1; outline: none; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.foot { font-size: 13px; color: var(--text-dim); text-align: center; opacity: 0.85; }

/* ---------- type ---------- */
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.section-title {
  font-family: var(--f-display); font-size: clamp(18px, 3.6vw, 28px); line-height: 1.35;
  color: var(--cream);
  text-shadow: 3px 3px 0 var(--red), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 0 16px rgba(255, 220, 160, 0.55);
  outline: none;
}
.lede { color: var(--text-dim); max-width: 68ch; }
.lede.small { font-size: 14px; }
.sub { font-family: var(--f-label); font-size: 16px; letter-spacing: 0.06em; color: var(--cream); }
.stn-code {
  display: inline-block; white-space: nowrap; font-family: var(--f-num); font-size: 20px; line-height: 1; padding: 3px 7px 2px;
  background: var(--orange); color: var(--ink); border-radius: 6px; font-weight: 700; letter-spacing: 0.02em;
  box-shadow: 0 0 0 2px var(--ink);
}

/* ---------- pixel panels ---------- */
.panel, .player-card, .dialogue, .q-card, .prof, .card-big, .lib-sec, .set-row, .attack, .summary, .lt-ready, .empty, .overlay-card, .chapter-name {
  --edge: var(--ink);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--edge), 0 var(--px) 0 0 var(--edge),
    calc(-1 * var(--px)) 0 0 0 var(--edge), var(--px) 0 0 0 var(--edge),
    0 calc(2 * var(--px)) 0 0 rgba(0, 0, 0, 0.35);
}

/* ---------- buttons ---------- */
.btn {
  --b1: #fff0c2; --b2: #ffb057; --b3: #f2694e;
  font-family: var(--f-display); font-size: 11px; line-height: 1.4; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink); cursor: pointer; border: 0; padding: 12px 16px;
  background: linear-gradient(180deg, var(--b1) 0 34%, var(--b2) 34% 68%, var(--b3) 68% 100%);
  box-shadow:
    0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink),
    inset 0 -4px 0 0 rgba(150, 90, 10, 0.45), 0 7px 0 0 rgba(0, 0, 0, 0.3);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  transition: transform 0.06s ease;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(3px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.6); }
.btn canvas { width: auto; height: 18px; }
.btn-hot { --b1: #fff7c9; --b2: #ffe066; --b3: #ffbf1f; }
.btn-ghost { --b1: rgba(255,255,255,0.06); --b2: rgba(255,255,255,0.03); --b3: rgba(0,0,0,0.08); color: var(--cream); box-shadow: 0 0 0 2px var(--peach), 0 4px 0 0 rgba(0,0,0,0.3); }
.btn-danger { --b1: #ffb3a8; --b2: #ff6b5a; --b3: #b3261e; }
.btn-small { font-size: 10px; padding: 9px 12px; }
.btn-big { font-size: clamp(14px, 2.4vw, 18px); padding: 18px 26px; }
.blink { animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { 50% { filter: brightness(1.25); box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), 0 0 26px 6px rgba(255, 220, 120, 0.7); } }
.title-actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: center; padding-block: 6px; }

/* ---------- title screen ---------- */
.title-screen { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-top: 8px; }
.title-stage { position: relative; width: 100%; max-width: 900px; padding-block: 70px 60px; display: grid; place-items: center; }
.clouds { position: absolute; left: 0; width: 100%; pointer-events: none; }
.clouds-back { top: 0; height: 62%; opacity: 0.95; }
.clouds-front { bottom: -10px; height: 42%; transform: scaleX(-1); }
.title-brain { position: absolute; left: 4%; top: 34%; width: clamp(70px, 14vw, 120px); height: auto; z-index: 2; filter: drop-shadow(0 0 10px rgba(255, 236, 170, 0.7)); }
.title-bulb { position: absolute; right: 5%; top: 18%; width: clamp(50px, 9vw, 80px); height: auto; z-index: 2; filter: drop-shadow(0 0 16px rgba(255, 240, 160, 0.9)); }
.title-bolt { position: absolute; right: 18%; top: 30%; width: clamp(28px, 5vw, 44px); height: auto; z-index: 3; transform: rotate(20deg); }
.title-cursor { position: absolute; right: 13%; bottom: 22%; width: clamp(26px, 4vw, 38px); height: auto; z-index: 4; }
.pixel-title {
  position: relative; z-index: 3; isolation: isolate;
  font-family: var(--f-display); font-weight: 400; line-height: 1.04; letter-spacing: 0.02em;
  font-size: clamp(40px, 10.6vw, 108px);
  display: flex; flex-direction: column; align-items: center;
}
.pixel-title span {
  position: relative; display: block; color: transparent;
  background: linear-gradient(180deg, #fffbe0 0 22%, #ffe98a 22% 40%, #ffd23f 40% 52%, #ffb238 52% 74%, #f08c1a 74% 100%);
  -webkit-background-clip: text; background-clip: text;
}
.pixel-title span::before {
  content: attr(data-text); position: absolute; inset: 0; z-index: -1; color: #0b3550;
  text-shadow:
    -0.05em 0 0 #0b3550, 0.05em 0 0 #0b3550, 0 -0.05em 0 #0b3550, 0 0.05em 0 #0b3550,
    -0.05em -0.05em 0 #0b3550, 0.05em 0.05em 0 #0b3550, -0.05em 0.05em 0 #0b3550, 0.05em -0.05em 0 #0b3550,
    0.075em 0.095em 0 #041521,
    -0.095em 0 0 #fff, 0.095em 0 0 #fff, 0 -0.095em 0 #fff, 0 0.11em 0 #fff, -0.085em -0.085em 0 #fff, 0.085em 0.085em 0 #fff, -0.085em 0.085em 0 #fff, 0.085em -0.085em 0 #fff,
    0 0 0.26em rgba(255, 255, 255, 0.9), 0 0 0.55em rgba(255, 210, 160, 0.7);
}
.pixel-title span + span { margin-top: 0.08em; }
.title-stars .stars canvas { width: clamp(40px, 7vw, 60px); height: auto; }
.title-stars .stars { gap: 10px; }
.title-stars .stars canvas:nth-child(2) { transform: translateY(-10px) scale(1.15); }
.tagline {
  font-family: var(--f-label); font-size: clamp(13px, 2.4vw, 22px); line-height: 1.5; letter-spacing: 0.08em; text-transform: uppercase;
  color: #e9f7fc; max-width: 34ch; text-shadow: 0 0 2px #fff, 0 0 12px rgba(255, 255, 255, 0.6), 2px 2px 0 var(--red);
}
.dateline { font-family: var(--f-label); font-size: clamp(12px, 1.9vw, 17px); letter-spacing: 0.1em; text-transform: uppercase; color: var(--peach); text-shadow: 0 0 10px rgba(180, 232, 248, 0.6); }
.countdown span { display: inline-block; font-family: var(--f-num); font-size: 26px; letter-spacing: 0.04em; color: var(--ink); background: var(--star); padding: 2px 12px; box-shadow: 0 0 0 3px var(--ink); text-transform: uppercase; }
.title-how { max-width: 56ch; color: var(--text-dim); font-size: 15px; }

/* ---------- stars ---------- */
.stars { display: inline-flex; gap: 4px; align-items: center; vertical-align: middle; }

/* ---------- character select ---------- */
.pick { display: flex; flex-direction: column; gap: 14px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 20px; padding: 6px; }
.pick-card {
  background: var(--panel); padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--peach);
}
.pick-card.current { box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--star), 0 0 30px rgba(255, 210, 63, 0.4); }
.pick-portrait { align-self: flex-start; background: linear-gradient(180deg, #ffbf8a, #f2694e); padding: 8px; box-shadow: 0 0 0 3px var(--ink); }
.pick-card h3 { font-family: var(--f-display); font-size: 14px; color: var(--cream); }
.from { font-family: var(--f-label); font-size: 13px; color: var(--peach); letter-spacing: 0.06em; text-transform: uppercase; }
.blurb { font-size: 15px; }
.quote { font-style: italic; color: var(--star); font-size: 15px; }
.perk { font-size: 14px; color: var(--text-dim); flex: 1; }
.perk b { color: var(--cream); }

/* ---------- map ---------- */
.map { display: flex; flex-direction: column; gap: 16px; }
.player-card { background: var(--panel); padding: 14px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.player-card .portrait { background: linear-gradient(180deg, #ffbf8a, #f2694e); padding: 6px; box-shadow: 0 0 0 3px var(--ink); }
.pc-text { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pc-text h2 { font-family: var(--f-display); font-size: 16px; color: var(--cream); }
.pc-rank { font-family: var(--f-label); color: var(--star); letter-spacing: 0.08em; text-transform: uppercase; font-size: 14px; }
.pc-stats { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 4px 0 0; }
.pc-stats dt { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.pc-stats dd { margin: 0; font-family: var(--f-num); font-size: 24px; line-height: 1; color: var(--cream); font-variant-numeric: tabular-nums; }
.pc-count { font-family: var(--f-num); font-size: 22px; color: var(--ink); background: var(--star); padding: 2px 10px; box-shadow: 0 0 0 3px var(--ink); text-transform: uppercase; }
.map-tools { display: flex; flex-wrap: wrap; gap: 14px; padding: 4px; }
.line { list-style: none; margin: 0; padding: 0 0 0 4px; position: relative; display: flex; flex-direction: column; gap: 10px; }
.line::before { content: ""; position: absolute; left: 25px; top: 16px; bottom: 16px; width: 10px; background: var(--orange); box-shadow: 0 0 0 3px var(--ink); }
.station { position: relative; }
.stn {
  width: 100%; display: grid; grid-template-columns: 44px 74px 40px 1fr auto; align-items: center; gap: 12px;
  background: var(--panel); border: 0; padding: 10px 14px 10px 8px; cursor: pointer; text-align: left;
  box-shadow: 0 0 0 2px rgba(140, 215, 240, 0.25);
}
.stn:hover { background: var(--panel-2); box-shadow: 0 0 0 2px var(--peach); }
.station .stn-code { justify-self: start; }
.stn-dot { width: 26px; height: 26px; margin-left: 9px; border-radius: 50%; background: var(--paper); box-shadow: 0 0 0 4px var(--ink); position: relative; z-index: 1; }
.station.passed .stn-dot { background: var(--star); }
.station.locked .stn { opacity: 0.55; filter: saturate(0.4); }
.station.locked .stn-code { background: #b9b3ad; }
.stn-icon canvas { display: block; }
.stn-text { display: flex; flex-direction: column; min-width: 0; }
.stn-place { font-family: var(--f-display); font-size: 12px; color: var(--cream); line-height: 1.5; overflow-wrap: anywhere; }
.stn-title { font-size: 15px; color: var(--text); }
.stn-lec { font-family: var(--f-label); font-size: 11px; color: var(--peach); letter-spacing: 0.06em; text-transform: uppercase; }
.stn-grade { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.stn-grade b { font-family: var(--f-display); font-size: 16px; color: var(--star); }
.stn-new { font-family: var(--f-label); font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
.terminal .stn-dot { width: 30px; height: 30px; margin-left: 7px; box-shadow: 0 0 0 4px var(--ink), 0 0 0 8px var(--paper), 0 0 0 11px var(--ink); }
.terminal .stn-code { background: var(--star); }

/* ---------- chapter hub ---------- */
.hub, .final-hub { display: flex; flex-direction: column; gap: 18px; }
.hub-banner {
  position: relative; height: 190px; overflow: hidden;
  background: linear-gradient(180deg, #7fd3ef 0%, #3ba7d4 40%, #1b6f99 75%, #0b3a5b 100%);
  box-shadow: 0 0 0 4px var(--ink), 0 8px 0 0 rgba(0,0,0,0.35);
}
.skyline { position: absolute; left: 0; bottom: 0; width: 100%; height: 62%; }
.clouds-hub { top: 6px; height: 54%; opacity: 0.85; }
.hub-landmark { position: absolute; right: 18px; bottom: 14px; filter: drop-shadow(4px 4px 0 rgba(4, 21, 33, 0.8)); }
.hub-landmark canvas { display: block; width: clamp(64px, 14vw, 96px); height: auto; }
.hub-title { position: absolute; left: 16px; top: 14px; right: 140px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.hub-title h2 { font-family: var(--f-display); font-size: clamp(16px, 3.4vw, 26px); line-height: 1.3; color: #fff; text-shadow: 3px 3px 0 var(--red), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink); outline: none; }
.hub-title p { font-family: var(--f-label); font-size: 13px; color: #eaf7fc; background: rgba(4, 21, 33,0.6); padding: 2px 8px; letter-spacing: 0.05em; }
.chapter-name { background: var(--panel); padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.chapter-name span { font-family: var(--f-label); font-size: 12px; color: var(--peach); letter-spacing: 0.08em; text-transform: uppercase; }
.chapter-name h3 { font-family: var(--f-display); font-size: clamp(13px, 2.4vw, 17px); line-height: 1.5; color: var(--cream); }
.dialogue { background: var(--paper); color: var(--ink); padding: 16px; display: flex; gap: 16px; align-items: flex-start; }
.mentors { display: flex; gap: 6px; flex-shrink: 0; }
.mentors .portrait { background: linear-gradient(180deg, #ffe08a, #ffb057); padding: 6px; box-shadow: 0 0 0 3px var(--ink); }
.speech { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.speaker { font-family: var(--f-display); font-size: 11px; color: var(--red); letter-spacing: 0.04em; }
.speech-text { font-size: 18px; line-height: 1.5; min-height: 3em; cursor: pointer; }
.speech-nav { display: flex; gap: 12px; flex-wrap: wrap; }
.dialogue .btn-ghost { color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.activities { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.activities.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.activities.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.act {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  padding: 18px 10px 16px; cursor: pointer; border: 0; color: var(--cream);
  background: linear-gradient(180deg, #125a82 0%, #0b3550 100%);
  box-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), inset 0 0 0 2px rgba(140, 215, 240, 0.35), 0 9px 0 0 rgba(0,0,0,0.35);
  transition: transform 0.06s ease;
}
.act:hover { background: linear-gradient(180deg, #1a6f99 0%, #0e4a6b 100%); }
.act:active { transform: translateY(3px); }
.act canvas { height: 44px; width: auto; }
.act-num { position: absolute; top: 6px; left: 8px; font-family: var(--f-num); font-size: 22px; color: var(--star); }
.act-label { font-family: var(--f-display); font-size: 11px; line-height: 1.5; text-transform: uppercase; }
.act-sub { font-size: 13px; color: var(--text-dim); }
.hub-best { text-align: center; color: var(--text-dim); }
.hub-best b { font-family: var(--f-display); color: var(--star); }
.hub-foot { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 4px; }

/* ---------- lesson ---------- */
.lesson { display: flex; flex-direction: column; gap: 16px; }
.lesson-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.lesson-head h2 { font-family: var(--f-display); font-size: clamp(13px, 2.4vw, 17px); color: var(--cream); line-height: 1.5; outline: none; }
.lesson-head p { width: 100%; color: var(--text-dim); font-size: 14px; }
.card-big { background: var(--paper); color: var(--ink); padding: 22px clamp(16px, 4vw, 34px); min-height: 280px; }
.card-big h3 { font-family: var(--f-display); font-size: clamp(14px, 2.6vw, 19px); line-height: 1.45; color: var(--red); margin-bottom: 14px; }
.card-body p, .lib-card p, .why p { margin: 0 0 8px; max-width: 70ch; }
.card-body ul, .lib-card ul, .why ul { margin: 0 0 8px; padding-left: 1.2em; }
.card-body li, .lib-card li { margin-bottom: 4px; }
.gap { display: block; height: 6px; }
.dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.dot { width: 12px; height: 12px; background: rgba(255,255,255,0.18); box-shadow: 0 0 0 2px var(--ink); }
.dot.read { background: var(--peach); }
.dot.on { background: var(--star); transform: scale(1.25); }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- play (training / exam) ---------- */
.play, .exam, .lightning, .report, .summary, .notebook, .settings, .lib-page, .ending { display: flex; flex-direction: column; gap: 16px; }
.play-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.play-head > div:first-child { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.play-head h2 { font-family: var(--f-display); font-size: clamp(12px, 2.2vw, 16px); color: var(--cream); line-height: 1.5; outline: none; }
.play-progress { display: flex; gap: 10px; align-items: center; font-family: var(--f-num); font-size: 22px; }
.score-chip { background: var(--star); color: var(--ink); padding: 0 8px; box-shadow: 0 0 0 2px var(--ink); }
.bar { height: 12px; background: rgba(4, 21, 33, 0.7); box-shadow: 0 0 0 3px var(--ink); overflow: hidden; }
.bar span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--star) 0 10px, var(--orange) 10px 20px); transition: width 0.25s linear; }
.q-card { background: var(--paper); color: var(--ink); padding: clamp(16px, 3vw, 26px); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.q-num { font-family: var(--f-display); font-size: 11px; color: var(--red); letter-spacing: 0.04em; }
.flag-txt { color: var(--violet); }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--f-num); font-size: 17px; line-height: 1.1; letter-spacing: 0.03em; padding: 2px 8px; background: var(--ink); color: var(--cream); text-transform: uppercase; }
.tag-src { background: var(--violet); }
.tag-topic { background: var(--red); }
.q-stem { font-size: 18px; line-height: 1.6; }
.q-stem p { max-width: 75ch; margin: 0 0 6px; }
.stmts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.stmts.roman li { display: flex; gap: 10px; padding: 10px 12px; background: var(--paper-2); }
.rn { font-family: var(--f-display); font-size: 11px; color: var(--red); min-width: 2.6em; padding-top: 4px; }
.tf-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--paper-2); border-left: 6px solid transparent; }
.tf-row.ok { border-left-color: var(--ok); background: var(--ok-bg); }
.tf-row.no { border-left-color: var(--bad); background: var(--bad-bg); }
.tf-row.blank { border-left-color: var(--part); }
.tf-text { min-width: 0; }
.tf-btns { display: flex; gap: 6px; }
.tfb {
  width: 46px; height: 42px; font-family: var(--f-display); font-size: 13px; cursor: pointer; border: 0;
  background: #fff; color: var(--ink); box-shadow: 0 0 0 3px var(--ink), 0 4px 0 0 rgba(0,0,0,0.25);
}
.tfb.on { background: var(--orange); }
.tfb:disabled { cursor: default; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; cursor: pointer; border: 0; padding: 12px 14px;
  background: #fff; color: var(--ink); font-size: 17px; line-height: 1.45;
  box-shadow: 0 0 0 3px var(--ink), 0 5px 0 0 rgba(0,0,0,0.2);
  transition: transform 0.05s ease;
}
.opt:hover:not(:disabled) { background: #eaf6fb; }
.opt:active:not(:disabled) { transform: translateY(2px); }
.opt:disabled { cursor: default; }
.opt-key { flex-shrink: 0; width: 30px; height: 30px; display: grid; place-items: center; font-family: var(--f-display); font-size: 12px; background: var(--ink); color: var(--cream); }
.opt-text { min-width: 0; padding-top: 2px; }
.opt.chosen { background: #ffe9a8; }
.opt.chosen .opt-key { background: var(--orange); color: var(--ink); }
.opt.right { background: var(--ok-bg); box-shadow: 0 0 0 3px var(--ok), 0 5px 0 0 rgba(0,0,0,0.2); }
.opt.right .opt-key { background: var(--ok); color: #fff; }
.opt.wrong { background: var(--bad-bg); box-shadow: 0 0 0 3px var(--bad), 0 5px 0 0 rgba(0,0,0,0.2); }
.opt.wrong .opt-key { background: var(--bad); color: #fff; }
.opt.struck { opacity: 0.4; text-decoration: line-through; }
.play-actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.explain { background: var(--paper); color: var(--ink); padding: 18px clamp(16px, 3vw, 24px); box-shadow: 0 0 0 4px var(--ink); display: flex; flex-direction: column; gap: 10px; }
.review-card .explain { box-shadow: none; padding: 12px 0 0; border-top: 3px dashed rgba(4, 21, 33, 0.25); }
.verdict { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 13px; }
.v-icon { width: 34px; height: 34px; display: grid; place-items: center; color: #fff; font-family: var(--f-body); font-weight: 700; font-size: 20px; }
.v-ok .v-icon { background: var(--ok); } .v-no .v-icon { background: var(--bad); } .v-part .v-icon { background: var(--part); } .v-blank .v-icon { background: #8a8f9c; }
.v-marks { margin-left: auto; font-family: var(--f-num); font-size: 24px; }
.ans-line { font-size: 17px; }
.st-why { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.st-why li { padding: 8px 10px; background: var(--paper-2); border-left: 6px solid var(--ok); }
.st-why li.miss { border-left-color: var(--bad); }
.st-tv { font-family: var(--f-display); font-size: 10px; padding: 3px 6px; color: #fff; margin-right: 6px; }
.st-tv.is-t { background: var(--ok); } .st-tv.is-f { background: var(--bad); }
.st-you { font-family: var(--f-label); font-size: 12px; color: var(--red); }
.st-why li div { margin-top: 4px; }
.trap-note { background: #ffe9b3; color: var(--ink); padding: 10px 12px; box-shadow: 0 0 0 2px var(--part); font-size: 15px; }
.trap-label { font-family: var(--f-display); font-size: 10px; background: var(--ink); color: var(--star); padding: 3px 6px; margin-right: 6px; }
.trap-ref { font-family: var(--f-num); font-size: 17px; color: var(--red); white-space: nowrap; }
.hint { margin-top: -4px; }

/* ---------- lightning ---------- */
.lt-hud { display: flex; gap: 10px; align-items: center; }
.lt-score { font-family: var(--f-num); font-size: 40px; line-height: 1; color: var(--star); text-shadow: 3px 3px 0 var(--ink); font-variant-numeric: tabular-nums; }
.lt-mult { font-family: var(--f-display); font-size: 14px; background: var(--violet); color: #fff; padding: 6px 8px; box-shadow: 0 0 0 3px var(--ink); }
.bar-time span { background: repeating-linear-gradient(90deg, #8ef0a8 0 10px, #3fbf74 10px 20px); transition: none; }
.lt-time { font-family: var(--f-num); font-size: 30px; text-align: right; margin-top: -10px; }
.lt-ready { background: var(--panel); padding: 22px; display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center; }
.lt-card { background: var(--paper); color: var(--ink); min-height: 160px; display: grid; place-items: center; padding: 24px; text-align: center; font-size: clamp(18px, 2.6vw, 22px); line-height: 1.45; box-shadow: 0 0 0 4px var(--ink), 0 8px 0 0 rgba(0,0,0,0.35); }
.lt-card.flash-ok { animation: flashok 0.35s ease; }
.lt-card.flash-no { animation: flashno 0.35s ease; }
@keyframes flashok { 0% { box-shadow: 0 0 0 8px var(--ok), 0 0 40px var(--ok); } 100% { box-shadow: 0 0 0 4px var(--ink); } }
@keyframes flashno { 0% { box-shadow: 0 0 0 8px var(--bad), 0 0 40px var(--bad); transform: translateX(-6px); } 50% { transform: translateX(6px); } 100% { box-shadow: 0 0 0 4px var(--ink); transform: none; } }
.lt-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.lt-t { --b1: #c9f7d8; --b2: #6fdc97; --b3: #2f9e5e; }
.lt-f { --b1: #ffc2c0; --b2: #ff6b6b; --b3: #b3261e; }
.miss-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.miss-list li { background: var(--paper); color: var(--ink); padding: 12px 14px; box-shadow: 0 0 0 3px var(--ink); }
.miss-list .why { margin-top: 6px; color: #5a2a20; font-size: 15px; }

/* ---------- summaries ---------- */
.summary, .empty { background: var(--panel); padding: 22px; align-items: center; text-align: center; }
.big-num { font-family: var(--f-num); font-size: 72px; line-height: 1; color: var(--star); text-shadow: 4px 4px 0 var(--ink); }
.big-num small { font-size: 34px; color: var(--cream); }
.empty { display: flex; flex-direction: column; gap: 12px; }

/* ---------- exam ---------- */
.exam-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between;
  background: var(--ink); padding: 10px 14px; box-shadow: 0 0 0 3px var(--peach);
}
.exam-title { display: flex; gap: 8px; align-items: center; font-family: var(--f-label); font-size: 14px; letter-spacing: 0.05em; color: var(--cream); text-transform: uppercase; min-width: 0; }
.exam-timer { font-family: var(--f-num); font-size: 34px; line-height: 1; color: var(--star); font-variant-numeric: tabular-nums; }
.exam-timer.low { color: #ff6b6b; animation: blink 1s steps(2, start) infinite; }
.exam-tools { display: flex; gap: 12px; }
.qnav { display: flex; flex-wrap: wrap; gap: 8px; }
.qn {
  position: relative; width: 38px; height: 38px; font-family: var(--f-num); font-size: 20px; cursor: pointer; border: 0;
  background: rgba(255, 246, 236, 0.15); color: var(--cream); box-shadow: 0 0 0 2px var(--peach);
}
.qn.done { background: var(--orange); color: var(--ink); }
.qn.part { background: linear-gradient(135deg, var(--orange) 0 50%, rgba(255, 246, 236, 0.15) 50% 100%); }
.qn.cur { box-shadow: 0 0 0 3px var(--star), 0 0 12px var(--star); }
.qn.flag::after { content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 12px 12px 0; border-color: transparent var(--violet-2) transparent transparent; }
.exam-note { font-size: 13px; color: var(--text-dim); }

/* ---------- report ---------- */
.report-head { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
.grade-box { isolation: isolate; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 20px; }
.grade-letter {
  position: relative; display: inline-block; font-family: var(--f-display); font-size: clamp(64px, 14vw, 110px); line-height: 1; color: transparent;
  background: linear-gradient(180deg, #fffbe0 0 30%, #ffe98a 30% 50%, #ffb238 50% 100%); -webkit-background-clip: text; background-clip: text;
}
.grade-letter::before {
  content: attr(data-text); position: absolute; inset: 0; z-index: -1; color: #0b3550;
  text-shadow: -5px 0 0 #0b3550, 5px 0 0 #0b3550, 0 -5px 0 #0b3550, 0 5px 0 #0b3550, 7px 9px 0 #041521, -10px 0 0 #fff, 10px 0 0 #fff, 0 -10px 0 #fff, 0 11px 0 #fff, 0 0 26px rgba(255,255,255,0.8);
}
.report-figs { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.report-figs h2 { font-family: var(--f-display); font-size: clamp(12px, 2.2vw, 16px); line-height: 1.5; color: var(--cream); outline: none; }
.report-figs dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 0; }
.report-figs dl div { background: var(--panel); padding: 8px 12px; box-shadow: 0 0 0 2px var(--line); }
.report-figs dt { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.report-figs dd { margin: 0; font-family: var(--f-num); font-size: 30px; line-height: 1.1; color: var(--cream); font-variant-numeric: tabular-nums; }
.warn { color: var(--ink); background: #ffd9a0; padding: 8px 12px; box-shadow: 0 0 0 2px var(--ink); font-size: 15px; }
.overlay .warn { color: var(--ink); }
.unlock { display: flex; align-items: center; gap: 8px; font-family: var(--f-label); color: var(--ink); background: var(--star); padding: 8px 12px; box-shadow: 0 0 0 3px var(--ink); }
.prof {
  background: var(--paper); color: var(--ink); padding: 18px clamp(16px, 3vw, 26px) 18px clamp(28px, 5vw, 48px); position: relative;
  background-image: repeating-linear-gradient(180deg, transparent 0 31px, rgba(61, 42, 140, 0.12) 31px 32px);
}
.prof::before { content: ""; position: absolute; top: 0; bottom: 0; left: clamp(16px, 3vw, 30px); width: 2px; background: rgba(217, 58, 74, 0.6); }
.prof-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.prof-head .portrait { background: linear-gradient(180deg, #ffe08a, #ffb057); padding: 4px; box-shadow: 0 0 0 3px var(--ink); }
.prof-name { font-family: var(--f-display); font-size: 12px; color: var(--red); }
.prof-role { font-size: 13px; color: #6b3a2a; }
.prof-list { margin: 0; padding: 0 0 0 1.1em; display: flex; flex-direction: column; gap: 8px; }
.prof-list li { color: var(--ink-red); font-size: 17px; }
.prof-list li.c-open, .prof-list li.c-close { color: var(--ink); font-weight: 700; list-style: none; margin-left: -1.1em; }
.prof-list li.c-good { color: #1f6b3d; }
.prof-list li.c-trap::marker { content: "✗ "; }
.prof-list li.c-revise { color: var(--violet); }
.prof-note { margin-top: 12px; font-size: 13px; color: #6b3a2a; }
.topic-bars { display: flex; flex-direction: column; gap: 8px; background: var(--panel); padding: 14px; box-shadow: 0 0 0 3px var(--ink); }
.tb { display: grid; grid-template-columns: minmax(0, 220px) 1fr auto; gap: 10px; align-items: center; }
.tb-name { font-size: 14px; color: var(--cream); overflow-wrap: anywhere; }
.tb-track { height: 14px; background: rgba(255,255,255,0.1); box-shadow: 0 0 0 2px var(--ink); }
.tb-fill { display: block; height: 100%; background: var(--orange); }
.tb-fill.low { background: #ff5a6e; }
.tb-fill.high { background: var(--star); }
.tb-val { font-family: var(--f-num); font-size: 20px; color: var(--cream); font-variant-numeric: tabular-nums; }
.review { display: flex; flex-direction: column; gap: 16px; }

/* ---------- final hub ---------- */
.final-banner { background: linear-gradient(180deg, #ffe08a 0%, #7fd3ef 35%, #2a87b5 70%, #0b3a5b 100%); }
.attack { background: var(--panel); padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.attack ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.history { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.history li { background: var(--panel); padding: 6px 10px; box-shadow: 0 0 0 2px var(--line); font-size: 14px; }
.history b { font-family: var(--f-display); font-size: 12px; color: var(--star); }

/* ---------- library / notebook / settings ---------- */
.library { display: flex; flex-direction: column; gap: 14px; }
.lib-sec { background: var(--panel); padding: 0; }
.lib-sec > summary { cursor: pointer; padding: 12px 16px; font-family: var(--f-num); font-size: 22px; line-height: 1.2; letter-spacing: 0.02em; color: var(--cream); list-style: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lib-sec > summary::-webkit-details-marker { display: none; }
.lib-sec > summary::before { content: "▸"; color: var(--star); font-family: var(--f-display); font-size: 12px; }
.lib-sec[open] > summary::before { content: "▾"; }
.lib-sec > summary small { color: var(--peach); font-size: 16px; }
.lib-sec > :not(summary) { margin: 0 16px 14px; }
.lib-sec ul, .lib-sec ol { padding-left: 1.3em; }
.lib-card { background: var(--paper); color: var(--ink); padding: 14px 16px; margin-bottom: 10px !important; box-shadow: 0 0 0 3px var(--ink); }
.lib-card h4 { font-family: var(--f-display); font-size: 12px; line-height: 1.5; color: var(--red); margin-bottom: 8px; }
.table-wrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 520px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-label); font-size: 12px; letter-spacing: 0.05em; color: var(--star); text-transform: uppercase; }
.trap-index { list-style: none; padding-left: 0 !important; display: flex; flex-direction: column; gap: 6px; }
.trap-index .stn-code { font-size: 16px; margin-right: 6px; }
.nb-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.nb-list li { background: var(--panel); padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; box-shadow: 0 0 0 2px var(--line); }
.nb-topic { font-family: var(--f-num); font-size: 17px; color: var(--peach); text-transform: uppercase; letter-spacing: 0.05em; }
.nb-q { grid-column: 1 / -1; font-size: 15px; }
.nb-n { font-family: var(--f-num); font-size: 18px; color: var(--star); }
.set-row { background: var(--panel); padding: 16px; display: flex; gap: 16px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.set-row > div { flex: 1 1 260px; min-width: 0; }
.set-row h3 { font-family: var(--f-display); font-size: 12px; color: var(--cream); margin-bottom: 6px; }
.set-row p { color: var(--text-dim); font-size: 15px; }
.set-row.danger { box-shadow: 0 0 0 3px #ff6b5a; }

/* ---------- ending ---------- */
.ending { position: relative; isolation: isolate; align-items: center; text-align: center; padding-top: 30px; }
.ending .clouds-back { top: 0; height: 240px; }
.end-hero { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.end-hero .portrait { background: linear-gradient(180deg, #ffe08a, #ffb057); padding: 8px; box-shadow: 0 0 0 4px var(--ink); }
.end-cap { margin-bottom: -18px; position: relative; z-index: 2; }
.pixel-sub {
  position: relative; display: inline-block; font-family: var(--f-display); font-size: clamp(24px, 6vw, 52px); color: transparent;
  background: linear-gradient(180deg, #fffbe0 0 35%, #ffe98a 35% 55%, #ffb238 55% 100%); -webkit-background-clip: text; background-clip: text; outline: none;
}
.pixel-sub::before { content: attr(data-text); position: absolute; inset: 0; z-index: -1; color: #0b3550; text-shadow: -4px 0 0 #0b3550, 4px 0 0 #0b3550, 0 -4px 0 #0b3550, 0 4px 0 #0b3550, 6px 7px 0 #041521, -8px 0 0 #fff, 8px 0 0 #fff, 0 -8px 0 #fff, 0 9px 0 #fff, 0 0 22px rgba(255,255,255,0.8); }
.transcript { min-width: 420px; background: var(--panel); }

/* ---------- overlay ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  background: rgba(2, 12, 20, 0.78);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.overlay-card { background: var(--paper); color: var(--ink); max-width: 560px; width: 100%; padding: 22px; display: flex; flex-direction: column; gap: 14px; max-height: 88vh; overflow: auto; }
.overlay-card.wide { max-width: 900px; }
.overlay-card h2 { font-family: var(--f-display); font-size: 15px; line-height: 1.5; color: var(--red); }
.overlay-card .btn-ghost { color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.overlay-card .lib-sec { background: var(--maroon); color: var(--text); }
.overlay-card > .table-wrap th { color: var(--red); }
.overlay-card > .table-wrap td, .overlay-card > .table-wrap th { border-bottom-color: #c8dde8; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .activities.five { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

  T('building-tests', 1, 'If the item IS the building (walls, roof, a bungalow on pillars), it is part and parcel of the land (Elitestone v Morris). Skip the two fixture tests.');
  T('tenant-window', 1, 'A tenant removes trade, ornamental and domestic fixtures during the lease or a short time after, making good damage. Items left once possession is given up belong to the landlord.');
  T('airspace-limit', 1, 'An owner holds only the airspace reasonably necessary for ordinary use and enjoyment (s 2 LTA; Bernstein v Skyviews). Low intrusions (signs, crane jibs) are trespass; high overflights are not.');
  T('subsoil-30m', 1, 'Singapore subsoil: only the depth reasonably necessary, i.e. the depth in the State title or, if silent, 30 m below the Singapore Height Datum (s 3B State Lands Act). Bocardo (England) does not apply here.');
  T('precedent', 1, 'Only the ratio decidendi of a higher court in the same hierarchy binds. Obiter dicta and English decisions are persuasive only. Privy Council appeals ended in 1994.');
  T('civil-criminal', 1, 'Civil: claimant v defendant, balance of probabilities, compensation. Criminal: Public Prosecutor v accused, beyond reasonable doubt, punishment.');
  T('adr', 1, 'Arbitration ends in an award that binds the parties. Mediation is assisted negotiation: nothing binds until the parties sign a settlement.');
  T('proprietary', 1, 'A proprietary right must be definable, identifiable by third parties, capable of assumption by third parties and have some permanence (Ainsworth). Registration is not one of the four.');

  /* Lot 2 · Law and equity */
  T('legal-estate', 2, 'Equity\'s Darling must ACQUIRE THE LEGAL ESTATE. A buyer holding only a contract or another equitable interest is not protected.');
  T('gift-value', 2, 'A gift is not value. A donee takes subject to prior equitable interests even without notice.');
  T('imputed', 2, 'Notice includes constructive (would have found out on proper inquiry) and imputed (the buyer\'s solicitor or agent knew). Lack of actual knowledge is not enough.');
  T('fusion-admin', 2, 'Singapore fused the ADMINISTRATION of law and equity (s 3 Civil Law Act). The doctrines stay separate, and equity prevails in a conflict (Earl of Oxford\'s Case).');
  T('eq-discretion', 2, 'Damages are a right once breach is proved. Equitable remedies (specific performance, injunction, rescission, rectification) are discretionary: clean hands, delay, adequacy of damages.');
  T('walsh', 2, 'A specifically enforceable written agreement for a lease is treated in equity as a lease (Walsh v Lonsdale). No deed means no LEGAL lease, not no lease at all.');
  T('torrens-notice', 2, 'On registered land, mere knowledge of an unregistered interest is not fraud (s 47(2) LTA). An equitable interest needs a caveat.');

  /* Lot 3 · Covenants */
  T('pos-disguise', 3, 'Classify by what compliance costs. "Not to allow the roof to fall into disrepair" and "to maintain" are POSITIVE (they need money or work), whatever the wording.');
  T('burden-law', 3, 'The burden of a covenant NEVER passes at common law (Austerberry; Rhone v Stephens). The benefit can.');
  T('tulk-negative', 3, 'Tulk v Moxhay runs only NEGATIVE covenants, in equity, against a successor with notice, where the covenant benefits identifiable dominant land and was meant to bind successors. Remedy: injunction.');
  T('original-parties', 3, 'Between the original covenantor and covenantee, privity of contract decides. Skip the running rules; the covenantor stays liable after selling or letting.');
  T('halsall', 3, 'Halsall v Brizell: a successor who takes a benefit (using the road or drains) must bear the burden tied to it. It is a workaround, not a rule that positive burdens run.');
  T('benefit-burden', 3, 'Benefit and burden are separate questions with separate rules. Answer both, in that order, for each covenant.');

  /* Lot 4 · Easements, support, licences */
  T('four-tests', 4, 'Re Ellenborough Park: dominant and servient tenements; accommodates the dominant land; DIFFERENT owners; capable of grant (definite, no ouster). Give one fact per test.');
  T('accommodate', 4, 'A personal or commercial advantage that does not benefit the land itself fails "accommodation" (Hill v Tupper).');
  T('ouster', 4, 'A right that excludes the servient owner (storage, all-day parking) is ouster and cannot be an easement (Copeland v Greenhalf; Batchelor v Marlow).');
  T('support-buildings', 4, 'England: the natural right protects land; buildings need an easement (Dalton v Angus). Singapore: Xpress Print v Monocrafts extends the duty to buildings. State both, then add negligence.');
  T('licence-personal', 4, 'A licence is permission, not a property right. A bare licence is revocable and binds no buyer; a contractual licence binds a buyer only through a constructive trust (Ashburn Anstalt).');
  T('philcox', 4, 'Altering the dominant land ends or limits an easement only if the extent of use increases (Graham v Philcox).');

  /* Lot 5 · Mortgages */
  T('borrower-profile', 5, 'Identify the borrower first. Advised commercial parties are held to long postponements (Knightsbridge); vulnerable individuals get protection (Hong Leong; BOM v BOK).');
  T('option-clog', 5, 'An option for the lender to buy the mortgaged property, given as part of the mortgage, is a void clog (Samuel v Jarrah Timber). Singapore has shown leniency to sophisticated commercial borrowers (Citicorp v Wee Ah Kee [check]), so profile the borrower.');
  T('collateral', 5, 'A collateral advantage that is a separate bargain and ends on redemption is valid (Kreglinger). Ask whether it outlives redemption or is unfair.');
  T('penalty-default', 5, 'A default interest rate out of all proportion to the lender\'s greatest conceivable loss is a penalty (Hong Leong: 18% v 5.5–6.75%). "Industry practice" is no answer.');
  T('arisen-exercisable', 5, 'Power of sale: ARISEN needs all three (deed, money due, no exclusion). EXERCISABLE needs any one s 25 CLPA trigger (notice + 3 months; interest 1 month in arrears; breach of another term).');
  T('s75', 5, 'A registered chargee has no inherent right to possession. s 75 LTA: after default, entry needs one month\'s notice, and rents taken must be accounted for.');
  T('lease-mortgage', 5, 'Which came first? A lease before the mortgage binds the bank. A lease after it binds the bank only under s 23 CLPA (up to 3 years), the deed, or consent (s 89(1) LTA).');
  T('sale-duty', 5, 'On sale the mortgagee must act in good faith and take reasonable care to get the true market value (Cuckmere). No duty to wait for a better market (China & South Sea Bank).');

  /* Lot 6 · Leases and licences */
  T('label', 6, 'Exclusive possession for a term at a rent is a tenancy whatever the document calls it (Street v Mountford: "a fork is a fork").');
  T('sham', 6, 'Clauses never meant to operate (a right to move others in, to move the occupier) are shams and are ignored (Antoniades v Villiers).');
  T('services', 6, 'Real attendance and services that need unrestricted access (meals, cleaning the rooms) point to a lodger\'s licence. Weekly cleaning of common areas or a locked store room do not by themselves.');
  T('fixed-term', 6, 'A fixed-term lease ends at the end of the term. A notice to quit works only for a periodic tenancy, or under a break clause.');
  T('privity-both', 6, 'When you mention privity of estate, also mention privity of contract: the original tenant stays liable for the contractual term (City of London v Fell); the assignee is bound by privity of estate (Spencer\'s Case).');
  T('forfeit-steps', 6, 'Forfeiture: (1) a right to forfeit (express re-entry clause, or s 93 LTA for registered leases); (2) the right procedure (s 18 CLPA notice for non-rent breaches; s 18A for rent); (3) check waiver.');
  T('waiver', 6, 'Accepting rent with knowledge of a breach waives the right to forfeit for that breach (a continuing breach can give a fresh right).');
  T('underwrite', 6, 'Quiet enjoyment and non-derogation need substantial interference judged by what both sides contemplated. The landlord does not underwrite the tenant\'s profits (OUE v Three Sixty), and a no-set-off clause works.');
  T('certain-term', 6, 'A lease needs a term certain from the start ("for the duration of the war" fails: Lace v Chantler; Prudential).');

  /* Lot 7 · Co-ownership and trusts */
  T('will-jt', 7, 'A Will cannot pass a joint tenant\'s share: survivorship takes effect first. Check whether anything severed the joint tenancy BEFORE death.');
  T('sever-register', 7, 'Statutory severance needs all three steps: declaration in the approved form, service on every other joint tenant, registration. It takes effect on registration (Chan Lung Kien, overruling Diaz v Diaz).');
  T('rt-burden', 7, 'The legal burden is on the person who asserts the resulting trust (the payer proves the recipient holds for him). The presumption helps, but the burden does not shift.');
  T('two-stage', 7, 'Look for the transferor\'s actual intention FIRST. Presumptions are a last resort (Goh Swee Fang; Patricia Khoo).');
  T('advancement', 7, 'The presumption of advancement is about relationships (parent–child, husband–wife). Its strength depends on the relationship, and Singapore asks whether a gift is more probable than not (Lau Siew Kim).');
  T('acq-time', 7, 'The extent of a resulting trust is fixed at acquisition (Lau Siew Kim). Later mortgage payments count only if the parties\' plan treated them as contributions (Chan Yuen Lan).');
  T('wc-spouses', 7, 's 112 Women\'s Charter divides matrimonial assets on divorce between spouses only. Unmarried partners use trust law.');

  /* Lot 8 · Sale and purchase */
  T('stc-both', 8, '"Subject to contract": state Norwest (strong presumption of no contract) AND OCBC v Wong Hua Choon (look at all circumstances and objective intention). Then pick a side with two facts.');
  T('goodwill', 8, 'A "goodwill deposit" is not an option fee. An option fee is paid against a signed OTP.');
  T('writing', 8, 's 6(d) Civil Law Act: no action on a land contract unless it or a memorandum is in writing and signed by the party sued, showing the 3 Ps (parties, property, price), unless part performance applies.');
  T('pp-unequivocal', 8, 'Part performance needs acts by the claimant unequivocally referable to a contract about the land (Hu Lee Impex rejects the relaxed Steadman test). A small payment alone is usually equivocal.');
  T('otp-strict', 8, 'An OTP must be exercised exactly as it says, in time and in the stated mode (JT Chanrai). The contract arises on exercise (Spiro v Glencrown).');
  T('no-contract', 8, 'When the answer is "no contract", finish the job: no equitable interest, so no caveat, and the money paid is recoverable.');
  T('misrep-opinion', 8, 'Misrepresentation needs an untrue statement of FACT that induced the contract. Opinions and sales puffs are outside it, unless the opinion implies facts the maker knows are untrue.');
  T('sp-discretion', 8, 'Specific performance is the usual remedy for land but is discretionary: adequacy of damages, clean hands, delay, hardship to third parties (EC Investment; Lee Christina).');

  /* Lot 9 · Registration, Torrens, caveats, stamp duty */
  T('whose-fraud', 9, 's 46(2)(a): the fraud or forgery must be that of the registered proprietor or his agent. A stranger\'s forgery does not defeat an innocent registered purchaser.');
  T('notice-fraud', 9, 'Fraud means actual dishonesty (Assets Co; UOB v Bebe). Carelessness or notice of an unregistered interest is not fraud (s 47(2)). Wilful blindness after suspicion is.');
  T('immediate', 9, 'Singapore follows IMMEDIATE indefeasibility (Frazer v Walker): an innocent purchaser who registers under a forged instrument gets a good title.');
  T('donee', 9, 'Only a purchaser (good faith, value: s 4) is protected. A donee or non-purchaser takes no better title than the transferor (s 46(3)).');
  T('each-separately', 9, 'Judge each registered person separately. A fraudulent buyer\'s title can be defeasible while the innocent mortgagee behind him is indefeasible.');
  T('caveat-interest', 9, 'A caveat needs an interest in land that the law recognises and that exists when the caveat is lodged (s 115; Asiatic Enterprises). A bare contractual right to money is not enough (Salbiah).');
  T('caveat-open', 9, 'For caveat removal, open with s 127(1) (any reason; caveator shows cause) or s 127(2) (vexatious, frivolous, not in good faith), say why, then apply American Cyanamid (Eng Mee Yong).');
  T('absd-higher', 9, 'Joint buyers of mixed profiles pay the HIGHER applicable ABSD rate on the whole price. Rates are never averaged or split by share.');
  T('ct-all', 9, 'Not every legal interest is on the Certificate of Title: overriding interests (e.g. leases of 7 years or less) bind without registration.');
  T('assurance', 9, 'The Assurance Fund pays for loss caused by the Registrar\'s or staff\'s omission, mistake or misfeasance (ss 151, 155). A stranger\'s forgery alone does not trigger it.');

  /* Lot 10 · Agency and estate agency */
  T('custom', 10, 'A trade custom the principal did not know about is no defence to a secret profit (Hippisley v Knee Bros). Disclosure plus consent is the only cure.');
  T('honest-agent', 10, 'An HONEST agent who took an undisclosed profit accounts for it but may keep the agreed commission (Hippisley). A DISHONEST agent also forfeits commission (Andrews v Ramsay).');
  T('bribe-remedies', 10, 'Bribe or secret commission: list the remedies (account, constructive trust under FHR v Cedar, rescission of the tainted contract, forfeit commission, damages), then pick those the facts support.');
  T('conflict', 10, 'Selling to oneself, a relative or a connected company without full disclosure and consent is a conflict, and the sale can be set aside (McPherson v Watt).');
  T('exclusive', 10, 'Under the CEA exclusive form (Clause 6), commission is due on any binding sale in the validity period, introduced by the agent or not. Effective cause (Grandhome) is for NON-exclusive agency.');
  T('apparent-own', 10, 'Apparent authority needs a representation BY THE PRINCIPAL. An agent cannot create his own apparent authority (Armagas v Mundogas).');
  T('commission-only', 10, 'A commission-only agent earns nothing unless the event in the contract (usually a sale) happens (Luxor v Cooper). Finding a willing buyer is not enough.');

      q: 'Which of the following best describes a civil claim, as opposed to a criminal prosecution?',
      o: ['It is brought by the Public Prosecutor in the State\'s name and must be proved beyond reasonable doubt.',
        'The injured party sues, proves the claim on a balance of probabilities, and seeks damages.',
        'It always ends in imprisonment or a fine, because the court must punish the wrongdoer.',
        'It can only be heard by the Court of Appeal, and must be proved beyond all doubt.'],
      a: 1, why: 'Civil: private parties, balance of probabilities, compensation or equitable relief. Criminal: the State prosecutes, beyond reasonable doubt, punishment.', trap: 'civil-criminal' },
    { id: 'c1-06', t: 'set', topic: 'Fixtures', src: 'Prof-style (new)',
      q: 'The following statement/s is/are true about fixtures and chattels:',
      s: [
        ['An item resting on its own weight is presumed to be a chattel.', true, 'Degree of annexation sets the presumption (Holland v Hodgson).'],
        ['The object or purpose of annexation now carries more weight than the degree of annexation.', true, 'Purpose usually decides (D\'Eyncourt v Gregory; the modern approach).'],
        ['A bungalow resting on concrete pillars without foundations remains a chattel because it is not fixed.', false, 'Elitestone v Morris: a building is part and parcel of the land.', 'building-tests'],
        ['Towel rails and soap dishes in a flat were held to be fixtures in Botham v TSB.', false, 'They were chattels. Items built into the structure were fixtures.']
      ], opts: [[0], [0, 1], [2, 3], [0, 1, 3]] },
    { id: 'c1-07', t: 'mcq', topic: 'Fixtures', src: 'Prof-style (new)',
      q: 'Kumar sells his Bukit Timah bungalow to Lina. The contract is silent on fittings. Before completion Kumar removes a heavy stone fountain that rests on its own weight but is the centrepiece of the garden, which was landscaped around it. In this case:',
      o: ['The fountain is a chattel because it rests on its own weight, and that alone settles the question.',
        'It may be a fixture, since its purpose was to complete the garden\'s design, so it passes under s 6 CLPA.',
        'Lina can claim the fountain only if it was bolted or cemented to the ground before the contract was signed.',
        'Only buildings pass on a sale of land, so the fountain stays Kumar\'s whatever its purpose was.'],
      a: 1, why: 'Weight raises only a presumption. Where the item\'s purpose is to complete the design of the land, it can be a fixture (D\'Eyncourt v Gregory). Fixtures pass on a conveyance unless the contract excludes them (s 6 CLPA).', trap: 'weight-only' },
    { id: 'c1-08', t: 'mcq', topic: 'Tenant\'s fixtures', src: 'Prof-style (new)',
      q: 'Ravi\'s 3-year lease of a shop at Joo Chiat ended on 31 March. He returned the keys that day, leaving behind display shelves he had bolted to the walls for his trade. On 25 April he asks the landlord to let him remove them. In this case:',
      o: ['Ravi may remove the shelves at any time, because trade fixtures always remain the tenant\'s own property.',
        'They probably belong to the landlord: a tenant may remove fixtures only during the lease or soon after.',
        'The shelves were chattels from the start, so the end of the lease has no bearing on who owns them.',
        'Ravi may remove them only if he first pays the landlord a further month\'s rent as compensation.'],
      a: 1, why: 'Trade fixtures are removable during the term or within a short time after, making good damage (Fisher v Dixon; Spyers v Phillipson). Items left once possession is given up belong to the landlord (BP Refinery [check]).', trap: 'tenant-window' },
    { id: 'c1-09', t: 'mcq', topic: 'Airspace', src: 'Prof-style (new)',
      q: 'Which of the following is most likely to be a trespass to Mrs Tan\'s airspace?',
      o: ['A commercial airliner passing 3,000 m above her house on its usual flight path.',
        'A survey aircraft photographing her house from a reasonable height above the roof.',
        'A neighbour\'s signboard projecting 25 cm over her shopfront at first-floor level.',
        'Sunlight reflected from a neighbour\'s glass facade into her living room each evening.'],
      a: 2, why: 'A low intrusion into the airspace needed for ordinary use is trespass (Kelsen v Imperial Tobacco: an 8-inch sign). Aircraft at a reasonable height are not (Bernstein v Skyviews).', trap: 'airspace-limit' },
    { id: 'c1-10', t: 'mcq', topic: 'Subsoil', src: 'Prof-style (new)',
      q: 'A transport authority bores a tunnel 45 m below the Singapore Height Datum under Mr Lee\'s land. His State title states no depth. In this case:',
      o: ['It is trespass, because a landowner owns the soil beneath the land down to the centre of the earth.',
        'No trespass: where her title is silent, s 3B State Lands Act limits her subsoil to 30 m below the datum.',
        'It is trespass, because Bocardo v Star Energy binds Singapore courts on deep drilling and tunnelling.',
        'It is trespass unless Mr Lee was paid compensation before the tunnel boring work started under his land.'],
      a: 1, why: 's 3B State Lands Act limits subsoil ownership to the depth reasonably necessary, defaulting to 30 m below the SHD. Bocardo is an English case and reflects the English rule.', trap: 'subsoil-30m' },
    { id: 'c1-11', t: 'mcq', topic: 'Proprietary rights', src: 'Prof-style (new)',
      q: 'In National Provincial Bank v Ainsworth, Lord Wilberforce set out the features of a proprietary right. Which of the following is NOT one of them?',
      o: ['It must be definable, so that its content can be stated with certainty.',
        'It must be identifiable by third parties who come to deal with the land.',
        'It must be capable of assumption by third parties and have some permanence.',
        'It must be registered on the Certificate of Title to bind anyone.'],
      a: 3, why: 'The four features are: definable, identifiable by third parties, capable of assumption by third parties, and some degree of permanence. Registration is a Torrens issue (Lot 9), not part of the definition.', trap: 'proprietary' },
    { id: 'c1-12', t: 'set', topic: 'Tenure and title', src: 'Prof-style (new)',
      q: 'The following statement/s is/are true about land ownership in Singapore:',
      s: [
        ['The State is the ultimate owner of land and grants estates such as leases of 99 or 999 years.', true, 'Doctrine of tenures and estates: land (State), then estate, then title.'],
        ['The value of a 99-year lease tends to fall as the remaining term shortens.', true, 'Lease decay. Lenders and CPF lend less on short leases.'],
        ['The Certificate of Title is the document that proves title to registered land.', true, 'Under the Land Titles Act the register and CT show the owner, estate and encumbrances.'],
        ['An estate in perpetuity cannot be sold or mortgaged.', false, 'An estate in perpetuity is the freehold-style estate. It can be sold, mortgaged and leased like any estate.']
      ], opts: [[0, 1], [0, 1, 2], [2, 3], [0, 1, 2, 3]] },
    { id: 'c1-13', t: 'mcq', topic: 'Third-party interests', src: 'Prof-style (new)',
      q: 'Omega Printing installs a press bought on hire-purchase from FinCo, bolting it to the factory floor. Omega later mortgages the factory to a bank that knows nothing about FinCo. Omega defaults. In this case:',
      o: ['FinCo can always repossess the press, because it never stopped owning the machine it supplied.',
        'As a fixture the press is likely part of the land, so the bank without notice takes it too.',
        'The bank takes only the land and buildings, because machinery can never form part of a mortgage.',
        'The press belongs to Omega\'s directors personally, since they signed the hire-purchase agreement.'],
      a: 1, why: 'Hobson v Gorringe: an item on hire-purchase that became a fixture went with the land to a mortgagee without notice.', trap: 'weight-only' },
    { id: 'c1-14', t: 'mcq', topic: 'Bundle of rights', src: 'Prof-style (new)',
      q: 'The "bundle of rights" theory of property describes ownership as:',
      o: ['A single, indivisible right that can only ever be transferred as a whole to one buyer.',
        'A collection of rights, such as to possess, use, exclude and transfer, that can be split up.',
        'A personal right that binds only the person who sold the land, and never later owners.',
        'A right that exists only once the owner is registered at the Singapore Land Authority registry.'],
      a: 1, why: 'Ownership is a bundle of separable rights. A lease grants possession, an easement grants use, a mortgage grants security, while the owner keeps the rest.' },
    { id: 'c1-15', t: 'mcq', topic: 'Fixtures', src: 'Prof-style (new)',
      q: 'Which item is most likely to be a chattel that a seller may take away?',
      o: ['A built-in kitchen cabinet plumbed into the wall.',
        'A lift installed in a three-storey shophouse.',
        'A free-standing sofa and rug in the living room.',
        'A roof-top water tank fixed to the roof slab.'],
      a: 2, why: 'Free-standing furniture rests on its own weight and serves its own enjoyment, so it is a chattel. Items built in or forming part of the building (lift, tank, cabinets) are fixtures or part of the land.', trap: 'building-tests' },
    { id: 'c1-16', t: 'mcq', topic: 'Fixtures (custom)', src: 'Prof-style (new)',
      q: 'A traditional Malay timber house stands on stilts resting on stone blocks and can be dismantled and moved. In a dispute over whether it passed with the land:',
      o: ['It must be part of the land, because every building is part and parcel of the land.',
        'It may be a chattel on the strength of local custom (Kiah bte Hanapiah v Sam).',
        'It is a fixture, because anything as heavy as a house must be fixed to the land.',
        'It belongs to the State, because the house stands on land the State granted out.'],
      a: 1, why: 'Kiah bte Hanapiah v Sam: a removable Malay house was treated as a chattel by custom. It is the exception to Elitestone.', trap: 'building-tests' }
  ],
  quick: [
    ['An item resting on its own weight is presumed to be a chattel.', true, 'Degree of annexation sets the presumption.'],
    ['Purpose of annexation now carries more weight than degree.', true, 'Modern approach (D\'Eyncourt v Gregory).'],
    ['A bungalow on pillars without foundations is a chattel.', false, 'Elitestone: buildings are part of the land.'],
    ['Fixtures pass on a sale of land unless the contract excludes them.', true, 's 6 CLPA.'],
    ['A tenant may remove trade fixtures years after leaving.', false, 'During the term or a short time after only.'],
    ['Aircraft flying at a reasonable height trespass on the land below.', false, 'Bernstein v Skyviews.'],
    ['A crane jib swinging over a neighbour\'s land can be trespass.', true, 'Anchor Brewhouse.'],
    ['In Singapore, subsoil ownership defaults to 30 m below the Singapore Height Datum.', true, 's 3B State Lands Act.'],
    ['Bocardo v Star Energy states the Singapore rule on subsoil.', false, 'It states the English rule. Singapore uses s 3B.'],
    ['Registration is one of Lord Wilberforce\'s features of a proprietary right.', false, 'Definable, identifiable, capable of assumption, permanence.'],
    ['Obiter dicta of the Court of Appeal bind the High Court.', false, 'Only the ratio binds; obiter persuades.'],
    ['Appeals to the Privy Council ended in 1994.', true, 'The Court of Appeal is the final court. (L1; check slides.)'],
    ['A mediator\'s view binds the parties.', false, 'Mediation binds only once the parties sign a settlement.'],
    ['An arbitral award binds the parties.', true, 'That is the point of arbitration.'],
    ['Criminal cases are proved on a balance of probabilities.', false, 'Beyond reasonable doubt.'],
    ['A removable Malay stilt house was held to be a chattel by custom.', true, 'Kiah bte Hanapiah v Sam.'],
    ['A hire-purchase financier always beats a mortgagee without notice over a fixed machine.', false, 'Hobson v Gorringe: the mortgagee took it with the land.']
  ]
