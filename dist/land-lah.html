        'Mr Ong keeps the house, because he never signed the transfer himself.'],
      a: 1, why: 'Immediate indefeasibility protects the first innocent purchaser who registers. Mr Ong looks to Seng (and the Assurance Fund only if the Registry erred).', trap: 'immediate' },
    { id: 'c9-05', t: 'mcq', topic: 'Wilful blindness', src: 'Q&A bank (Ong)',
      q: 'Bobby\'s lawyer warns him that the "Mr Ong" signature looks nothing like the specimen on file and that $900,000 is far below the $2.4m market value. Bobby replies, "Don\'t ask so many questions, just register it," pays cash, and registers. In this case:',
      o: ['Bobby is protected, because s 47(1) says he need not inquire into the price.',

        'Bobby is protected, because only his lawyer, not Bobby himself, saw the signature.',
        'Bobby\'s title is defeasible only if Mr Ong lodged a caveat before he registered.'],
      a: 1, why: 'Wilful blindness (Waimiha; Bebe) is the dishonesty of the proprietor himself. s 47(1) excuses inquiry except for fraud.', trap: 'notice-fraud' },
    { id: 'c9-06', t: 'mcq', topic: 'Each proprietor separately', src: 'Q&A bank (Ong)',
      q: 'After registering, the wilfully blind Bobby mortgages the house to Harbour Bank, which does its usual checks, deals only with Bobby as registered proprietor, has no reason to suspect anything, and registers its mortgage. Mr Ong recovers the house from Bobby by rectification. In this case:',

    { id: 'c9-07', t: 'mcq', topic: 'Non-purchasers', src: 'Prof-style (new)',

    { id: 'c9-08', t: 'mcq', topic: 'Notice is not fraud', src: 'Prof-style (new)',

    { id: 'c9-10', t: 'mcq', topic: 'Caveat removal', src: 'Prof-style (new)',
      q: 'Daniel says Farah orally agreed to sell him her shophouse and that he paid $20,000; he has lodged a caveat. Farah says she never agreed and the $20,000 was a loan. She wants the caveat removed before her sale to another buyer. The best opening for Farah\'s application is:',

    { id: 'c9-11', t: 'mcq', topic: 'Assurance Fund', src: 'Prof-style (new)',

    id: 'leong', title: 'Mrs Leong, Gabby, Bestbank and the students', src: 'Past-year paper, Case Study (1), re-weighted to 40 marks',

    parties: ['Mrs Leong', 'Gabby', 'Bestbank', 'the students'],
    facts: 'Mrs Leong owns two adjoining four-bedroomed semi-detached houses with registered title, Nos. 11 and 13 Sunny Avenue, near a Polytechnic. She lives in No. 11 and lets her son and his family live in No. 13.\n\nRecently Mrs Leong sold No. 13 to Gabby. In the contract of sale Gabby covenanted "on behalf of herself and her successors-in-title with Mrs Leong and her successors in title for the benefit of Mrs Leong\'s land" as follows:\n- (i) not to allow the roof of No. 13 to fall into disrepair;\n- (ii) not to use the premises other than as a private dwelling house; and\n- (iii) to maintain the boundary wall.\n\nTo fund the purchase, Gabby entered into a 15-year mortgage with Bestbank: (i) monthly instalments due on the 13th of every month; (ii) a 10-year lock-in period; (iii) interest rates may be varied at the Bank\'s discretion; and (iv) insurance for the premises to be bought only from Bestbank\'s subsidiary, Best Insurers.\n\nA year later Gabby moved back to her parents\' home. She let 3 of the rooms in No. 13 for 24 months to three nursing students studying at the Polytechnic. She kept one bedroom locked with her possessions, and her helper cleans the premises once a week. The students agreed (i) to pay $1,800 to Gabby on the 12th of every month, and (ii) not to carry out any business on the premises.\n\nDespite clause (ii), the students earn side-income by conducting Science lessons at the premises, and they are consistently late with the $1,800. As a result Gabby fell into arrears with Bestbank, which sent a notice that it would take possession.\n\nGabby is looking for others to take the rooms at a higher rate, and in the 18th month of the students\' occupation she gave them notice to vacate. The students refuse to leave as their course is not over.\n\nNot living at No. 13, Gabby failed to notice its deterioration. Parts of the roof and walls fell into disrepair. Mrs Leong is concerned that No. 11 will be affected by any roof leakage at No. 13, and about the state of the boundary wall. She is also annoyed by the noise and traffic from children coming in and out of No. 13 for Science lessons.',
    parts: [{
      label: '', marks: 40, ask: 'Advise Mrs Leong, Gabby, Bestbank and the students of their respective legal positions. (40 marks)',
      issues: [
        { name: 'Covenants (Mrs Leong v Gabby and the students)', ch: 3, points: [
          { t: 'Mrs Leong and Gabby are the original parties: privity of contract settles liability; Gabby stays liable on all three covenants although she moved out and let the house.', m: 2, k: ['privity|original part'] },
          { t: 'Classify: (i) and (iii) are positive (compliance costs money) despite the "not to" wording; (ii) is negative.', m: 2, k: ['positive', 'negative'] },
          { t: 'Breach and remedies against Gabby: damages or specific performance for the roof and wall; injunction for the business use; Gabby answers for her tenants\' breach of (ii).', m: 2, k: ['damages|specific performance', 'injunction'] },
          { t: 'Students and the positive covenants: the burden of positive covenants does not run (Austerberry; Rhone v Stephens).', m: 2, k: ['austerberry|rhone'] },
          { t: 'Students and covenant (ii): restrictive, benefits No. 11, meant to bind successors, notice through the Certificate of Title, so Tulk v Moxhay supports an injunction [check: tenants as an extension].', m: 2, k: ['tulk|moxhay', 'notice|certificate of title|\\bct\\b'] }

        { name: 'Mortgage (Gabby and Bestbank)', ch: 5, points: [
          { t: 'Lock-in: a 10-year postponement in a 15-year loan is not illusory (contrast Fairclough); Gabby is an individual, so Knightsbridge does not apply automatically, but no infirmity is shown; likely enforceable unless the early redemption charge is disproportionate.', m: 3, k: ['fairclough|knightsbridge', 'lock[- ]?in|postpone|redeem'] },
          { t: 'Variable rate at the bank\'s discretion: a price term, not a clog; must not be exercised arbitrarily; unconscionability only if an infirmity is exploited (BOM v BOK; Hong Leong).', m: 2, k: ['variable|discretion', 'bom v bok|unconscionab|hong leong|clog'] },
          { t: 'Tied insurance with Best Insurers: a collateral advantage that ends on redemption; valid unless unfair or above market (Kreglinger); s 24(1)(b) CLPA already lets a lender insure.', m: 2, k: ['kreglinger|collateral'] },

          { t: 'The 24-month term is fixed: the month-18 notice is ineffective without a break clause; the students may stay to month 24 (even as licensees, the contract limits revocation: Winter Garden).', m: 3, k: ['fixed[- ]term|24[- ]month|break clause', 'notice'] },

      ],
      model: '## Covenants\n**Issue.** Can Mrs Leong enforce covenants (i)–(iii) against Gabby, and can she restrain the students\' lessons?\n**Law.** Original parties are bound in contract (privity of contract; Tweddle v Atkinson). A negative burden runs in equity to a person with notice if it touches and concerns benefited land (**Tulk v Moxhay**). A positive burden never runs (**Austerberry v Oldham**; **Rhone v Stephens**).\n**Application.** Gabby is the original covenantor and Mrs Leong the original covenantee, so privity of contract settles it and no running rules are needed. (i) and (iii) are positive because compliance costs money, whatever the wording; the decayed roof and wall are breaches. Gabby stays liable although she moved out. Remedies: damages for repair costs; specific performance where damages are inadequate (the leak risk to No. 11 supports urgency). (ii) is negative. Letting rooms to students to live in is arguably still a private dwelling; running Science lessons for visiting children is business use, and Gabby answers for what her tenants do. The students are strangers in contract. Positive covenants cannot bind them. (ii) is restrictive, benefits No. 11, is expressed to bind successors and appears on the CT, so the students have notice; Mrs Leong may seek an injunction under Tulk v Moxhay [check: an extension from buyers to tenants].\n**Conclusion.** Mrs Leong sues Gabby on all three covenants and seeks an injunction on (ii); against the students she has Tulk v Moxhay on (ii) and nuisance.\n\n## Mortgage\n**Issue.** Are the lock-in, variable rate and tied insurance enforceable? May Bestbank take possession, and does the students\' lease bind it?\n**Law.** Clogs are void (**Fairclough v Swan Brewery**) but commercial, advised borrowers are held to long postponements (**Knightsbridge v Byrne**; Fiscal Consultants). Collateral advantages stand unless unfair or repugnant to redemption (**Kreglinger**). Unconscionability needs an exploited infirmity (**BOM v BOK**; **Hong Leong**). On default the mortgagee may enter after one month\'s notice (**s 75 LTA**), appoint a receiver or sell (**ss 24, 25 CLPA**). A mortgagor in possession may lease for up to 3 years (**s 23 CLPA**), which binds the mortgagee as authorised by law (**s 89(1) LTA**).\n**Application.** Lock-in: ten years of a 15-year loan leaves real value to redeem, unlike Fairclough. Gabby is an individual, but nothing shows illiteracy, poverty or exploitation as in Hong Leong, so it likely stands unless the early repayment charge is wholly disproportionate. Variable rate: a price term that leaves redemption untouched, not a clog, but it must be exercised in good faith [check]. Tied insurance: a collateral advantage lasting only for the loan; valid unless premiums are above market. Possession: Gabby is in arrears, so Bestbank may enter after one month\'s notice and must account for rents. The 24-month lease is within s 23 (deed silent), so it binds Bestbank under s 89(1); Bestbank may collect rent from the students (Tan Hin Choon) and take the locked room. The power of sale has arisen and is exercisable if interest is a month in arrears (s 25); Bestbank must take reasonable care for the true market value (**Cuckmere**), surplus to Gabby; Gabby can redeem or seek a judicial sale (s 30 CLPA).\n**Conclusion.** The terms likely stand; Bestbank may enter after notice and sell, but takes subject to the students\' lease.\n\n## Lease or licence\n**Issue.** Lease or licence? Was the month-18 notice effective? Gabby\'s remedies for the lessons and late rent.\n**Law.** **Street v Mountford**: exclusive possession for a term at a rent is a tenancy, whatever the label; shams ignored (Antoniades; AG Securities). A fixed term ends with the term unless there is a break clause or forfeiture. Forfeiture needs a right of re-entry and a **s 18 CLPA** notice for non-rent breaches; **s 18A** for rent; waiver by accepting rent with knowledge.\n**Application.** The students have a fixed 24-month occupation of their rooms and shared areas for a monthly rent. The locked room is reserved outside the grant; weekly cleaning is a limited service, not unrestricted access (contrast Abbeyfield; Marchant v Charters). One agreement and joint payment point to a joint tenancy of the three rooms. A lease under 7 years at a rack rent needs no deed (s 53(1) CLPA). The month-18 notice is ineffective: no break clause. The lessons breach the no-business covenant: Gabby needs an express re-entry clause (s 93 LTA does not apply to a short unregistered lease) and a s 18 notice; the breach is capable of remedy; taking later rent with knowledge risks waiver (Expert Clothing [check]). For late rent: sue for arrears; s 18A lets the students pay arrears and costs; distress (up to 12 months\' rent).\n**Conclusion.** The students are likely tenants who may stay to month 24. Gabby\'s routes are damages or an injunction for the lessons, s 18A or distress for rent, and forfeiture only with a re-entry right and proper notice.\n\n## Nuisance and overall conclusions\nThe noise and traffic support a private nuisance claim against the students, and against Gabby if she authorised the lessons. **Mrs Leong:** sue Gabby on all covenants; injunction on (ii) against the students. **Gabby:** liable to Mrs Leong; bound by the lock-in and tied insurance; cannot evict before month 24. **Bestbank:** may enter after notice and sell, subject to the lease. **The students:** tenants until month 24, but must stop the lessons and pay on time.',
      tricks: ['Spot the three chapters (3, 5, 6) and give each its own ILAC block.', 'Use the 24-month lease twice: once for s 23 / s 89 (mortgage) and once for the fixed-term point (lease).', 'Finish with a conclusion line for each of the four named parties.']
    }]
  });

  LL.addCase({
    id: 'zen', title: 'Zen, Belle, the children and Bigbank', src: 'Past-year paper, Case Study (2), 40 marks',
    chs: [7, 9, 5], marks: 40, mins: 45, kind: 'exam',
    parties: ['Belle', 'the children', 'Bigbank'],
    facts: 'Zen is a veteran property fund manager who owns several shophouses and residential investment properties. He has two children, aged 21 and 23, with his ex-wife Laney, who divorced him two years ago after discovering his relationship with Belle, a former model. While the divorce was pending, Zen wrote a Will leaving "all his assets and property" to his children.\n\nAfter the divorce, Zen bought a penthouse for himself and Belle to live in. To assure Belle of his commitment, Zen added Belle\'s name to his on the registered title. Belle did not contribute to the price. When adding her name, Zen sent Belle a WhatsApp message: "this is my assurance for you - to have and to hold forever".\n\nTo finance the purchase, Zen took a mortgage loan from Bigbank in his and Belle\'s names as co-owners and co-borrowers, repayable over ten years. The Bank registered its interest as mortgagee. The terms included: (1) late instalments would be subject to late-payment interest at 28% a year; and (2) the earliest date Zen could redeem the mortgage would be in nine years\' time.\n\nTwo years later, on a business trip to Hong Kong, Zen died in a car accident. The children then lodged a caveat against the penthouse. Belle is unable to repay the mortgage instalments.\n\n(The paper names Zen\'s partner "Binny" in one line and "Belle" elsewhere. Treat them as one person, Belle.)',
    parts: [
      { label: '(a)', marks: 20, ask: '(a) Discuss the respective rights of Belle and the children. (20 marks)',
        issues: [
          { name: 'Legal title, survivorship and the Will', ch: 7, points: [
            { t: 'Legal title: named co-proprietors without words of severance hold as joint tenants (s 53(1) LTA).', m: 2, k: ['§53|joint tenan'] },
            { t: 'Survivorship: on Zen\'s death his interest vanishes and Belle takes the legal title; a Will cannot pass a joint tenant\'s share (Shafeeg v Fatimah); the earlier Will does not sever.', m: 3, k: ['survivorship', 'will'] },
            { t: 'No severance: no statutory declaration, service and registration (s 53(5),(6) LTA; Chan Lung Kien), and no Williams v Hensman mode on the facts.', m: 3, k: ['sever', 'chan lung kien|hensman|declaration|registration'] }
          ] },
          { name: 'Beneficial interest: resulting trust', ch: 7, points: [
            { t: 'Belle paid nothing: the children argue a presumed resulting trust for Zen\'s estate; the legal burden is on them as the parties asserting it (Lau Siew Kim; Dyer v Dyer).', m: 3, k: ['resulting trust', 'lau siew kim|presum|burden|dyer'] },
            { t: 'Presumption of advancement does not help an unmarried partner (older rule), and presumptions are a last resort: actual intention first (Goh Swee Fang; Patricia Khoo).', m: 2, k: ['advancement', 'intention'] },
            { t: 'Apply Patricia Khoo: the WhatsApp text "to have and to hold forever" plus registration points to scenario 1 (immediate benefit, beneficial JT); the children argue scenario 2 or 3 (security for life only / no benefit intended).', m: 3, k: ['patricia khoo|khoo gaik pin|scenario', 'forever|whatsapp|text|message'] },
            { t: 'Belle\'s joint liability on the mortgage is not a contribution at acquisition unless the parties\' plan was that she would repay (Lau Siew Kim; Chan Yuen Lan; Su Emmanuel).', m: 1, k: ['chan yuen lan|contribut|co-?borrower'] }
          ] },
          { name: 'The children\'s caveat', ch: 9, points: [
            { t: 'A caveat needs a claimed interest in land existing at lodgment (s 115 LTA); the children (or the executor) claim a beneficial interest via the estate [check who may lodge]. Belle applies to remove under s 127(1) (disputed claim) rather than s 127(2); American Cyanamid / Eng Mee Yong: serious question, then balance of convenience; s 124 undertaking; s 128 compensation unlikely given an honest claim.', m: 3, k: ['§127', 'cyanamid|eng mee yong|serious question', '§115|§124|§128|caveatable'] }
          ] }
        ],
        model: '**Issue.** (1) How do Zen and Belle hold the legal title and who holds the beneficial interest? (2) Did the Will pass any interest in the penthouse? (3) Can the children\'s caveat stand?\n\n**Law.** Co-proprietors named without words of severance are joint tenants (**s 53(1) LTA**). On a joint tenant\'s death survivorship applies and the interest does not pass under a Will (**Shafeeg v Fatimah**). Severance needs the three statutory steps (**s 53(5), (6) LTA**; **Chan Lung Kien v Chan Shwe Ching**) or an equitable mode (**Williams v Hensman**). Beneficial ownership follows the legal title unless displaced by a resulting trust or CICT; for gratuitous joint names, **Patricia Khoo v Khoo Gaik Pin** gives four scenarios, and actual intention comes first (Goh Swee Fang; **Wong Mei Lee Millie v Jake Ngor**). The person asserting a resulting trust bears the burden (**Lau Siew Kim**). A caveat needs a claimed interest in land (**s 115 LTA**); the caveatee may apply under **s 127**.\n\n**Application.** Legal title: both are named with no words of severance, so they are joint tenants at law. On Zen\'s death Belle takes by survivorship. The Will was made before the purchase and a Will cannot sever; none of the statutory steps was taken and no Williams v Hensman mode appears. Beneficial title: Belle paid nothing, so the children will say she holds on resulting trust for Zen\'s estate, which passes to them under the Will. The presumption of advancement does not help an unmarried partner, and in any event presumptions are a last resort. The evidence of intention decides it: registering Belle "to assure her of his commitment" and the text "to have and to hold forever" point to scenario 1, an intention to benefit her immediately, making them beneficial joint tenants. The children will argue that "forever" meant security while he lived (scenario 2) or that the joint mortgage was only a financing device (scenario 3 or 4). Belle\'s joint liability on the mortgage is not a contribution at acquisition unless their plan was that she would repay (Lau Siew Kim; Chan Yuen Lan). Caveat: the children claim a beneficial interest through the estate. Belle should apply under **s 127(1)**, because the claim is genuinely disputed and s 127(2) (vexatious, frivolous, bad faith) would likely fail. The caveators must show a serious question to be tried, then the balance of convenience (**American Cyanamid**; **Eng Mee Yong**). Since intention is genuinely disputed, the caveat will probably stay to trial; Belle can ask for an undertaking or security under **s 124**. Compensation under **s 128** is unlikely given an honest claim.\n\n**Conclusion.** On the best reading of the text and the registration, Belle takes the penthouse by survivorship and the children take nothing under the Will, but this turns on intention and the children have an arguable resulting trust claim. The caveat likely stays pending trial.',
        tricks: ['Open with the legal title (joint tenants by default), then the beneficial question.', 'Say in one sentence that a Will cannot pass a joint share.', 'For the caveat, name s 127(1) and say why not s 127(2).'] },
      { label: '(b)', marks: 20, ask: '(b) Discuss TWO legal issues pertaining to the mortgage. (20 marks)',
        issues: [
          { name: 'Issue 1: the 28% default interest', ch: 5, points: [
            { t: 'Rule: a default rate out of all proportion to the lender\'s greatest conceivable loss is a penalty and unenforceable (Hong Leong Finance v Tan Gin Huay: 18% v 5.5–6.75%; "industry practice" rejected; Dunlop).', m: 5, k: ['penalt', 'hong leong|dunlop', '28'] },
            { t: 'Apply: 28% exceeds the 18% struck down in Hong Leong; Bigbank must justify it as a genuine pre-estimate; Zen\'s sophistication does not save it because the test is proportionality; result: contract rate plus actual loss.', m: 3, k: ['contract rate|unenforceab|pre-?estimate', 'sophisticat|fund manager|experienc|proportion'] }
          ] },
          { name: 'Issue 2: the nine-year bar on redemption', ch: 5, points: [
            { t: 'Rule: a postponement is a void clog if it makes redemption illusory (Fairclough v Swan Brewery); here a penthouse keeps its value, so redemption after nine years is not illusory.', m: 4, k: ['fairclough|illusory', 'clog|equity of redemption|redeem'] },
            { t: 'Borrower profile: Zen is sophisticated, so Knightsbridge / Fiscal Consultants / Citicorp hold him to the bargain; Belle (no stated advice, no contribution) could argue unconscionability under BOM v BOK, which shifts the burden to Bigbank once an exploited infirmity is shown.', m: 4, k: ['knightsbridge|fiscal consultants|citicorp', 'bom v bok|unconscionab|infirmit'] }
          ] },
          { name: 'Consequences for Belle', ch: 5, points: [
            { t: 'Belle is liable for the whole debt as co-borrower, with Zen\'s estate; on default Bigbank may enter after one month\'s notice (s 75 LTA), appoint a receiver, and sell under ss 24–25 CLPA; its registered charge ranks ahead of the later caveat.', m: 4, k: ['co-?borrower|whole debt|liable', '§75|§25|power of sale|receiver', 'priority|registered (charge|mortgage|interest)|ranks'] }
          ] }
        ],
        model: '**Issue.** (1) Is the 28% default interest enforceable? (2) Is the nine-year bar on redemption a clog on the equity of redemption?\n\n**Law.** A default rate out of all proportion to the lender\'s greatest conceivable loss is a penalty (**Hong Leong Finance v Tan Gin Huay**: 18% against contract rates of 5.5–6.75%; "industry practice" rejected; **Dunlop v New Garage**). A postponement of redemption is void if redemption becomes illusory (**Fairclough v Swan Brewery**) or the bargain is oppressive, but it stands between commercial parties on equal footing (**Knightsbridge Estates v Byrne**; Fiscal Consultants; Citicorp v Wee Ah Kee). Unconscionability needs an exploited infirmity, after which the lender must show fairness (**BOM v BOK**).\n\n**Application.** (1) 28% is higher than the 18% struck down in Hong Leong and many times the ordinary contract rate. Bigbank must show it is a genuine pre-estimate of the loss from late payment; market practice is no answer. Bigbank may say Zen and Belle were sophisticated, but the penalty rule turns on proportionality, whatever the borrower\'s skill. The default rate is likely an unenforceable penalty; Bigbank recovers the contract rate plus its real loss. (2) Nine years of a ten-year loan leaves one year to redeem. The penthouse keeps its value, so redemption is not illusory as in Fairclough. Zen\'s sophistication brings Knightsbridge and Fiscal Consultants into play. Belle, a former model with no stated advice who contributed nothing, may argue an infirmity that Bigbank exploited; under BOM v BOK the burden would then shift to Bigbank to prove fairness. Without that, the bar probably stands, though an early redemption fee wholly disproportionate to the bank\'s loss would not.\n\n**Consequences.** As co-borrower Belle is liable for the whole debt with Zen\'s estate. On default Bigbank may enter after one month\'s notice (**s 75 LTA**), appoint a receiver and sell (**ss 24, 25 CLPA**), taking reasonable care for the true market value (Cuckmere). Its registered charge ranks ahead of the children\'s later caveat.\n\n**Conclusion.** The 28% clause is likely an unenforceable penalty. The nine-year bar likely stands unless Belle proves exploitation. Belle remains liable and risks a mortgagee sale.',
        tricks: ['Name the two issues in the first line: default interest and the redemption bar.', 'Profile BOTH borrowers: Zen (sophisticated) and Belle (possibly vulnerable).'] }
    ]
  });

  LL.addCase({
    id: 'mock-lim', title: 'Mr Lim, Ms Chua, Zara and the car park lot', src: 'Q&A Bank mock combined case study',
    chs: [8, 9, 10, 7], marks: 40, mins: 45, kind: 'exam',
    parties: ['Ms Chua', 'Mr Lim', 'Mr Ho', 'Zara'],
    facts: 'Mr Lim owns a shophouse with registered (Torrens) title at Tanjong Pagar. On 1 March he met agent Zara, who agreed under a CEA non-exclusive form to market it at 1% commission. Zara showed it to Ms Chua. They chatted on WhatsApp about price. Ms Chua wrote "ok $4.2m, subject to contract". Mr Lim replied "deal". Ms Chua paid $20,000 by PayNow with the note "deposit shophouse". No contract was signed.\n\nIn April Ms Chua started renovations with Mr Lim\'s knowledge. In May Mr Lim sold the shophouse to Mr Ho for $4.5m. Mr Ho, who knew about Ms Chua\'s claim, was registered as proprietor. Ms Chua had not lodged a caveat. Zara also took $5,000 from Mr Ho for "introducing" him, and did not tell Mr Lim.\n\nMr Lim and Ms Chua also co-own a car park lot at the back as joint tenants. Ms Chua wants to sell her interest.',
    parts: [
      { label: '(a)', marks: 20, ask: '(a) Advise Ms Chua on her claim to the shophouse. (20 marks)',
        issues: [{ name: 'Contract, enforceability and Mr Ho\'s title', ch: 8, points: [
          { t: '"Subject to contract": a strong presumption of no contract (Norwest), rebuttable by words and conduct (OCBC v Wong Hua Choon); Mr Lim\'s "deal", the "deposit" note and renovations with his knowledge make it a real contest.', m: 6, k: ['norwest', 'ocbc|wong hua choon', 'subject to contract'] },
          { t: 'Writing: s 6(d) Civil Law Act needs signed writing with the 3 Ps; WhatsApp messages with Mr Lim\'s name or number are arguably a signed memorandum [check].', m: 3, k: ['6a?\\s*\\(d\\)|signed writing|memorandum'] },
          { t: 'Part performance: the $20,000 alone is equivocal; renovation with the owner\'s knowledge is stronger and points to a contract for this shophouse (Hu Lee Impex; Maddison v Alderson).', m: 3, k: ['part performance', 'hu lee|maddison|unequivocal'] },
          { t: 'Mr Ho: registered purchaser for value, indefeasible under s 46(1); knowledge of Ms Chua\'s claim is not fraud (s 47(2)); she must prove actual dishonesty or wilful blindness (UOB v Bebe; Loke Yew).', m: 5, k: ['§46|indefeasib', '§47|knowledge|notice', 'bebe|wilful|dishonest|fraud'] },
          { t: 'No caveat was lodged, so the equitable interest was unprotected; fallback: damages against Mr Lim if a contract exists, and recovery of the $20,000 and renovation costs.', m: 3, k: ['caveat', 'damages|recover|20,?000'] }
        ] }],
        model: '**Issue.** Is there an enforceable contract with Ms Chua, and does it bind Mr Ho?\n\n**Law.** "Subject to contract" creates a strong presumption of no contract (**Norwest v Newport Mining**), rebuttable on the words and conduct (**OCBC v Wong Hua Choon**). A land contract needs a signed memorandum (**s 6(d) Civil Law Act**) or part performance (**Maddison v Alderson**; **Hu Lee Impex**). An equitable interest on registered land needs a caveat (**s 115 LTA**). A registered purchaser is indefeasible (**s 46(1)**) unless party to fraud, including wilful blindness (**s 46(2)(a)**; **UOB v Bebe**); knowledge of an unregistered interest is not fraud (**s 47(2)**).\n\n**Application.** Ms Chua wrote "subject to contract", so the presumption is against a deal. But Mr Lim replied "deal", the $20,000 note said "deposit shophouse", and renovations went ahead with his knowledge; under OCBC that later conduct may show both treated the deal as concluded. Parties, property and price are certain, and the messages may be "signed" if Mr Lim\'s name or identifier appears [check]. On balance the label leans against a contract, but the conduct makes it a real contest. Part performance: the payment alone is equivocal; renovation with the owner\'s knowledge is buyer-like conduct referable to this shophouse, so Ms Chua may hold an equitable interest. Mr Ho is registered and paid $4.5m. His knowledge of the claim is not enough (s 47(2)); Ms Chua must show he set out to defeat a concluded contract or was wilfully blind. The facts do not show dishonesty, and she lodged no caveat.\n\n**Conclusion.** Her contract claim is arguable but uncertain; against Mr Ho she likely fails unless she proves fraud. Her fallback is damages against Mr Lim (if a contract exists) and recovery of the $20,000 and renovation costs.' },
      { label: '(b)', marks: 10, ask: '(b) Advise Mr Lim on Zara. (10 marks)',
        issues: [{ name: 'Agent\'s secret commission', ch: 10, points: [
          { t: 'Zara is a fiduciary; the undisclosed $5,000 from the buyer is a secret commission or bribe taken without Mr Lim\'s knowledge or consent.', m: 3, k: ['fiduciar', 'secret|bribe'] },
          { t: 'Remedies: account; the money is held on constructive trust (FHR v Cedar Capital); forfeiture of her 1% commission for dishonesty (Andrews v Ramsay); CEA complaint (Code of Ethics; no commission from both sides without consent).', m: 4, k: ['fhr|cedar|constructive trust', 'andrews|forfeit', 'cea|code of ethics'] },
          { t: 'Commission under a non-exclusive form depends on effective cause (Grandhome); the sale to Mr Ho was a different deal, and the secret profit rule applies regardless.', m: 3, k: ['grandhome|effective cause'] }
        ] }],
        model: '**Issue.** Is Zara in breach, and what can Mr Lim do?\n\n**Law.** An agent is a fiduciary who may not take a secret commission or act for both sides without consent (**Hippisley v Knee Bros**; **Andrews v Ramsay**). A bribe is held on constructive trust (**FHR European Ventures v Cedar Capital**). The CEA Code bars commission from both sides without disclosure. Under a non-exclusive agency commission needs effective cause (**Grandhome v Ng Kok Eng**).\n\n**Application.** Zara took $5,000 from Mr Ho without telling Mr Lim: a secret profit. Under FHR it is held on constructive trust for Mr Lim, who can recover and trace it. Her dishonesty justifies refusing her 1% commission (Andrews v Ramsay). She may say she was the effective cause, but the sale to Mr Ho was a different deal, and the profit rule applies in any case. Mr Lim can complain to the CEA.\n\n**Conclusion.** Mr Lim recovers the $5,000 and can withhold commission; Zara faces discipline.' },
      { label: '(c)', marks: 10, ask: '(c) Advise on the car park lot. (10 marks)',
        issues: [{ name: 'Joint tenancy and severance', ch: 7, points: [
          { t: 'Mr Lim and Ms Chua are joint tenants: survivorship applies unless the tenancy is severed.', m: 2, k: ['survivorship|joint tenan'] },
          { t: 'Severance routes: a sale of her own share severs (acting on one\'s own share, Williams v Hensman); or the statutory declaration, service and registration (s 53(5),(6) LTA; Chan Lung Kien).', m: 5, k: ['hensman|acting on|own share', '§53|declaration|chan lung kien'] },
          { t: 'Result: the buyer and Mr Lim become tenants in common in equal shares; if they cannot agree, a court may order sale in lieu of partition (Abu Bakar v Jawahir).', m: 3, k: ['tenan(ts?|cy) in common|\\btic\\b', 'sale in lieu|partition'] }
        ] }],
        model: '**Issue.** Can Ms Chua sell her interest, and what happens to the lot?\n\n**Law.** Joint tenants hold subject to survivorship. Severance: the statutory declaration, service and registration (**s 53(5), (6) LTA**; **Chan Lung Kien**), or in equity by acting on one\'s own share, mutual agreement or course of dealing (**Williams v Hensman**). The court may order sale in lieu of partition (**Abu Bakar v Jawahir**).\n\n**Application.** Ms Chua can sell her interest; the transfer severs the joint tenancy, and the buyer and Mr Lim become tenants in common in equal shares. If she dies first without severing, Mr Lim takes the whole. If the new co-owners cannot cooperate, either may seek a sale in lieu of partition.\n\n**Conclusion.** Ms Chua may sell her half, severing the joint tenancy once the transfer is registered.',
        tricks: ['Spot five signals: "subject to contract", no caveat, a knowing registered buyer, a secret payment to the agent, and joint ownership.'] }
    ]
  });

  LL.addCase({
    id: 'new-joochiat', title: 'Mdm Rosnah\'s Joo Chiat shophouse', src: 'New case in the practice-paper style',
    chs: [6, 1, 10], marks: 40, mins: 45, kind: 'exam',
    parties: ['Mdm Rosnah', 'Kai', 'Glen', 'Fiona', 'Pearl Holdings'],
    facts: 'Mdm Rosnah owns a two-storey conservation shophouse on Joo Chiat Road with registered title.\n\nIn January 2025 she let the ground floor to Kai, who runs a café, under a document headed "Licence to Occupy" for three years at $6,000 a month. Kai holds the keys to the ground floor. Mdm Rosnah keeps a spare key "for emergencies" and stores some of her furniture in a locked back room, which Kai cannot use. Clause 4 says Mdm Rosnah "may introduce other occupiers to share the premises at her discretion"; she has never done so. Clause 7 forbids Kai from allowing anyone else to trade on the premises without her written consent, and clause 9 gives Mdm Rosnah a right to re-enter for any breach.\n\nKai bolted a long espresso bar counter to the floor, wired ceiling fans into the ceiling, installed a free-standing walk-in chiller that rests on its own weight, and fixed a neon sign to the façade. Since March 2026 he has let a friend run a weekend pop-up bakery from one corner of the café, without asking Mdm Rosnah. Kai also paid rent three weeks late in May and again in August 2026. Mdm Rosnah found out about the bakery in June but accepted the August rent without comment.\n\nIn October 2026 Mdm Rosnah decided to sell the shophouse with vacant possession. She gave Kai one month\'s notice "terminating the licence". Kai says he is a tenant and will stay until January 2028; if he has to leave, he will take the counter, the fans, the chiller and the sign.\n\nTo sell, Mdm Rosnah appointed agent Glen of HomeTrue Realty on a non-exclusive basis at 1% commission payable on completion. Glen introduced Mr Yeo, who offered $3.8m. Glen did not pass this offer on. Instead he told Mdm Rosnah that the best offer was $3.6m from "a corporate client", Pearl Holdings Pte Ltd, which is owned by Glen\'s wife. Mdm Rosnah granted Pearl an option to purchase at $3.6m. Before Pearl exercised it, Mdm Rosnah learned the truth.\n\nTwo months later another agent, Fiona, showed the shophouse to Mr Yeo again, negotiated with him over several weeks and secured a sale at $3.75m. Both Glen and Fiona now claim commission.',
    parts: [
      { label: '(a)', marks: 20, ask: '(a) Advise Mdm Rosnah and Kai on Kai\'s right to occupy, her remedies for his breaches, and the items Kai installed. (20 marks)',
        issues: [
          { name: 'Lease or licence, and the notice', ch: 6, points: [
            { t: 'Test: exclusive possession for a term at a rent is a lease whatever the label; "Licence to Occupy" is not decisive (Street v Mountford; Goh Cin Chye).', m: 4, k: ['mountford', 'exclusive possession', 'label|licence to occupy|called'] },
            { t: 'Apply: clause 4 is a sham never meant to operate (Antoniades v Villiers); the emergency key does not defeat exclusive possession (Aslan v Murphy); the locked back room is simply outside the grant.', m: 3, k: ['sham|antoniades', 'key|aslan'] },
            { t: 'Conclusion: a 3-year lease (7 years or less at a rack rent, no deed needed: s 53(1) CLPA); a fixed term ends at its end, so the one-month notice is ineffective; Kai may stay to January 2028 unless the lease is forfeited.', m: 3, k: ['fixed[- ]term|notice', '§53|7 years|seven years|deed'] }
          ] },
          { name: 'Forfeiture, waiver and rent', ch: 6, points: [
            { t: 'Pop-up bakery breaches clause 7; clause 9 gives a right of re-entry; forfeiture needs a s 18 CLPA notice (breach, remedy, reasonable time); but accepting the August rent after learning of the bakery in June likely waived that breach (a continuing breach may give a fresh right).', m: 4, k: ['§18|forfeit', 'waiv|expert clothing|continuing'] },
            { t: 'Late rent: sue for arrears; any forfeiture for rent is subject to s 18A CLPA (Kai may pay arrears and costs); distress is available for unpaid rent.', m: 2, k: ['18a|distress'] }
          ] },
          { name: 'Fixtures and the right to remove', ch: 1, points: [
            { t: 'Two tests (Holland v Hodgson): degree and purpose of annexation, purpose carrying more weight; apply to each item: counter (bolted, for trade), fans (wired in), chiller (resting on own weight: chattel), sign (fixed, for trade).', m: 2, k: ['holland|hodgson|annexation', 'counter|fan|chiller|sign'] },
            { t: 'Tenant\'s (trade) fixtures may be removed during the term or a short time after, making good any damage (Fisher v Dixon; Spyers v Phillipson); the chiller is a chattel he may take any time.', m: 2, k: ['trade fixture|tenant\'s fixture|chattel', 'make good|making good|during the (lease|term)|end of the (lease|term)'] }
          ] }
        ],
        model: '## Lease or licence\n**Issue.** Is Kai a tenant or a licensee, and did the one-month notice end his right to occupy?\n**Law.** Exclusive possession for a term at a rent is a tenancy, whatever the label (**Street v Mountford**; Goh Cin Chye). Clauses never meant to operate are shams (**Antoniades v Villiers**). Retained keys do not by themselves defeat exclusive possession (**Aslan v Murphy**). A lease of 7 years or less at a rack rent needs no deed (**s 53(1) CLPA**). A fixed term ends at its end; notice to quit works only for periodic tenancies or under a break clause.\n**Application.** Kai holds the keys to the ground floor for a fixed three years at $6,000 a month. Clause 4 has never been used and would defeat the whole café; it is a sham. The emergency key is a limited reservation, and the locked back room is excluded from the grant rather than shared. Kai therefore has exclusive possession: the "Licence to Occupy" is a three-year lease, valid without a deed. The one-month notice is ineffective; no break clause is stated.\n**Conclusion.** Kai is a tenant until January 2028 unless Mdm Rosnah validly forfeits.\n\n## Forfeiture and rent\n**Issue.** Can Mdm Rosnah forfeit for the bakery or the late rent?\n**Law.** Forfeiture needs a right to re-enter (clause 9) and the right procedure: a **s 18 CLPA** notice for non-rent breaches; **s 18A** for rent. Accepting rent with knowledge of a breach waives forfeiture for that breach (Expert Clothing [check]).\n**Application.** Letting a friend trade breaches clause 7. But Mdm Rosnah knew of the bakery in June and accepted the August rent without reservation, which likely waives forfeiture for the breach up to then; if the bakery continues, it is arguably a continuing breach that gives a fresh right after a proper s 18 notice. The late rent lets her sue for arrears; any forfeiture for rent is subject to s 18A, under which Kai can pay arrears and costs. Distress is also available for unpaid rent.\n**Conclusion.** Her safest route is a fresh s 18 notice about the continuing bakery, with no further acceptance of rent without a reservation.\n\n## The installed items\n**Issue.** Which items may Kai remove?\n**Law.** **Holland v Hodgson**: degree of annexation, then purpose; purpose carries more weight. A tenant may remove trade fixtures during the term or a short time after, making good damage (**Fisher v Dixon**; **Spyers v Phillipson**); items left after possession is given up belong to the landlord.\n**Application.** The chiller rests on its own weight and serves Kai\'s trade: a chattel. The counter and sign are fixed but installed for his trade: trade fixtures, removable on making good the bolt holes and façade. The fans are wired in; arguably ornamental or domestic fixtures, also removable, making good the ceiling.\n**Conclusion.** Kai may take all four items, the fixtures only before or soon after the lease ends, making good damage.',
        tricks: ['Write the three elements, then the deciding facts (sham clause, emergency key, locked room).', 'Forfeiture in three steps: right, procedure, waiver.', 'Run both fixture tests per item, then the tenant\'s removal window.'] },
      { label: '(b)', marks: 20, ask: '(b) Advise Mdm Rosnah on her position against Glen, Pearl Holdings and Fiona. (20 marks)',
        issues: [
          { name: 'Glen\'s breaches of duty', ch: 10, points: [
            { t: 'Glen is a fiduciary who must disclose material information and avoid conflicts: steering the sale to his wife\'s company without disclosure is a conflict (McPherson v Watt), and suppressing Mr Yeo\'s higher offer breaches the duty to disclose and to follow instructions.', m: 5, k: ['fiduciar', 'mcpherson|conflict', 'disclos|offer|yeo'] },
            { t: 'The OTP granted to Pearl was procured through the agent\'s undisclosed conflict with a connected party; Mdm Rosnah may have it set aside / rescind it (McPherson v Watt).', m: 3, k: ['rescind|rescission|set aside'] },
            { t: 'Glen\'s commission and liability: as a dishonest agent he forfeits commission (Andrews v Ramsay; contrast Hippisley for honest agents); he is liable for loss caused by the breach.', m: 4, k: ['andrews|forfeit', 'damages|loss|liable'] }
          ] },
          { name: 'Who earns commission: effective cause', ch: 10, points: [
            { t: 'Non-exclusive agency: commission needs effective cause (Grandhome: commission promised; agent engendered the buyer\'s interest; offer conveyed; same buyer and price; short time). Glen introduced Mr Yeo but never conveyed the offer; two months passed, the price changed and Fiona\'s negotiations secured the sale, which breaks the chain.', m: 5, k: ['grandhome|effective cause', 'break|chain|two months|time gap|price|convey'] },
            { t: 'Fiona is likely the effective cause and entitled to her commission; Mdm Rosnah is not liable to pay twice; she may also complain about Glen to the CEA (Code of Ethics).', m: 3, k: ['fiona', 'cea|council for estate agencies|code of ethics'] }
          ] }
        ],
        model: '**Issue.** (1) Did Glen breach his duties, and what follows for the OTP to Pearl and his commission? (2) Who, if anyone, earns commission on the sale to Mr Yeo?\n\n**Law.** An estate agent is a fiduciary: good faith, disclosure of material information (including every offer), no conflict, no secret profit. An agent may not sell to himself or a connected party without full disclosure and consent; such a sale can be set aside (**McPherson v Watt**). A dishonest agent forfeits commission (**Andrews v Ramsay**), unlike an honest one (**Hippisley v Knee Bros**). Under a non-exclusive agency the agent earns commission only as the effective cause of the sale (**Grandhome v Ng Kok Eng**: commission promised; agent engendered the buyer\'s interest; offer conveyed; sale to the same buyer at the same price; short time; then the owner may show a break in the chain).\n\n**Application.** Glen hid Mr Yeo\'s $3.8m offer and steered Mdm Rosnah to his wife\'s company at $3.6m while describing it as "a corporate client". These are two separate breaches: suppression of an offer and an undisclosed conflict. The OTP to Pearl was obtained through that breach by a company connected to the agent, so Mdm Rosnah can set it aside before exercise. Glen acted dishonestly, so he forfeits any commission and is liable for her loss. On the sale to Mr Yeo: Glen did introduce him, but he never conveyed Mr Yeo\'s offer; two months passed, and Fiona re-engaged Mr Yeo and negotiated a different price over several weeks. Those facts break the chain of causation, so Fiona is the effective cause. Glen\'s dishonesty would in any case bar his claim.\n\n**Conclusion.** Mdm Rosnah should set aside the Pearl OTP, refuse Glen any commission, claim any loss from him (and HomeTrue Realty), pay Fiona her 1%, and report Glen to the CEA.',
        tricks: ['Name the conflict and the suppressed offer as two breaches.', 'Grandhome: tick the five elements, then test for a break in the chain.'] }
    ]
  });

  LL.addCase({
    id: 'new-bukit', title: 'The Bukit Timah bungalow', src: 'New case in the practice-paper style',
    chs: [7, 9, 5], marks: 40, mins: 45, kind: 'exam',
    parties: ['Ah Huat', 'Sophie', 'Pinnacle Bank'],
    facts: 'Three siblings, Ah Huat, Mei and Kenneth, inherited their parents\' bungalow off Bukit Timah Road and are registered as joint tenants.\n\nMei lives in Australia. In March 2026 she signed a declaration of severance in the approved form and posted copies to both brothers, who received them. She instructed her Singapore lawyer to register it, but the lawyer put it off. Mei died in a road accident in May 2026, before anything was registered. Her Will leaves "everything I own" to her daughter Sophie.\n\nKenneth was deep in debt. In July 2026 he forged Ah Huat\'s signature on a transfer of the whole bungalow to his business partner Victor for $2 million; the bungalow is worth about $6 million. Victor\'s conveyancing lawyer queried the price and the signature, which looked nothing like Ah Huat\'s signature on earlier documents. Victor told him to "just push it through". The transfer was registered.\n\nIn August 2026 Victor borrowed $3 million from Pinnacle Bank, secured on the bungalow. Pinnacle carried out its usual searches, dealt only with Victor as registered proprietor, had no reason to suspect anything, and registered its charge. The terms include: (1) default interest of 24% a year on overdue sums, against a contract rate of 4%; (2) an option for Pinnacle to buy the bungalow for $3.5 million if Victor defaults; and (3) no redemption before August 2031.\n\nVictor has stopped paying and cannot be found. Ah Huat has just discovered the transfer.',
    parts: [
      { label: '(a)', marks: 15, ask: '(a) Advise Sophie on whether she has any interest in the bungalow. (15 marks)',
        issues: [{ name: 'Survivorship and failed severance', ch: 7, points: [
          { t: 'The siblings are joint tenants; on Mei\'s death her interest passes by survivorship unless the joint tenancy was severed first.', m: 3, k: ['survivorship', 'joint tenan'] },
          { t: 'Statutory severance needs declaration, service and registration (s 53(5),(6) LTA); it takes effect only on registration (Chan Lung Kien v Chan Shwe Ching, overruling Diaz v Diaz). Registration never happened, so no statutory severance.', m: 5, k: ['chan lung kien|diaz', 'regist', '§53|declaration'] },
          { t: 'No equitable severance: a unilateral declaration is not acting on her share, and there is no mutual agreement or course of dealing (Williams v Hensman; Burgess v Rawnsley).', m: 3, k: ['hensman|mutual|course of dealing|burgess'] },
          { t: 'The Will cannot pass a joint share, so Sophie takes nothing in the bungalow; Ah Huat and Kenneth hold the whole as joint tenants.', m: 2, k: ['will', 'sophie'] },
          { t: 'Sophie (as beneficiary of Mei\'s estate) may have a claim in negligence against Mei\'s lawyer for failing to register in time [check].', m: 2, k: ['negligen|lawyer|solicitor'] }
        ] }],
        model: '**Issue.** Was the joint tenancy severed before Mei died, so that her share passed under her Will to Sophie?\n\n**Law.** A joint tenant\'s interest passes by survivorship and cannot pass by Will (**Shafeeg v Fatimah**). Statutory severance needs a declaration in the approved form, service on every other joint tenant, and registration, and it takes effect on registration (**s 53(5), (6) LTA**; **Chan Lung Kien v Chan Shwe Ching**, overruling **Diaz v Diaz**). In equity a joint tenancy is severed by acting on one\'s own share, mutual agreement or mutual course of dealing (**Williams v Hensman**); failed talks do not sever (**Burgess v Rawnsley**).\n\n**Application.** Mei completed the first two statutory steps only. Under Chan Lung Kien, the lack of registration is fatal, however close she came. A declaration expressing her wish is not an act on her share (no sale, mortgage or contract), and there is no agreement or course of dealing with her brothers. Her Will cannot sever.\n\n**Conclusion.** The joint tenancy continued. On Mei\'s death Ah Huat and Kenneth took the whole by survivorship, and Sophie takes nothing in the bungalow. Sophie should consider a negligence claim against Mei\'s lawyer for the delay [check].' },
      { label: '(b)', marks: 15, ask: '(b) Advise Ah Huat on whether he can recover the bungalow, and on the effect of Pinnacle Bank\'s charge. (15 marks)',
        issues: [{ name: 'Indefeasibility, fraud and the bank', ch: 9, points: [
          { t: 'Registration gives indefeasible title (s 46(1) LTA); Singapore follows immediate indefeasibility (Frazer v Walker), so a forged instrument alone does not defeat an innocent registered purchaser.', m: 3, k: ['§46|indefeasib', 'frazer'] },
          { t: 'Victor: warned about the price and signature, he said "just push it through": suspicion aroused and inquiry deliberately avoided, i.e. wilful blindness amounting to fraud (Waimiha; UOB v Bebe); he is also not a purchaser in good faith (s 4); his title is defeasible under s 46(2)(a).', m: 4, k: ['wilful|blind|waimiha', 'bebe|dishonest|fraud'] },
          { t: 'Pinnacle Bank: an innocent purchaser for value who registered; Victor\'s fraud is not the bank\'s (he is not its agent); s 47(1) means no duty to look behind the register; each proprietor judged separately, so the charge is indefeasible.', m: 4, k: ['pinnacle|bank', 'innocent|good faith|purchaser', 'separate|own (fraud|conduct)|agent|§47'] },
          { t: 'Ah Huat\'s remedies: rectification against Victor (s 160), so the title returns subject to Pinnacle\'s charge; lodge a caveat (s 115); sue Kenneth and Victor; Assurance Fund (ss 151, 155) unlikely without Registry error.', m: 4, k: ['§160|rectif', 'assurance fund|§151|§155', 'caveat|§115'] }
        ] }],
        model: '**Issue.** (1) Is Victor\'s registered title indefeasible? (2) Does Pinnacle Bank\'s registered charge bind Ah Huat? (3) What can Ah Huat do?\n\n**Law.** Registration is the root of title (**s 45 LTA**). Under **s 46(1)** a registered proprietor holds free of encumbrances, and Singapore follows immediate indefeasibility (**Frazer v Walker**). Only purchasers in good faith for value are protected (**s 4**; **s 46(3)**). **s 46(2)(a)** removes protection where the proprietor or his agent was party to fraud or forgery; fraud means actual dishonesty, and wilful blindness counts (**Assets Co v Mere Roihi**; **Waimiha Sawmilling**; **UOB v Bebe**). A person dealing with a proprietor need not look behind the register (**s 47(1)**). The court may rectify (**s 160**). The Assurance Fund compensates loss caused by Registry error (**ss 151, 155**).\n\n**Application.** Victor was warned by his own lawyer that the signature did not match and that $2 million was a third of the value; his response, "just push it through", is a decision not to learn the truth. That is wilful blindness, equal to fraud, so his title is defeasible, and he is no purchaser in good faith. Pinnacle Bank searched, dealt only with the registered proprietor and had no reason for suspicion. Victor\'s fraud is not the bank\'s fraud, and the bank need not look behind the register, so its charge is indefeasible (as with UOB in Bebe and the mortgagee in Frazer v Walker). Ah Huat should apply under s 160 to cancel Victor\'s registration; he recovers the bungalow, but subject to Pinnacle\'s charge. He should caveat immediately (s 115) to stop further dealings and sue Kenneth and Victor. The Assurance Fund will not respond to Kenneth\'s forgery alone; nothing suggests Registry error.\n\n**Conclusion.** Victor\'s title falls; Pinnacle\'s charge stands; Ah Huat recovers the bungalow subject to the charge and looks to Kenneth and Victor for his loss.' },
      { label: '(c)', marks: 10, ask: '(c) Advise Ah Huat on the terms of Pinnacle Bank\'s charge. (10 marks)',
        issues: [{ name: 'Clogs, penalty and lock-in', ch: 5, points: [
          { t: '24% default interest against a 4% contract rate is out of all proportion to the bank\'s greatest conceivable loss: a penalty (Hong Leong Finance v Tan Gin Huay); the bank recovers the contract rate plus actual loss.', m: 3, k: ['penalt|hong leong', 'contract rate|4%|proportion'] },
          { t: 'The option for the bank to buy at $3.5m on default is part of the mortgage and stops redemption: a void clog (Samuel v Jarrah Timber); note Citicorp\'s leniency for sophisticated commercial borrowers [check].', m: 4, k: ['samuel|jarrah|option', 'clog|equity of redemption'] },
          { t: 'The five-year lock-in: postponement is valid unless redemption becomes illusory (Fairclough; Knightsbridge); a freehold-style bungalow keeps its value, so it likely stands; Ah Huat, taking subject to the charge, may redeem by paying principal, contract interest and costs.', m: 3, k: ['fairclough|knightsbridge|lock[- ]?in|postpone', 'redeem|redemption'] }
        ] }],
        model: '**Issue.** Which of the charge\'s terms bind Ah Huat, who recovers the bungalow subject to the charge?\n\n**Law.** A default rate out of all proportion to the lender\'s greatest conceivable loss is a penalty (**Hong Leong Finance v Tan Gin Huay**). An option for the mortgagee to buy the mortgaged property, given as part of the mortgage, is a void clog (**Samuel v Jarrah Timber**), though Singapore has shown leniency between sophisticated commercial parties (**Citicorp v Wee Ah Kee** [check]). A postponement is void only if it makes redemption illusory (**Fairclough**); commercial parties are held to it (**Knightsbridge**).\n\n**Application.** 24% against 4% is six times the contract rate; on Hong Leong it is a penalty, so only the contract rate and actual loss are recoverable. The $3.5m option on a $6m bungalow exists to let the bank take the property on default; it is a classic clog and void, and Victor\'s commercial status should not save a term so obviously repugnant to redemption. The lock-in to 2031 leaves the bungalow\'s value intact, so redemption is not illusory and the term likely stands, subject to any disproportionate early-redemption charge.\n\n**Conclusion.** Ah Huat can redeem by paying the principal, interest at 4% and costs; the default rate and the option do not bind him; the lock-in probably does.',
        tricks: ['Part (b) feeds part (c): Ah Huat takes the bungalow subject to the indefeasible charge, so the charge terms now matter to him.'] }
    ]
  });

  LL.addCase({
    id: 'new-serangoon', title: 'The Fongs\' Serangoon Gardens house', src: 'New case in the practice-paper style',
    chs: [8, 10, 4, 3], marks: 40, mins: 45, kind: 'exam',
    parties: ['Priya', 'the Fongs', 'Mr Wee'],
    facts: 'Mr and Mrs Fong own a semi-detached house in Serangoon Gardens with registered title. Their agent, Daniel, showed it to Priya. Priya asked Daniel whether the attic ever leaked. Daniel replied, "The roof was completely redone in 2024. No leaks." In fact the Fongs had told Daniel that the roof had leaked several times and had only been patched.\n\nOn 1 October 2026 the Fongs granted Priya an option to purchase at $3.1 million for an option fee of 1%. The OTP said it could be exercised "by signing the acceptance copy at the Sellers\' solicitors\' office and delivering a cheque for 4% of the price, by 4 pm on 15 October 2026". On 14 October the Fongs received an offer of $3.3 million from someone else. On 15 October Priya emailed a scanned signed acceptance copy to the solicitors at 3.50 pm with a screenshot of a bank transfer for 4%. She arrived at the office and signed in person at 4.40 pm. The Fongs say the option has lapsed. Priya wants the house; she has since learned about the leaks.\n\nThe Fongs\' title includes a registered right of way over the driveway of No. 23, owned by Mr Wee, to reach their garage. Mr Wee now parks his two cars across the driveway every evening and says the Fongs may only walk across it. Mr Wee\'s late father used to let the Fongs\' gardener take a shortcut across his front yard; Mr Wee has told the gardener to stop. Mr Wee has also begun digging a basement pool next to the boundary without any shoring. Cracks have appeared in the Fongs\' boundary wall and part of their garden has subsided.\n\nWhen the estate was developed in 1995, the developer\'s transfer of No. 23 contained a covenant, entered on the Certificate of Title, "not to erect any building exceeding two storeys", for the benefit of the land now owned by the Fongs. Mr Wee has submitted plans for a three-storey extension.',
    parts: [
      { label: '(a)', marks: 20, ask: '(a) Advise Priya on whether she has a contract to buy the house, and on any claim arising from what Daniel told her. (20 marks)',
        issues: [
          { name: 'Exercise of the OTP', ch: 8, points: [
            { t: 'An OTP is an irrevocable offer; the contract arises only on exercise (Spiro v Glencrown); exercise must follow the stated mode and time strictly (JT Chanrai).', m: 5, k: ['spiro|irrevocable', 'chanrai|strict', 'exercis'] },
            { t: 'Apply: the OTP required signing at the office and delivering a cheque by 4 pm; the email and transfer screenshot were not the stated mode and the in-person signing was late, so the option likely lapsed; Priya\'s only argument is waiver of strict compliance by the Fongs.', m: 4, k: ['lapse|late|4 ?pm|deadline|mode', 'waiv'] },
            { t: 'If lapsed: no contract; the Fongs may sell to the $3.3m buyer; Priya has no caveatable interest, and the 1% option fee bought the option and is not refundable.', m: 2, k: ['option fee|1%|no contract'] },
            { t: 'If validly exercised: specific performance is the usual but discretionary remedy (EC Investment), and Priya\'s equitable interest would support a caveat.', m: 3, k: ['specific performance|ec investment', 'caveat'] }
          ] },
          { name: 'Misrepresentation by the agent', ch: 8, points: [
            { t: '"Roof completely redone, no leaks" is a statement of fact, not opinion or puff; it was false and induced Priya; made within Daniel\'s authority, it binds the Fongs; Daniel knew the truth, so it is fraudulent (Derry v Peek) or at least negligent (s 2(1) Misrepresentation Act); remedies: rescission and/or damages (or damages alone if she affirms); act promptly to avoid affirmation.', m: 6, k: ['misrepresent', 'derry|2\\s*\\(1\\)|fraudulent|negligent', 'rescission|rescind|damages', 'authority|agent|daniel'] }
          ] }
        ],
        model: '## The option\n**Issue.** Did Priya validly exercise the OTP, so that a contract of sale exists?\n**Law.** An OTP is an irrevocable offer to the buyer and a conditional contract for the seller; the contract arises on exercise (**Spiro v Glencrown**). Exercise must follow the OTP\'s terms strictly, in time and mode (**JT Chanrai v Consolidated Hotels**). A contract would make Priya owner in equity, and specific performance is the usual but discretionary remedy (**EC Investment v Ridout Residence**).\n**Application.** The OTP specified signing at the solicitors\' office and delivering a cheque by 4 pm. Priya\'s email and transfer screenshot at 3.50 pm were not the stated mode, and her personal signature came at 4.40 pm, after the deadline. On the strict approach the option lapsed at 4 pm. Her only argument is that the Fongs\' solicitors waived strict compliance (for example by accepting the documents without objection); nothing in the facts shows that.\n**Conclusion.** Probably no contract: the Fongs may accept the $3.3m offer. Priya should not caveat (no interest), and the option fee is not refundable. If a court did find valid exercise, she could seek specific performance and should caveat at once.\n\n## Daniel\'s statement\n**Issue.** Is "the roof was completely redone in 2024, no leaks" an actionable misrepresentation, and against whom?\n**Law.** A misrepresentation is an untrue statement of fact that induces the contract; fraudulent (**Derry v Peek**), negligent (**s 2(1) Misrepresentation Act**) or innocent (**s 2(2)**). Opinions and puffs are outside it. A principal is bound by statements its agent makes within authority (**Freeman & Lockyer**).\n**Application.** The statement is specific fact, not sales talk. It was false, and Priya asked the very question, so it induced her. Daniel had been told about the leaks, so he made it knowing it was untrue (fraudulent), or at least without reasonable grounds (negligent). Describing the property is within an estate agent\'s authority, so the Fongs are bound.\n**Conclusion.** If a contract exists, Priya may rescind or keep the house and claim damages from the Fongs (and Daniel); she must act promptly, as delay risks affirmation. If there is no contract, the statement still affected her decision to pay the option fee and supports a damages claim [check].' },
      { label: '(b)', marks: 20, ask: '(b) Advise the Fongs on their rights against Mr Wee. (20 marks)',
        issues: [
          { name: 'Right of way and the gardener', ch: 4, points: [
            { t: 'The registered right of way is an express easement (dominant: Fongs; servient: No. 23); it satisfies Re Ellenborough Park and binds Mr Wee as the servient owner; parking across the driveway substantially interferes with it; remedy: injunction and damages.', m: 5, k: ['easement', 'ellenborough|dominant|servient', 'injunction|obstruct|interfer'] },
            { t: 'The gardener\'s shortcut was permission from Mr Wee\'s father: a bare licence, personal and revocable, not an easement (no grant); estoppel needs promise, reliance and detriment, not shown; Mr Wee may revoke it.', m: 4, k: ['licence', 'revoc|bare'] }
          ] },
          { name: 'Support', ch: 4, points: [
            { t: 'Natural right of support for land; Xpress Print v Monocrafts extends the neighbour\'s duty to buildings (the boundary wall) in Singapore; digging without shoring removes support without adequate alternative support; also negligence; remedies: injunction to stop works until support is secured, damages for repair.', m: 6, k: ['xpress print|monocrafts', 'support', 'negligen|shoring|injunction'] }
          ] },
          { name: 'The height covenant', ch: 3, points: [
            { t: 'The covenant is negative (restricts building), so its burden can run in equity: Mr Wee is a successor with notice (entered on the CT), it touches and concerns the benefited land and was meant to bind successors (Tulk v Moxhay); the Fongs hold the benefit (annexation / Swift); remedy: injunction against the third storey.', m: 5, k: ['tulk|moxhay', 'negative|restrictive', 'benefit|annex|swift|injunction'] }
          ] }
        ],
        model: '## The driveway\n**Issue.** Can Mr Wee restrict the Fongs to walking across his driveway?\n**Law.** An easement must satisfy **Re Ellenborough Park** (dominant and servient tenements; accommodation; different owners; capable of grant). An express easement on the register binds the servient owner. Substantial interference with it is actionable.\n**Application.** The Fongs\' title carries a registered right of way to reach their garage. All four tests are met. Parking two cars across the driveway every evening blocks vehicle access, a substantial interference.\n**Conclusion.** The Fongs can obtain an injunction and damages.\n\n## The gardener\'s shortcut\nNo grant exists; Mr Wee\'s father simply allowed it. That is a bare licence: personal and revocable, binding no successor (**Ashburn Anstalt**). No promise of permanence and no detrimental reliance appear, so there is no estoppel (**Inwards v Baker**). Mr Wee may withdraw it.\n\n## Support\n**Issue.** Is Mr Wee liable for the cracked wall and the subsidence?\n**Law.** Every landowner may expect support from neighbouring land; a neighbour must secure alternative support before removing soil. In England buildings need an easement of support (**Dalton v Angus**), but in Singapore **Xpress Print v Monocrafts** extends the duty to buildings. Negligence also applies to excavation without proper care.\n**Application.** Mr Wee dug beside the boundary with no shoring, and the garden subsided and the wall cracked: removal of support without adequate alternative support, and a lack of reasonable care.\n**Conclusion.** Injunction to stop the works until support is secured, damages for repair, and loss flowing from the damage.\n\n## The height covenant\n**Issue.** Can the Fongs stop the three-storey extension?\n**Law.** The burden of a negative covenant runs in equity to a successor with notice where it benefits identifiable land and was intended to bind successors (**Tulk v Moxhay**); the benefit passes by annexation or under Swift.\n**Application.** "Not to erect any building exceeding two storeys" restricts use and costs nothing: negative. It benefits the Fongs\' land, was meant to bind successors, and is on the CT, so Mr Wee has notice.\n**Conclusion.** The Fongs can obtain an injunction against the third storey.',
        tricks: ['Four separate neighbour issues: give each its own short ILAC.', 'Support: state the English line, then Xpress Print, then negligence.'] }
    ]
  });
})(window.LL);

/* js/content/cases-drill.js */
/* Shorter case-study drills (6–20 marks). One ILAC answer each, marked against the scheme. */
(function (LL) {
  'use strict';
  function drill(o) { o.kind = o.kind || 'drill'; o.mins = o.mins || Math.round(o.marks * 1.2 + 3); LL.addCase(o); }
  function one(ask, marks, name, ch, points, model, tricks) {
    return [{ label: '', marks: marks, ask: ask, issues: [{ name: name, ch: ch, points: points }], model: model, tricks: tricks || [] }];
  }

  drill({ id: 'kfm', title: 'James and KFM Property Agency', src: 'Practice paper, sample case study 1', chs: [10], marks: 15, parties: ['James', 'KFM'],
    facts: 'James hired KFM Property Agency ("the Agency") to sell four of his industrial units for an agreed commission of 2%. It was also agreed that James would pay for KFM\'s expenses incurred for this purpose.\n\nThe Agency sold the units and earned the agreed commission from James. However, the Agency had enjoyed a discount when it incurred advertising, marketing and printing expenses for James in relation to the sale. Although the discount was a custom of the trade, the practice was not known to James. (The paper calls the principal "Jacob" once.)',
    parts: one('Discuss the legal position of the Agency and James. (15 marks)', 15, 'Secret profit by an honest agent', 10, [
      { t: 'KFM is James\'s agent and a fiduciary: duties of good faith, disclosure, no conflict, no secret profit.', m: 3, k: ['fiduciar', 'secret profit|disclos'] },
      { t: 'Charging full price while paying a discounted price is a secret profit; a trade custom unknown to the principal is no defence (Hippisley v Knee Bros).', m: 4, k: ['hippisley|knee', 'custom'] },
      { t: 'Disclosure and consent would have cured it; on the facts James was never told.', m: 2, k: ['consent|disclos'] },
      { t: 'Remedy: KFM must account for / repay the discounts; reimbursement only for expenses actually incurred.', m: 3, k: ['account|repay|reimburs'] },
      { t: 'Commission: an honest agent keeps the earned commission (Hippisley); forfeiture is for dishonest agents (Andrews v Ramsay); CEA Code reflects the same principles.', m: 3, k: ['commission', 'andrews|honest'] }
    ], '**Issue.** (1) Did KFM breach a fiduciary duty by keeping the trade discounts? (2) What may James recover or withhold?\n\n**Law.** An agent owes fiduciary duties of good faith, disclosure and loyalty, must not make a secret profit and must account for it (**Hippisley v Knee Brothers**). A custom of the trade does not excuse the agent where the principal did not know of it (**Hippisley**). A disclosed profit with the principal\'s consent is allowed. A dishonest agent may also forfeit commission (**Andrews v Ramsay**). A CEA-regulated agent must also meet the Code of Ethics.\n\n**Application.** KFM charged James for third-party services at full price while paying a discounted price, keeping a secret profit from its position. KFM acted honestly in following industry practice, but honesty is no defence to the strict rule, and a custom James did not know of and did not agree to cannot override the duty of disclosure. Had KFM disclosed and James consented, there would be no breach. Remedies: James may require KFM to account for the discounts; KFM can claim reimbursement only for the expenses it actually incurred. KFM likely keeps its 2% commission, earned on completed sales by an honest agent (Hippisley), although James may argue disloyalty justifies forfeiture (Andrews v Ramsay) [check].\n\n**Conclusion.** KFM breached its fiduciary duty and must account to James for the discounts. It will probably keep its commission because it acted honestly.') });

  drill({ id: 'printwell', title: 'Printwell and Costco', src: 'Practice paper, sample case study 2', chs: [4], marks: 15, parties: ['Printwell', 'Costco'],
    facts: 'Printwell Pte Ltd operated a four-storey printing factory on industrial land ("the Factory"). Costco Enterprises owned the adjoining land and shared a common boundary with Printwell.\n\nIn 2024 Costco began excavation and piling works to construct a basement car park on its land. The works involved cutting close to the common boundary. As advised by Costco\'s engineers, its contractor installed sheet piles as support. However, Costco did not implement a continuous monitoring regime over the works. Within weeks, cracks appeared on the access roads and pavements on Costco\'s land. There was also damage to the Factory due to soil settlement, and the Factory was forced to suspend operations.\n\n(The paper writes "Cosco", "Costco" and "Basco" for the same neighbour.)',
    parts: one('Discuss Printwell\'s and Costco\'s legal positions. (15 marks)', 15, 'Right of support and negligence', 4, [
      { t: 'Natural right of support from adjoining land; the neighbour must secure alternative support before removing soil.', m: 3, k: ['natural right|right of support', 'alternative support|support'] },
      { t: 'English line: buildings need an easement of support (Dalton v Angus); Singapore: Xpress Print v Monocrafts extends the duty to buildings.', m: 4, k: ['xpress print|monocrafts', 'dalton|building'] },
      { t: 'Engineers\' advice does not displace Costco\'s own duty; Costco may seek contribution from its engineers or contractor.', m: 2, k: ['engineer|contractor|contribution'] },
      { t: 'Negligence: foreseeable damage; no continuous monitoring despite early warning cracks; consequential loss of profit recoverable as it follows physical damage.', m: 4, k: ['negligen', 'monitor', 'loss of profit|consequential|suspen'] },
      { t: 'Costco\'s replies (building weight, engineers\' advice, mitigation) and Printwell\'s injunction to halt works until support is secured; conclusions for both.', m: 2, k: ['injunction|mitigat'] }
    ], '**Issue.** (1) Is Costco liable to Printwell for the damage to its land and factory? (2) What can Printwell recover, and what can Costco say in reply?\n\n**Law.** A landowner has a natural right of support from adjoining soil; the neighbour must secure alternative support before removing soil. In **Xpress Print v Monocrafts** the Court of Appeal held the duty extends to the claimant\'s property, including buildings, and was breached where soil was removed without sufficient alternative support. Under English authority the natural right protects land only, and a building needs an easement of support (**Dalton v Angus**), so state both. A claim also lies in negligence; consequential loss that follows physical damage is recoverable. The cause of action arises when the damage happens (**Backhouse v Bonomi**).\n\n**Application.** Costco excavated next to the boundary and settlement followed within weeks: it removed support without sufficient alternative support. Xpress Print extends the duty to the factory, so Printwell needs no easement. Following engineers\' advice does not displace Costco\'s duty as the landowner doing the works; Costco can seek contribution from its engineers or contractor. In negligence, damage to a four-storey factory beside a basement dig was foreseeable; Costco set up no continuous monitoring, and cracks on its own roads gave early warning. Heads of loss: repair costs and loss of profit during the suspension. Costco\'s answers: the building\'s weight contributed; the works followed engineers\' advice; Printwell must mitigate. Printwell can seek an injunction to stop further works until support is secured.\n\n**Conclusion.** Printwell has strong claims under Xpress Print and in negligence, including loss of profit. Costco should secure the site, notify Printwell and seek contribution from its engineers and contractor.') });

  drill({ id: 'ong', title: 'Mr Ong, Seng, Bobby and Harbour Bank', src: 'Q&A Bank, Question A', chs: [9], marks: 20, parties: ['Mr Ong', 'Bobby', 'Harbour Bank'],
    facts: 'Mr Ong is the registered proprietor of a terrace house at Lorong Ah Soo worth about $2.4m. While he worked in Shanghai, his nephew Seng forged his signature on a transfer of the house to Seng\'s friend Bobby for $900,000. Bobby\'s lawyer warned him that the "Mr Ong" signature looked nothing like the specimen on file and that the price was far below market. Bobby replied: "Don\'t ask so many questions, just register it." Bobby paid Seng in cash. The transfer was registered in Bobby\'s name.\n\nA month later Bobby mortgaged the house to Harbour Bank for $1.5m. Harbour Bank carried out its usual checks, dealt only with Bobby as registered proprietor, had no reason to suspect anything and registered its mortgage. Bobby has stopped paying. Mr Ong has just returned.',
    parts: one('Advise Mr Ong. (20 marks)', 20, 'Torrens: forgery and indefeasibility', 9, [
      { t: 'Registration is the root of title; s 46(1) immediate indefeasibility (Frazer v Walker); only purchasers in good faith for value benefit (s 4; s 46(3)).', m: 4, k: ['§46|indefeasib', 'frazer'] },
      { t: 's 46(2)(a): fraud or forgery by the proprietor or his agent; fraud = actual dishonesty (Assets Co; UOB v Bebe); wilful blindness counts (Waimiha).', m: 4, k: ['§46|fraud', 'bebe|assets co|mere roihi', 'wilful|waimiha'] },
      { t: 'Bobby: warned about signature and price, refused inquiry: wilful blindness; also not a purchaser in good faith; title defeasible.', m: 4, k: ['bobby', 'warn|suspic|blind'] },
      { t: 'Harbour Bank: innocent purchaser for value; Bobby\'s fraud is not the bank\'s (not its agent); s 47(1); charge indefeasible (as in Bebe).', m: 4, k: ['harbour|bank', 'innocent|good faith|§47'] },
      { t: 'Remedies: rectification s 160 (house returns subject to the charge); caveat s 115; sue Seng and Bobby; Assurance Fund (ss 151, 155) unlikely without Registry error.', m: 4, k: ['§160|rectif', 'assurance fund|§155|§151', 'caveat|§115'] }
    ], '**Issue.** (1) Is Bobby\'s registered title indefeasible? (2) Does Harbour Bank\'s mortgage bind Mr Ong? (3) What remedies does Mr Ong have?\n\n**Law.** Registration is the root of title (**s 45 LTA**; **Breskvar v Wall**). Under **s 46(1)** a registered proprietor holds free of encumbrances; Singapore follows immediate indefeasibility (**Frazer v Walker**). Only a purchaser in good faith for value benefits (**s 4**; **s 46(3)**). **s 46(2)(a)** removes protection where the proprietor or his agent was party to fraud or forgery. Fraud means actual dishonesty (**Assets Co v Mere Roihi**; **UOB v Bebe**; s 47(2)); deliberately shutting one\'s eyes after suspicion is aroused is akin to fraud (**Waimiha Sawmilling**). The court may rectify (**s 160**); the Assurance Fund compensates Registry error (**ss 151, 155**).\n\n**Application.** Bobby: his lawyer warned him that the signature did not match and that $900,000 was far below the $2.4m value; suspicion was aroused, and "Don\'t ask so many questions, just register it" is a decision to avoid the truth: wilful blindness. Paying cash and pressing for registration support dishonesty. s 46(2)(a) applies and he is not a purchaser in good faith. Harbour Bank dealt with the registered proprietor, made its usual checks and had no reason to suspect; Bobby\'s fraud is not the bank\'s (he is not its agent), and s 47(1) means it need not look behind the register. As in Bebe, the innocent mortgage is indefeasible even though Bobby\'s title is not. Remedies: Mr Ong applies under s 160 to cancel Bobby\'s registration; the house returns to him subject to the charge. He should caveat at once (s 115) and sue Seng and Bobby. The Assurance Fund will not respond to Seng\'s forgery alone; there is no sign of Registry error.\n\n**Conclusion.** Bobby\'s title is defeasible and Mr Ong can recover the house, but subject to Harbour Bank\'s indefeasible $1.5m mortgage. He should recover his loss from Seng and Bobby.', ['Take each registered person in turn: purchaser? fraud by that person? overriding interest?', 'Name the safety nets: rectification, caveat, claim against the wrongdoer, and the Assurance Fund (and why it probably fails).']) });

  drill({ id: 'lee', title: 'The Lees, Kelvin, Star Realty and Orchid Holdings', src: 'Q&A Bank, Question B', chs: [10], marks: 20, parties: ['the Lees', 'Kelvin', 'Star Realty', 'Orchid'],
    facts: 'Mr and Mrs Lee appointed Uncle Kelvin, a CEA-registered salesperson with Star Realty, to sell their Toa Payoh condominium unit at 1% commission payable on completion. Kelvin told them the market was "very quiet" and that only Orchid Holdings Pte Ltd had offered, at $1.18m. Two independent valuations put the unit at about $1.25m. In fact two other buyers had offered $1.32m, and Kelvin never passed those offers on. Orchid Holdings is owned by Kelvin\'s cousin. Kelvin also received a $4,000 "appreciation fee" from Orchid. The Lees granted Orchid an OTP, which has been exercised. Completion is next month. The Lees have just discovered the truth.',
    parts: one('Advise the Lees of their rights against Kelvin, Star Realty and Orchid Holdings. (20 marks)', 20, 'Fiduciary breach and bribery', 10, [
      { t: 'Kelvin is a fiduciary: undisclosed conflict in steering the sale to his cousin\'s company (McPherson v Watt).', m: 4, k: ['fiduciar', 'mcpherson|conflict|cousin'] },
      { t: 'Withholding the $1.32m offers breaches the duties to disclose, follow instructions and use care; loss about $140,000.', m: 4, k: ['offer|disclos', '140|1\\.32'] },
      { t: 'The $4,000 is a bribe: account; constructive trust (FHR v Cedar); dishonest agent forfeits commission (Andrews v Ramsay; contrast Hippisley).', m: 5, k: ['bribe|secret commission', 'fhr|cedar|constructive trust', 'andrews|forfeit'] },
      { t: 'Against Orchid: rescind the exercised OTP before completion (act promptly, restore position, avoid affirming) or affirm and claim damages.', m: 4, k: ['rescind|rescission', 'orchid'] },
